<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a74f0">
<title>Duelist</title>
<!-- Duelist game 0.7 · Telegram build · online server v1.2 -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>html,body{background:#2a74f0}body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one-screen phone app in a chunky cartoon style — thick ink outlines, bright colours,
   glossy "pressable" buttons, heavy rounded type. Blue sky with diagonal stripes as the ground.
   Blue (#3d9bff) vs orange (#ff8a2a) are the two players everywhere; each game has its own card colour.
   Committed single bright theme on purpose. */
:root{
  --ink:#1b1236;
  --sky1:#45a8ff; --sky2:#2a74f0; --sky3:#1d4fc4;
  --yellow:#ffd84a; --yellow-d:#f2b500; --yellow-l:#fff3b8;
  --blue:#3d9bff; --blue-d:#1d64cc; --blue-l:#9fd0ff;
  --orange:#ff8a2a; --orange-d:#cc5f00; --orange-l:#ffc48c;
  --green:#36c45a; --green-d:#239140; --purple:#9b5cff; --red:#ff4d5e; --gold:#ffc23a;
  --paper:#ffffff; --soft:#eef3ff; --muted:#c9d6ff; --muted-ink:#5d5584;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{min-height:100%;margin:0;background:var(--sky2);color:#fff;font-family:var(--body);font-weight:800;font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.app{min-height:100%;max-width:480px;margin:0 auto;padding-inline:16px;padding-block:14px 22px;display:flex;flex-direction:column;gap:12px;
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 16px,rgba(255,255,255,0) 16px 32px),linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);min-height:100vh}
.ol{text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 4px 0 var(--ink)}
.ols{text-shadow:1.5px 0 0 var(--ink),-1.5px 0 0 var(--ink),0 1.5px 0 var(--ink),0 -1.5px 0 var(--ink),0 3px 0 var(--ink)}

/* chunky buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;text-align:center;border:3px solid var(--ink);border-radius:16px;padding:12px 14px 14px;font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.02em;line-height:1.05;transition:transform .06s}
.btn svg{width:26px;height:26px;flex:none}
.btn:active{transform:translateY(4px)}
.btn small{display:block;font-family:var(--body);font-size:13px;font-weight:800;letter-spacing:0;opacity:.85}
.btn.y{background:var(--yellow);color:var(--ink);box-shadow:0 7px 0 var(--ink),inset 0 -6px 0 var(--yellow-d),inset 0 4px 0 var(--yellow-l)}
.btn.b{background:var(--blue);color:#fff;box-shadow:0 6px 0 var(--ink),inset 0 -5px 0 var(--blue-d),inset 0 3px 0 var(--blue-l)}
.btn.o{background:var(--orange);color:#fff;box-shadow:0 6px 0 var(--ink),inset 0 -5px 0 var(--orange-d),inset 0 3px 0 var(--orange-l)}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--ink),inset 0 -5px 0 #c9d6ef}
.btn.big{font-size:25px;padding:15px 16px 17px;border-radius:18px}
.btn:active.y,.btn:active.b,.btn:active.o,.btn:active.w{box-shadow:0 2px 0 var(--ink)}
.btn[disabled]{opacity:.55}
.link{background:none;color:#fff;text-decoration:underline;text-underline-offset:3px;padding:6px 4px;font-weight:800;font-size:15px;opacity:.9}
.chip{display:flex;align-items:center;gap:6px;background:var(--ink);border-radius:999px;padding:6px 12px;font-family:var(--display);font-size:17px}
.chip svg{width:18px;height:18px}

/* menu */
.menu{display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:10px;background:var(--ink);border-radius:999px;padding:5px 14px 5px 5px;min-width:0}
.avatar{width:38px;height:38px;flex:none;border-radius:50%;background:var(--blue);border:3px solid #fff;display:grid;place-items:center;font-family:var(--display);font-size:20px}
.me b{font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;display:block}
.me button{color:var(--blue-l);font-size:12px;font-weight:800;padding:0;text-align:left}
.logo{display:flex;align-items:center;justify-content:center;gap:7px;font-family:var(--display);font-size:30px;line-height:1;color:#fff;letter-spacing:.01em}
.logo i{width:12px;height:12px;border-radius:50%;border:2.5px solid var(--ink);display:block}
.hub-title{margin:0;font-family:var(--display);font-weight:400;font-size:44px;line-height:1;text-align:center;text-wrap:balance}
.nickbox{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:12px 14px;display:grid;gap:8px}
.nickbox label{font-family:var(--display);font-size:18px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.input{width:100%;padding:12px 14px;border-radius:14px;border:3px solid var(--ink);background:var(--soft);color:var(--ink);font:inherit;font-size:18px;font-weight:800}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.game{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:10px 12px 12px;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);text-align:left;min-width:0;color:#fff}
.game::before{content:"";position:absolute;left:-20px;right:-20px;top:0;height:46%;background:rgba(255,255,255,.18);border-radius:0 0 50% 50%;pointer-events:none}
.game svg{position:relative;width:60px;height:52px}
.game b{position:relative;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.05}
.game small{position:relative;font-size:12.5px;font-weight:900;opacity:.85}
.game.wide{grid-column:span 2;flex-direction:row;align-items:center;gap:12px}
.game.wide .txt{display:flex;flex-direction:column;gap:2px;position:relative;min-width:0}
.game .tick{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:none;place-items:center}
.game .tick svg{width:16px;height:16px}
.game[aria-checked="true"]{outline:4px solid #fff;outline-offset:-9px}
.game[aria-checked="true"] .tick{display:grid}
.g-pen{background:var(--green)} .g-rps{background:var(--purple)} .g-tug{background:var(--orange)} .g-box{background:var(--red)} .g-qd{background:var(--gold)}
.g-mix{background:var(--ink)}
.g-mix::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--blue) 0 20%,var(--orange) 20% 40%,var(--purple) 40% 60%,var(--red) 60% 80%,var(--gold) 80% 100%);opacity:.25}
.g-mix > *{z-index:1}
.modes{display:grid;gap:10px}
.modes .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.panel{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:12px 14px;display:grid;gap:10px}
.panel h3{margin:0;font-family:var(--display);font-weight:400;font-size:19px}
.panel p{margin:0;color:var(--muted-ink);font-size:15px;line-height:1.4}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--soft);border:2.5px solid var(--ink);border-radius:12px;padding:6px 8px;display:grid}
.tile b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:11.5px;color:var(--muted-ink)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;font-size:14px;align-items:baseline;border-top:2px dashed #d5dcf0;padding-top:7px;font-variant-numeric:tabular-nums}
.srow span{color:var(--muted-ink)} .srow span:first-child{color:var(--ink);font-family:var(--display);font-weight:400;font-size:16px}

/* lobby + queue */
.lobby{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.lobby h2{margin:0;font-family:var(--display);font-weight:400;font-size:40px;line-height:1}
.badge{align-self:flex-start;background:var(--ink);color:var(--yellow);font-family:var(--display);font-size:14px;padding:4px 12px;border-radius:8px;letter-spacing:.06em}
.or{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:15px;opacity:.9}
.or::before,.or::after{content:"";flex:1;height:3px;border-radius:2px;background:rgba(27,18,54,.35)}
.code{font-family:var(--display);font-size:62px;letter-spacing:.25em;line-height:1;padding:14px 0 14px .25em;text-align:center;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);user-select:all}
.joinin{font-family:var(--display);font-size:26px;letter-spacing:.3em;text-transform:uppercase}
.err{min-height:1.4em;margin:0;background:none;color:#fff;font-weight:900}
.err:not(:empty){background:var(--red);border:3px solid var(--ink);border-radius:12px;padding:8px 12px}
.queue{display:grid;gap:14px;justify-items:center;text-align:center;padding:10px 0}
.queue .ball{width:96px;height:96px;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.queue h3{margin:0;font-family:var(--display);font-weight:400;font-size:30px}
.qstats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--green);flex:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* game screen: scoreboard */
.board{display:flex;flex-direction:column;gap:6px;background:var(--ink);border-radius:16px;padding:8px;box-shadow:0 5px 0 rgba(27,18,54,.45)}
.sides{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch}
.side{display:flex;flex-direction:column;gap:5px;border:3px solid #0f0a22;padding:6px 8px;min-width:0}
.side.p0{background:var(--blue);border-radius:12px 4px 4px 12px;box-shadow:inset 0 -4px 0 var(--blue-d)}
.side.p1{background:var(--orange);border-radius:4px 12px 12px 4px;box-shadow:inset 0 -4px 0 var(--orange-d);align-items:flex-end}
.nm{font-family:var(--display);font-size:16px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dots{display:flex;gap:4px;flex-wrap:nowrap}
.dot{flex:none;width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.28);border:2.5px solid #0f0a22;display:grid;place-items:center}
.dot svg{width:8px;height:8px;display:block}
.dot.scored{background:#3ee06a} .dot.missed{background:var(--red)}
.board.long .dot{width:12px;height:12px;border-width:2px}
.sdsep{flex:none;width:2px;height:13px;background:#0f0a22;margin-inline:1px;align-self:center}
.more{flex:none;font-family:var(--display);font-size:12px;align-self:center}
.hp{width:100%;height:13px;border-radius:7px;border:2.5px solid #0f0a22;background:rgba(255,255,255,.28);overflow:hidden}
.hp i{display:block;height:100%;background:#3ee06a;transition:width .4s}
.side.p1 .hp i{margin-left:auto}
.mid{min-width:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--yellow);color:var(--ink);border:3px solid #0f0a22;margin:0 -3px;z-index:1;border-radius:6px;box-shadow:inset 0 -4px 0 var(--yellow-d);padding:2px 6px}
.mid b{font-family:var(--display);font-weight:400;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.mid span{font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.kick{font-family:var(--display);font-size:13px;letter-spacing:.06em;text-align:center;color:var(--muted)}

/* stage */
.stage{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:18px;overflow:hidden;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);background:#5cc0ff;touch-action:manipulation}
#pitch{position:absolute;inset:0;width:100%;height:100%;display:block}
.flash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(27,18,54,.42);text-align:center;padding:16px;animation:pop .28s cubic-bezier(.2,1.6,.4,1)}
.flash b{font-family:var(--display);font-weight:400;font-size:clamp(40px,13vw,60px);line-height:.95;text-wrap:balance}
.flash span{font-size:15px;font-weight:900;color:#fff;background:var(--ink);border-radius:10px;padding:5px 10px;max-width:92%}
@keyframes pop{from{opacity:0;transform:scale(1.25)}}
.handoff{position:absolute;inset:0;background:var(--sky2);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 16px,rgba(255,255,255,0) 16px 32px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.handoff h2{margin:0;font-family:var(--display);font-weight:400;font-size:34px}
.handoff p{margin:0;max-width:28ch;line-height:1.4}
.handoff .btn{width:auto;padding-inline:26px}
.stbtn{position:absolute;width:36px;height:36px;border-radius:50%;background:var(--ink);display:grid;place-items:center;z-index:3;border:2.5px solid #fff}
.stbtn svg{width:18px;height:18px}
#muteBtn{bottom:8px;right:8px} #helpBtn{bottom:8px;left:8px}
.skiphint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:13px;font-weight:900;color:#fff;pointer-events:none;z-index:2;text-shadow:0 1px 0 var(--ink),0 -1px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink)}
.bubble{position:absolute;top:10px;max-width:70%;padding:6px 12px;border-radius:14px;border:3px solid var(--ink);font-family:var(--display);font-size:17px;color:var(--ink);z-index:3;animation:bub 2.8s ease forwards;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble.l{left:10px} .bubble.r{right:10px}
@keyframes bub{0%{opacity:0;transform:translateY(8px) scale(.85)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

/* role banner + picks */
.role{display:flex;align-items:center;gap:12px;padding:8px 14px 10px;border-radius:16px;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);color:#fff}
.role svg{width:34px;height:34px;flex:none}
.role .rt{flex:1;min-width:0}
.role h3{margin:0;font-family:var(--display);font-weight:400;font-size:25px;line-height:1.05}
.role p{margin:0;font-size:14px;font-weight:900;opacity:.92}
.timer{height:7px;border-radius:4px;background:rgba(27,18,54,.35);overflow:hidden;margin-top:6px}
.timer i{display:block;height:100%;background:#fff;width:100%}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pick{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink),inset 0 -5px 0 #c9d6ef;padding:10px 4px 12px;font-family:var(--display);font-size:18px;min-height:76px;justify-content:center}
.pick i{font-style:normal;font-size:28px;line-height:1}
.pick svg{width:30px;height:30px}
.pick:active,.pick.on{background:var(--yellow);box-shadow:0 2px 0 var(--ink),inset 0 -3px 0 var(--yellow-d);transform:translateY(4px)}
.pickset{display:grid;gap:8px}
.pickset h4{margin:0;font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.04em}
.bid{display:grid;gap:10px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:12px}
.bidnum{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bidnum b{font-family:var(--display);font-weight:400;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.bidnum span{font-size:14px;color:var(--muted-ink)}
.bid input[type=range]{width:100%;accent-color:var(--orange);height:28px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.steps button{border:3px solid var(--ink);border-radius:12px;background:var(--soft);font-family:var(--display);font-size:17px;padding:6px 0}
.qdpads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qdpads button{min-height:120px;font-size:24px}

/* waiting, chat, reactions */
.waitbar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--ink)}
.waitbar b{font-family:var(--display);font-weight:400;font-size:21px;display:block}
.waitbar .t{color:var(--muted);font-size:14px}
.social{display:grid;gap:8px;background:rgba(27,18,54,.35);border-radius:16px;padding:8px}
.reacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.reacts button{padding:8px 2px;border-radius:999px;background:var(--ink);font-family:var(--display);font-size:15px}
.reacts button:active{background:var(--yellow);color:var(--ink)}
.chatlog{display:flex;flex-direction:column;gap:4px;max-height:118px;overflow-y:auto;padding:2px}
.msg{align-self:flex-start;max-width:85%;background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:12px 12px 12px 4px;padding:4px 10px;font-size:14px;font-weight:800;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--yellow);border-radius:12px 12px 4px 12px}
.msg b{font-family:var(--display);font-weight:400;font-size:13px;margin-right:4px}
.chatrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px}
.chatrow input{padding:9px 12px;border-radius:12px;border:3px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-size:15px;min-width:0}
.chatrow button{border:3px solid var(--ink);border-radius:12px;background:var(--yellow);color:var(--ink);font-family:var(--display);font-size:15px;padding:0 12px}
.chatrow button.mute2{background:var(--ink);color:#fff;border-color:#fff;font-size:13px}
.actions{display:grid;gap:10px}
.quit{justify-self:center}
.notice{background:var(--red);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:900}

/* tutorial */
.tut{position:fixed;inset:0;z-index:20;background:rgba(27,18,54,.62);display:flex;align-items:center;justify-content:center;padding:18px}
.tutcard{width:100%;max-width:400px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);padding:16px;display:grid;gap:12px;animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
.tutcard h2{margin:0;font-family:var(--display);font-weight:400;font-size:30px;line-height:1}
.tutcard ol{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:s}
.tutcard li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;font-size:15px;line-height:1.35;counter-increment:s}
.tutcard li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--yellow);border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:16px}
@media (prefers-reduced-motion:reduce){ .flash,.bubble,.tutcard{animation:none} .queue .ball{animation-duration:4s} }
</style>

<div class="app">
  <section class="menu" id="menu">
    <div class="topbar">
      <div class="me" id="meChip">
        <div class="avatar" id="meAvatar">?</div>
        <div><b id="meName">Player</b><button type="button" id="changeName">Change name</button></div>
      </div>

<script>
(function(){

  var S = null;

  // Telegram Mini App: header colour, back button, the player's Telegram name.
  var TG = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) ? window.Telegram.WebApp : null;

    try { TG.ready(); TG.expand(); } catch (e) {}
    try { if (tgOk('6.1')){ TG.setHeaderColor('#2a74f0'); TG.setBackgroundColor('#2a74f0'); } } catch (e) {}
    try { if (tgOk('7.7')) TG.disableVerticalSwipes(); } catch (e) {}
  }
  function tgBack(show){
    if (!TG || !tgOk('6.1') || !TG.BackButton) return;
    try { if (show) TG.BackButton.show(); else TG.BackButton.hide(); } catch (e) {}
  }

  /* =====================================================================
     SCENE: a small 3D world in metres, seen by a broadcast camera
     standing behind the penalty taker. x = sideways, y = up, z = toward goal.
     ===================================================================== */
  var F = 650, CX = 200, HZ = -5, CH = 3.6;          // camera: focal length, centre, horizon, height
  var ZS = 9.5, ZG = 20.5, ZN = 22.1, ZK = 20.15;    // ball spot, goal line, back of net, keeper
  var GW = 3.66, GH = 2.44, NH = 1.9, BR = 0.11;     // half goal width, bar height, net back height, ball radius
  var TC = 1.1, TF = 0.46, RESULT_T = TC + 1.55, DT = 1 / 120; // contact time, ball flight, result time

  function proj(v){ var s = F / v[2]; return [CX + v[0] * s, HZ + (CH - v[1]) * s, s]; }
  function gy(z){ return HZ + CH * F / z; }
  function lerp3(a, b, k){ return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }
  function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
  function rotX(v,a){var c=Math.cos(a),s=Math.sin(a);return [v[0], v[1]*c - v[2]*s, v[1]*s + v[2]*c];}
  function rotY(v,a){var c=Math.cos(a),s=Math.sin(a);return [v[0]*c + v[2]*s, v[1], -v[0]*s + v[2]*c];}
  function rotZ(v,a){var c=Math.cos(a),s=Math.sin(a);return [v[0]*c - v[1]*s, v[0]*s + v[1]*c, v[2]];}

  /* ---------- poses: a body is described by a handful of joint angles ---------- */
  var KEYS = ['x','y','z','yaw','lean','roll','lf','lk','la','rf','rk','ra','alf','ala','ale','arf','ara','are'];
  function mk(base, o){ var p = {}; KEYS.forEach(function(k){ p[k] = (o && k in o) ? o[k] : base[k]; }); return p; }

  // Smooth curve through keyframes (cubic Hermite with Catmull-Rom slopes) so moves flow instead of stepping.
  function spline(kf, t){
    var n = kf.length;
    if (t <= kf[0].t) return kf[0].p;
    if (t >= kf[n-1].t) return kf[n-1].p;
    var i = 0; while (t >= kf[i+1].t) i++;
    var t0 = kf[i].t, t1 = kf[i+1].t, h = t1 - t0, s = (t - t0) / h;
    var h00 = 2*s*s*s - 3*s*s + 1, h10 = s*s*s - 2*s*s + s, h01 = -2*s*s*s + 3*s*s, h11 = s*s*s - s*s;
    function slope(j, k){
      if (j <= 0 || j >= n - 1) return 0;
      return (kf[j+1].p[k] - kf[j-1].p[k]) / (kf[j+1].t - kf[j-1].t);
    }
    var out = {};
    KEYS.forEach(function(k){
      out[k] = h00 * kf[i].p[k] + h10 * h * slope(i, k) + h01 * kf[i+1].p[k] + h11 * h * slope(i+1, k);
    });
    return out;
  }

  // Turn a pose into joint positions in the world.
  var DOWN = [0,-1,0], FWD = [0,0,1];
  function body(p){
    function tf(v){ return rotY(rotX(rotZ(v, p.roll), p.lean), p.yaw); }
    function at(l){ var v = tf(l); return [p.x + v[0], p.y + v[1], p.z + v[2]]; }
    function step(a, l, len){ var d = tf(l); return [a[0] + d[0]*len, a[1] + d[1]*len, a[2] + d[2]*len]; }

      var hip = at([0.1*sd, 0, 0]);
      var knee = step(hip, rotZ(rotX(DOWN, -f), sd*ab), 0.46);
      var ank = step(knee, rotZ(rotX(DOWN, -(f - k)), sd*ab), 0.44);
      var toe = step(ank, rotZ(rotX(FWD, -(f - k)), sd*ab), 0.17);
      return {hip:hip, knee:knee, ank:ank, toe:toe};
    }
    function arm(sd, f, ab, e){
      var sh = at([0.19*sd, 0.47, 0]);
      var el = step(sh, rotZ(rotX(DOWN, -f), sd*ab), 0.29);
      var ha = step(el, rotZ(rotX(DOWN, -(f + e)), sd*ab), 0.27);
      return {sh:sh, el:el, ha:ha};
    }
    return {
      L: leg(-1, p.lf, p.lk, p.la), R: leg(1, p.rf, p.rk, p.ra),
      AL: arm(-1, p.alf, p.ala, p.ale), AR: arm(1, p.arf, p.ara, p.are),
      hipL: at([-0.16, 0.04, 0]), hipR: at([0.16, 0.04, 0]),
      shL: at([-0.21, 0.48, 0]), shR: at([0.21, 0.48, 0]),
      shoL: at([-0.17, -0.18, 0]), shoR: at([0.17, -0.18, 0]),
      neck: at([0, 0.52, 0]), head: at([0, 0.68, 0]), chest: at([0, 0.28, 0]),
      pelvis: [p.x, p.y, p.z], yaw: p.yaw
    };
  }

  /* ---------- the shooter: run-up, plant, strike, follow-through ---------- */
  var RS = {x:-1.7, z:7.8}, RE = {x:-0.3, z:8.92};
  var SBASE = {x:RS.x, y:0.95, z:RS.z, yaw:0.95, lean:0.06, roll:0, lf:0, lk:0.12, la:0.06, rf:0, rk:0.12, ra:0.06,
               alf:0, ala:0.14, ale:0.25, arf:0, ara:0.14, are:0.25};

  function runPose(t){
    var A = clamp(t / 0.18, 0, 1);                       // ramps from standing into a full run
    var u = clamp(t / 0.92, 0, 1), e = u*u*(3 - 2*u)*0.35 + u*0.65;

      {t:0.85, p:runPose(0.85)},

      // plant: left foot beside the ball, kicking leg cocked back, arm out for balance
      {t:1.02, p:mk(SBASE,{x:-0.27,z:9.0,y:0.9,yaw:0.28,lean:0.04,roll:0.16, lf:0.3,lk:0.35,la:0.1, rf:-0.8,rk:1.8,ra:0.12,
                           alf:0.4,ala:1.25,ale:0.4, arf:-0.35,ara:0.5,are:0.6})},
      // contact
      {t:TC,   p:mk(SBASE,{x:-0.24,z:9.05,y:0.9,yaw:0.12+aim,lean:0,roll:0.13, lf:0.2,lk:0.3,la:0.1, rf:0.55,rk:0.3,ra:0.05,
                           alf:0.6,ala:1.4,ale:0.3, arf:-0.2,ara:0.7,are:0.5})},
      // follow-through
      {t:1.26, p:mk(SBASE,{x:-0.15,z:9.3,y:0.97,yaw:0.1+aim,lean:-0.14,roll:0.05, lf:0.05,lk:0.15,la:0.08, rf:1.25,rk:0.2,ra:0.05,
                           alf:0.9,ala:1.2,ale:0.3, arf:0.3,ara:0.6,are:0.4})},
      {t:1.62, p:mk(SBASE,{x:-0.05,z:9.65,y:0.93,yaw:0.1,lean:0.1,roll:0, lf:-0.25,lk:0.45, rf:0.3,rk:0.4,
                           alf:0.2,ala:0.35,ale:0.6, arf:0.2,ara:0.35,are:0.6})},
      {t:2.5,  p:mk(SBASE,{x:0,z:9.75,y:0.95,yaw:0.05,lean:0.08, alf:0.05,ala:0.2,ale:0.4, arf:0.05,ara:0.2,are:0.4})}
    ];
  }

  function shooterPose(t, plan){
    if (!plan || t < 0.92) return runPose(plan ? t : 0);
    return spline(plan.sk, t);
  }

  /* ---------- the keeper: ready stance, split-step, push-off, full-stretch dive ---------- */
  var KBASE = {x:0, y:0.8, z:ZK, yaw:Math.PI, lean:0.28, roll:0, lf:0.55, lk:0.95, la:0.22, rf:0.55, rk:0.95, ra:0.22,
               alf:0.45, ala:0.55, ale:0.7, arf:0.45, ara:0.55, are:0.7};
  var clock = 0;

  function ready(fade){
    return mk(KBASE, {x: 0.07*Math.sin(clock*2.2)*fade, y: 0.8 + 0.02*Math.sin(clock*6.5)*fade});
  }

  // Keeper faces the camera, so his left leg is on screen right. lead = leg on the dive side.
  function legs(o, kd, lead, push){
    var L = kd > 0 ? lead : push, R = kd > 0 ? push : lead;
    o.lf = L[0]; o.lk = L[1]; o.la = L[2]; o.rf = R[0]; o.rk = R[1]; o.ra = R[2];
    return o;
  }

  function keeperFrames(dive, shot, hi){
    var kd = dive - 1;
    var hop  = mk(KBASE, {y:0.9, lf:0.3, lk:0.5, rf:0.3, rk:0.5, lean:0.2});
    var load = mk(KBASE, {x:kd*0.12, y:0.72, lf:0.7, lk:1.25, rf:0.7, rk:1.25, roll:kd*0.12, la:0.3, ra:0.3});
    var f = [{t:-0.3, p:mk(KBASE)}, {t:-0.12, p:hop}, {t:0, p:load}];
    if (kd !== 0){
      f.push({t:0.2, p:legs(mk(KBASE,{x:kd*0.9, y:0.78 + 0.4*hi, roll:kd*0.8, lean:0.12,
                    alf:0.3,ala:2.3,ale:0.35, arf:0.3,ara:2.3,are:0.35}), kd, [0.8,1.2,0.3], [-0.1,0.15,0.3])});
      f.push({t:TF, p:legs(mk(KBASE,{x:kd*1.75, y:0.55 + 0.55*hi, roll:kd*(1.5 - 0.35*hi), lean:0.1,
                    alf:0.15,ala:2.9,ale:0.05, arf:0.15,ara:2.9,are:0.05}), kd, [0.35,0.5,0.35], [0,0.2,0.4])});
      f.push({t:0.75, p:legs(mk(KBASE,{x:kd*2.05, y:0.27, roll:kd*1.52, lean:0.15,
                    alf:0.3,ala:2.7,ale:0.35, arf:0.3,ara:2.7,are:0.35}), kd, [0.6,0.9,0.25], [0.1,0.3,0.3])});
      f.push({t:1.4, p:legs(mk(KBASE,{x:kd*2.1, y:0.25, roll:kd*1.54, lean:0.15,
                    alf:0.35,ala:2.4,ale:0.7, arf:0.35,ara:2.4,are:0.7}), kd, [0.7,1.1,0.25], [0.1,0.3,0.3])});
    } else if (shot === 1){
      // stands tall and gathers the ball into the chest
      var catchP = {y:0.92, lf:0.25,lk:0.4,rf:0.25,rk:0.4, lean:0.2, alf:1.25,ala:0.35,ale:0.7, arf:1.25,ara:0.35,are:0.7};
      f.push({t:0.22, p:mk(KBASE, catchP)});
      f.push({t:TF, p:mk(KBASE, Object.assign({}, catchP, {alf:1.1, arf:1.1, ale:0.9, are:0.9}))});
      f.push({t:0.8, p:mk(KBASE, {y:0.86, lf:0.4,lk:0.7,rf:0.4,rk:0.7, lean:0.35, alf:0.9,ala:0.3,ale:1.5, arf:0.9,ara:0.3,are:1.5})});
      f.push({t:1.4, p:mk(KBASE, {y:0.88, lf:0.3,lk:0.5,rf:0.3,rk:0.5, lean:0.25, alf:0.9,ala:0.3,ale:1.5, arf:0.9,ara:0.3,are:1.5})});
    } else {
      // stayed in the middle, ball goes to the side: a late, hopeless reach
      var ss = shot - 1;
      f.push({t:0.22, p:mk(KBASE, {y:1.0, lf:0.15,lk:0.25,rf:0.15,rk:0.25, lean:0.12, roll:ss*0.2,
                                   alf:0.3,ala:1.7,ale:0.2, arf:0.3,ara:1.7,are:0.2})});
      f.push({t:TF, p:mk(KBASE, {x:ss*0.25, y:0.98, lf:0.15,lk:0.3,rf:0.15,rk:0.3, lean:0.1, roll:ss*0.35,
                                 alf:0.3,ala:2.1,ale:0.15, arf:0.3,ara:2.1,are:0.15})});
      f.push({t:0.8, p:mk(KBASE, {x:ss*0.3, y:0.82, roll:ss*0.1, alf:0.3,ala:1.2,ale:0.4, arf:0.3,ara:1.2,are:0.4})});
      f.push({t:1.4, p:mk(KBASE, {x:ss*0.3, y:0.86, lean:0.45, lf:0.45,lk:0.8,rf:0.45,rk:0.8,
                                  alf:0.6,ala:0.3,ale:0.3, arf:0.6,ara:0.3,are:0.3})});
    }
    return f;
  }

  function keeperPose(r, plan){
    if (!plan || r < -0.3) return ready(plan ? clamp((-0.3 - r) / 0.5, 0, 1) : 1);
    return spline(plan.kk, r);
  }

  /* ---------- the ball: simulated once per kick, then played back ---------- */
  function handsMid(J){ return lerp3(J.AL.ha, J.AR.ha, 0.5); }

  function makePlan(shot, dive){
    var hi = Math.random();
    var plan = {shot:shot, dive:dive, sk:shooterFrames(shot), kk:keeperFrames(dive, shot, hi)};
    var saved = shot === dive, sd = shot - 1, target, catching = false;
    var KJ = body(spline(plan.kk, TF));
    if (saved && sd === 0){
      catching = true;
      target = handsMid(KJ); target[2] -= 0.12;
    } else if (saved){
      target = (sd * KJ.AL.ha[0] > sd * KJ.AR.ha[0]) ? KJ.AL.ha.slice() : KJ.AR.ha.slice();
      target[2] -= 0.1;
    } else if (sd === 0){
      target = [(Math.random() - 0.5) * 0.9, 0.4 + Math.random() * 1.5, ZG];
    } else {
      target = [sd * (2.65 + Math.random() * 0.6), 0.3 + Math.random() * 1.8, ZG];
    }
    plan.catching = catching;
    plan.ball = simBall(target, saved, catching, sd);
    return plan;
  }

  function simBall(tgt, saved, catching, sd){
    var g = 9.8, out = [];
    var p = [0, BR, ZS];
    var v = [(tgt[0] - p[0]) / TF, (tgt[1] - p[1]) / TF + 0.5*g*TF, (tgt[2] - p[2]) / TF];
    var phase = 'fly', bulge = 0, bx = 0, by = 1, spin = 0, n = Math.ceil(2.4 / DT);
    for (var i = 0; i <= n; i++){
      out.push({x:p[0], y:p[1], z:p[2], spin:spin, bulge:bulge, bx:bx, by:by, held:phase === 'held'});
      var t = (i + 1) * DT;
      if (phase === 'held') continue;
      if (phase === 'fly' && saved && t >= TF){
        if (catching){ phase = 'held'; continue; }
        phase = 'free';
        v = [sd * 2.3, 2.6, -6.5];            // parried wide and back into play
      }
      v[1] -= g * DT;
      p[0] += v[0]*DT; p[1] += v[1]*DT; p[2] += v[2]*DT;
      spin += Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]) * DT * 4;
      if (!saved){
        var pen = p[2] - (ZN - BR);
        if (pen > 0){                          // the net catches it like a spring
          v[2] += (-900*pen - 14*v[2]) * DT;
          v[0] *= 0.96;
          bx = p[0]; by = p[1];
          bulge = Math.max(bulge * 0.9, pen);
        } else {
          bulge *= 0.93;
        }
        if (p[2] > ZG + 0.2){ p[0] = clamp(p[0], -GW + BR, GW - BR); }
      }
      if (p[1] < BR){
        p[1] = BR;
        if (v[1] < 0){ v[1] *= -0.45; v[0] *= 0.82; v[2] *= 0.82; }
      }
    }
    return out;
  }

  function ballAt(r, plan, KJ){
    if (!plan || r < 0) return {x:0, y:BR, z:ZS, spin:0, bulge:0, bx:0, by:1};
    var s = plan.ball[Math.min(plan.ball.length - 1, Math.floor(r / DT))];
    if (s.held){
      var h = handsMid(KJ);
      return {x:h[0], y:h[1], z:h[2] - 0.12, spin:s.spin, bulge:0, bx:0, by:1};
    }
    return s;
  }

  /* ---------- drawing ---------- */
  var cv = $('pitch'), ctx = cv.getContext('2d');
  var bg = document.createElement('canvas'), bgx = bg.getContext('2d');
  var K = 1;

  function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  var INK = '#1b1236', INKPASS = false;
  function paintBg(){
    var c = bgx;
    c.setTransform(K, 0, 0, K, 0, 0);
    var zB = 30, yB = gy(zB), yT = HZ + (CH - 0.9) * F / zB;
    // stands: three colourful tiers packed with fans
    c.fillStyle = '#2c2f7c'; c.fillRect(0, 0, 400, yT + 1);
    var R = rng(11), tierH = yT / 3, fans = ['#ffd84a', '#3d9bff', '#ff8a2a', '#ff4d5e', '#ffffff', '#9b5cff', '#36c45a'];
    for (var tr = 0; tr < 3; tr++){
      var ty = tr * tierH;
      c.fillStyle = tr % 2 ? '#34388f' : '#2c2f7c'; c.fillRect(0, ty, 400, tierH);
      for (var row = 0; row < 3; row++){
        var yy = ty + 4 + row * (tierH - 4) / 3, rr = 1.9 + tr * 0.25;
        for (var x = 2 + R() * 3; x < 400; x += 5.2 + R() * 2.2){
          c.fillStyle = fans[Math.floor(R() * fans.length)];
          c.beginPath(); c.arc(x, yy + R() * 1.5, rr, 0, Math.PI * 2); c.fill();
          c.strokeStyle = INK; c.lineWidth = 0.7; c.stroke();
        }
      }
      c.fillStyle = INK; c.fillRect(0, ty + tierH - 1.6, 400, 1.6);
    }
    // advertising boards: yellow with the duelist wordmark
    c.fillStyle = '#ffd84a'; c.fillRect(0, yT, 400, yB - yT);
    c.fillStyle = INK; c.fillRect(0, yT - 1, 400, 2); c.fillRect(0, yB - 1, 400, 2);
    var fs = Math.round((yB - yT) * 0.7);
    c.font = fs + 'px "Lilita One",sans-serif'; c.textBaseline = 'middle';
    for (var bx = -10, i = 0; bx < 410; i++){
      if (i % 3 === 2){
        c.fillStyle = '#3d9bff'; c.fillRect(bx, yT + 1, 46, yB - yT - 2);
        c.fillStyle = '#fff'; c.fillText('1V1', bx + 9, (yT + yB) / 2 + 0.5); bx += 56; continue;
      }
      var w = c.measureText('duelist').width;
      c.fillStyle = '#3d9bff'; c.beginPath(); c.arc(bx + 3, (yT + yB) / 2, 2.4, 0, 7); c.fill();
      c.fillStyle = INK; c.fillText('duelist', bx + 8, (yT + yB) / 2 + 0.5);
      c.fillStyle = '#ff8a2a'; c.beginPath(); c.arc(bx + 12 + w, (yT + yB) / 2, 2.4, 0, 7); c.fill();
      bx += w + 30;
    }
    // bright grass with mowing stripes
    var z = zB, k = 0;
    while (z > 2){
      var z2 = z - 1.83;
      c.fillStyle = k++ % 2 ? '#52d052' : '#45c247';
      c.fillRect(0, gy(z), 400, gy(Math.max(z2, 0.5)) - gy(z) + 1);
      z = z2;
    }
    var shade = c.createLinearGradient(0, yB, 0, yB + 60);
    shade.addColorStop(0, 'rgba(27,18,54,.22)'); shade.addColorStop(1, 'rgba(27,18,54,0)');
    c.fillStyle = shade; c.fillRect(0, yB, 400, 60);
    // pitch markings
    c.fillStyle = '#ffffff';
    var yg = gy(ZG); c.fillRect(0, yg - 0.9, 400, 1.9);
    var y6 = gy(ZG - 5.5); c.fillRect(0, y6 - 1.1, 400, 2.2);
    var sp = proj([0, 0, ZS]);
    c.beginPath(); c.ellipse(sp[0], sp[1], 0.12 * sp[2], 0.12 * sp[2] * 0.36, 0, 0, Math.PI*2); c.fill();
    // sunshine + soft edge
    var fl = c.createRadialGradient(200, -40, 10, 200, -40, 300);
    fl.addColorStop(0, 'rgba(255,250,220,.22)'); fl.addColorStop(1, 'rgba(255,250,220,0)');
    c.fillStyle = fl; c.fillRect(0, 0, 400, 300);
    var vg = c.createRadialGradient(200, 160, 150, 200, 160, 300);
    vg.addColorStop(0, 'rgba(27,18,54,0)'); vg.addColorStop(1, 'rgba(27,18,54,.22)');
    c.fillStyle = vg; c.fillRect(0, 0, 400, 300);
  }

  function resize(){
    var r = cv.getBoundingClientRect();
    if (!r.width) return;
    var dpr = Math.min(3, window.devicePixelRatio || 1);
    var w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
    if (cv.width !== w || cv.height !== h){
      cv.width = w; cv.height = h; bg.width = w; bg.height = h;
      K = w / 400;
      paintBg();
    }
  }

  function line(a, b, w, col){
    var A = proj(a), B = proj(b);
    ctx.strokeStyle = INKPASS ? INK : col;
    ctx.lineWidth = Math.max(0.8, w * (A[2] + B[2]) / 2) + (INKPASS ? 2.8 : 0);
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
  }
  function dotAt(a, r, col){
    var A = proj(a);
    ctx.fillStyle = INKPASS ? INK : col; ctx.beginPath(); ctx.arc(A[0], A[1], Math.max(0.8, r * A[2]) + (INKPASS ? 1.4 : 0), 0, Math.PI*2); ctx.fill();
  }
  function poly(pts, col, round){
    var s = 0;
    ctx.beginPath();
    pts.forEach(function(p, i){ var P = proj(p); s += P[2]; if (i) ctx.lineTo(P[0], P[1]); else ctx.moveTo(P[0], P[1]); });
    ctx.closePath();
    ctx.fillStyle = INKPASS ? INK : col; ctx.strokeStyle = INKPASS ? INK : col; ctx.lineWidth = round * s / pts.length + (INKPASS ? 2.8 : 0);
    ctx.fill(); ctx.stroke();
  }

  function shadow(x, z, rx, a){
    var P = proj([x, 0, z]);
    ctx.fillStyle = 'rgba(0,0,0,' + a + ')';
    ctx.beginPath(); ctx.ellipse(P[0], P[1], rx * P[2], rx * P[2] * 0.3, 0, 0, Math.PI*2); ctx.fill();
  }
  function figureShadow(J){
    var pts = [J.pelvis, J.chest, J.head, lerp3(J.L.ank, J.R.ank, 0.5)];
    pts.forEach(function(p){ shadow(p[0], p[2], 0.26, Math.max(0.05, 0.22 - p[1] * 0.08)); });
  }

  function drawLeg(l, k){
    line(l.hip, l.knee, 0.16, k.skin);
    line(l.knee, l.ank, 0.12, k.skin);
    line(lerp3(l.knee, l.ank, 0.2), l.ank, 0.125, k.socks);
    line(l.hip, lerp3(l.hip, l.knee, 0.42), 0.19, k.shorts);
    line(l.ank, l.toe, 0.11, '#141414');
  }
  function drawArm(a, k){
    if (k.keeper){
      line(a.sh, a.el, 0.11, k.shirt);
      line(a.el, a.ha, 0.095, k.shirt);
      dotAt(a.ha, 0.075, '#f4f6f2');
    } else {
      line(a.sh, a.el, 0.095, k.skin);
      line(a.sh, lerp3(a.sh, a.el, 0.45), 0.12, k.shirt);
      line(a.el, a.ha, 0.08, k.skin);
      dotAt(a.ha, 0.045, k.skin);
    }
  }
  // Two passes: first the whole silhouette in ink (slightly fatter), then the colours on top.
  function drawFigure(J, k){
    INKPASS = true; figureParts(J, k); INKPASS = false; figureParts(J, k);
  }
  function figureParts(J, k){
    var legsS = [J.L, J.R].sort(function(a, b){ return b.knee[2] - a.knee[2]; });
    legsS.forEach(function(l){ drawLeg(l, k); });
    poly([J.hipL, J.hipR, J.shoR, J.shoL], k.shorts, 0.05);
    var tz = J.chest[2];
    var arms = [J.AL, J.AR];
    function az(a){ return (a.el[2] + a.ha[2]) / 2; }
    arms.forEach(function(a){ if (az(a) > tz) drawArm(a, k); });
    poly([J.shL, J.shR, J.hipR, J.hipL], k.shirt, 0.12);
    var away = Math.cos(J.yaw);
    if (k.num && away > 0.3 && !INKPASS){
      var C = proj(J.chest), A = proj(J.shL), B = proj(J.shR);
      ctx.save();
      ctx.translate(C[0], C[1]);
      ctx.rotate(Math.atan2(B[1] - A[1], B[0] - A[0]));
      ctx.scale(away, 1);
      ctx.font = (0.27 * C[2]) + 'px "Lilita One",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = 2.2; ctx.strokeText(k.num, 0, 0);
      ctx.fillStyle = '#ffffff'; ctx.fillText(k.num, 0, 0);
      ctx.restore();
    }
    arms.forEach(function(a){
      if (az(a) <= tz){
        if (!INKPASS){ INKPASS = true; drawArm(a, k); INKPASS = false; }
        drawArm(a, k);
      }
    });
    line(J.neck, J.head, 0.09, k.skin);
    var H = proj(J.head), N = proj(J.neck), r = 0.12 * H[2];
    if (INKPASS){
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(H[0], H[1], r + 1.5, 0, Math.PI*2); ctx.fill();
      return;
    }
    if (away > 0){
      ctx.fillStyle = k.hair; ctx.beginPath(); ctx.arc(H[0], H[1], r, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = k.skin; ctx.beginPath(); ctx.arc(H[0], H[1], r, 0, Math.PI*2); ctx.fill();
      var up = Math.atan2(H[1] - N[1], H[0] - N[0]);
      ctx.fillStyle = k.hair; ctx.beginPath(); ctx.arc(H[0], H[1], r, up - 1.3, up + 1.3); ctx.closePath(); ctx.fill();
    }
  }

  function bump(x, y, b){
    if (!b.bulge) return 0;
    var dx = x - b.bx, dy = y - b.by;
    return b.bulge * Math.exp(-(dx*dx + dy*dy) / 0.55);
  }
  function drawNet(b){
    var xs = [], ys = [], i, j;
    for (i = 0; i <= 24; i++) xs.push(-GW + i * (2 * GW / 24));
    for (j = 0; j <= 8; j++) ys.push(j * NH / 8);
    // shadowed back of the goal
    poly([[-GW, 0, ZN], [GW, 0, ZN], [GW, NH, ZN], [-GW, NH, ZN]], 'rgba(27,18,54,.22)', 0);
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 0.7;
    function path(pts){
      ctx.beginPath();
      pts.forEach(function(p, k){ var P = proj(p); if (k) ctx.lineTo(P[0], P[1]); else ctx.moveTo(P[0], P[1]); });
      ctx.stroke();
    }
    // back panel
    xs.forEach(function(x){ path(ys.map(function(y){ return [x, y, ZN + bump(x, y, b)]; })); });
    ys.forEach(function(y){ path(xs.map(function(x){ return [x, y, ZN + bump(x, y, b)]; })); });
    // roof
    for (j = 0; j <= 5; j++){
      var u = j / 5, yy = GH + (NH - GH) * u, zz = ZG + (ZN - ZG) * u;
      path([[-GW, yy, zz], [GW, yy, zz]]);
    }
    xs.forEach(function(x){ path([[x, GH, ZG], [x, NH, ZN + bump(x, NH, b)]]); });
    // side panels
    [-GW, GW].forEach(function(x){
      for (var q = 0; q <= 5; q++){
        var u = q / 5, z = ZG + (ZN - ZG) * u;
        path([[x, 0, z], [x, GH + (NH - GH) * u, z]]);
      }
      ys.forEach(function(y){ path([[x, y * GH / NH, ZG], [x, y, ZN]]); });
    });
  }
  function drawFrame(){
    ctx.lineCap = 'butt';
    INKPASS = true;
    line([-GW, 0, ZG], [-GW, GH + 0.06, ZG], 0.12, INK);

    Net.ch = Net.sb.channel('match-' + code + '-' + gen)
      .on('postgres_changes', {event: '*', schema: 'public', table: 'matches', filter: f}, mine(function(p){ if (p.new && p.new.code) Net.match = p.new; }))
      .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'turns', filter: f}, mine(function(p){ addTurn(p.new); }))
      .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'locks', filter: f}, mine(function(p){ addFlag(Net.locks, p.new); }))
      .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'ready', filter: f}, mine(function(p){ addFlag(Net.ready, p.new); }))
      .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'chat', filter: f}, mine(function(p){ addChat(p.new); renderChat(); }))
      .subscribe(function(status){ if (gen === Net.gen && status === 'SUBSCRIBED') refetch(); });
    // Safety net: if a live update is ever missed (phone asleep, weak signal), catch up every few seconds.
    Net.poll = setInterval(function(){ if (gen === Net.gen && document.visibilityState !== 'hidden') refetch(); }, 5000);
    refetch();
    $('codeShow').textContent = code;
    $('lobbyGame').textContent = GAME_NAME[HUB.game].toUpperCase();
    lobbyView('wait');
    setLobbyBusy(false);
    presenceJoin(code, seat);
  }

  function netErr(){
    var msg = 'Connection problem. Trying again… If it doesn’t come back, go to the menu and use Resume to rejoin match ' + (Net.code || '') + '.';
    if (S && S.mode === 'online'){ if (S.phase === 'wait' || S.phase === 'sending') $('waitSub').textContent = msg; }
    else lobbyErr(msg);
  }

  function netNames(){ var m = Net.match || {}; return [m.host_name || 'Blue', m.guest_name || 'Orange']; }
  function typeOf(g){
    var m = Net.match || {}, kind = m.kind || 'pen';
    if (kind !== 'mix') return kind;
    var order = m.order_list || ['pen', 'rps', 'tug'];
    return order[Math.max(0, Math.min(2, g - (m.series_start || 0)))];
  }
  // Every turn both players picked in game g, rebuilt with the same rules as offline play.
  function resolvedFor(g){
    var out = [], list = Net.turns[g] || [], type = typeOf(g), R = RULES[type];
    for (var n = 0; n < list.length && list[n]; n++){
      var pa = R.valid(n, 0, list[n].p0, out), pb = R.valid(n, 1, list[n].p1, out);
      out.push(R.resolve(n, pa, pb, out));
    }
    return out;
  }

  function buildOnline(){
    var m = Net.match, g = m.game || 0, kind = m.kind || 'pen';
    HUB.game = kind;
    S = {mode: 'online', code: Net.code, me: Net.seat, gnum: g, kind: kind, seriesStart: m.series_start || 0,
         names: netNames(), kicks: [], phase: null, oppUid: Net.seat === 0 ? m.guest_key : m.host_key,
         orderKey: JSON.stringify(m.order_list || null)};
    if (kind === 'mix'){ S.series = {order: (m.order_list || ['pen', 'rps', 'tug']).slice(), idx: g - S.seriesStart, results: []}; refreshSeries(); }
    S.game = typeOf(g);
    S.kicks = resolvedFor(g);
    showScreen('game');
    ambience(true);
    renderChat();
    beginTurn();
  }
  function refreshSeries(){
    if (!S.series) return;
    for (var i = S.seriesStart; i < S.gnum; i++) S.series.results[i - S.seriesStart] = winnerOf(typeOf(i), resolvedFor(i));
  }

  function onNet(){
    var m = Net.match;
    if (!m || !Net.code) return;
    if (!m.has_guest && !(S && S.mode === 'online')){
      if ($('lobby').hidden) showScreen('lobby');
      lobbyView('wait');
      return;
    }
    if (!S || S.mode !== 'online' || S.code !== Net.code || (m.game || 0) !== S.gnum || JSON.stringify(m.order_list || null) !== S.orderKey){ buildOnline(); return; }
    var nm = netNames();
    if (nm[0] !== S.names[0] || nm[1] !== S.names[1]){ S.names = nm; renderBoard(S.phase === 'over'); }
    if (!S.oppUid) S.oppUid = S.me === 0 ? m.guest_key : m.host_key;
    if (S.series) refreshSeries();
    if (m.forfeit && m.forfeit.g === S.gnum && S.phase !== 'over' && !S.forfeited){
      S.forfeited = true; stopTimer(); A.playing = false;
      S.phase = 'forfeit-pending';
      finishGame(1 - m.forfeit.seat, null, true);
      return;
    }
    var opp = 1 - S.me, rv = m['react' + opp];
    if (rv && rv.n > Net.reactSeen[opp]){
      Net.reactSeen[opp] = rv.n;
      if (typeof rv.k === 'string') showBubble(opp, rv.k.slice(0, 12));
    }
    if (S.phase === 'pick' || S.phase === 'wait' || S.phase === null) netStep();
  }

  function qdDelay(k){ var s = Net.code + ':' + k, h = 0; for (var i = 0; i < s.length; i++) h = Math.imul(31, h) + s.charCodeAt(i) | 0; return 1400 + Math.abs(h) % 2600; }

  function netStep(){
    if (!S || ['reveal', 'result', 'over', 'subover', 'sending', 'qd', 'forfeit-pending'].indexOf(S.phase) >= 0) return;
    var n = S.kicks.length, res = resolvedFor(S.gnum);
    if (res.length > n){ reveal(res[n]); return; }
    var k = key(n), lk = Net.locks[k] || [false, false], rd = Net.ready[k] || [false, false];
    var oppName = S.names[1 - S.me];
    if (lk[S.me]){
      S.phase = 'wait';
      showWait('LOCKED IN', lk[1 - S.me] ? 'Both picks are in. Revealing…' : 'Waiting for ' + oppName + ' to pick…');
      return;
    }
    if (S.game === 'qd'){
      if (rd[S.me] && rd[1 - S.me]){ startQd(qdDelay(k)); return; }
      if (rd[S.me]){ S.phase = 'wait'; showWait('READY!', 'Waiting for ' + oppName + ' to get ready…'); return; }
    }
    if (S.phase !== 'pick') setPhase(S.me);
  }

  function netReady2(){
    var n = S.kicks.length, g = S.gnum;
    S.phase = 'sending';
    showWait('READY!', 'Waiting for ' + S.names[1 - S.me] + ' to get ready…');
    api('ready', {code: Net.code, seat: S.me, game: g, n: n}).then(function(){
      addFlag(Net.ready, {game: g, n: n, seat: S.me});
      if (S && S.mode === 'online'){ S.phase = 'wait'; onNet(); }
    }).catch(function(){
      if (!S || S.mode !== 'online') return;
      S.phase = null; setPhase(S.me); $('roleSub').textContent = 'That didn’t send. Check your connection and tap again.';
    });
  }

  function netCommit(v, auto){
    var n = S.kicks.length, g = S.gnum, wasQd = S.game === 'qd';
    S.phase = 'sending';
    showWait('LOCKED IN', auto ? 'Time’s up. A pick was sent for you…' : 'Sending…');
    api('pick', {code: Net.code, seat: S.me, game: g, n: n, pick: Math.round(Number(v))}).then(function(){
      addFlag(Net.locks, {game: g, n: n, seat: S.me});
      if (S && S.mode === 'online'){ S.phase = 'wait'; onNet(); }
    }).catch(function(e){
      if (!S || S.mode !== 'online') return;
      if (e.code === 'stale'){ S.phase = 'wait'; refetch(); return; }
      S.phase = null;
      if (wasQd){ showWait('CONNECTION PROBLEM', 'Your draw didn’t send. Go back to the menu and use Resume.'); return; }
      setPhase(S.me);
      $('roleSub').textContent = e.code === 'offline' ? 'Your pick didn’t send. Check your connection and pick again.' : e.message;
    });
  }

  function netAdvance(rematch){
    $('rematchBtn').disabled = true; $('nextGameBtn').disabled = true;
    api('advance', {code: Net.code, seat: S.me, game: S.gnum, rematch: !!rematch})
      .then(refetch)
      .catch(function(e){ showWait('HMM', e.message); })
      .then(function(){ $('rematchBtn').disabled = false; $('nextGameBtn').disabled = false; });
  }
  function netNextGame(){ netAdvance(false); }
  function netRematch(){ netAdvance(true); }
  function netForfeit(){
    if (!Net.code || !S) return;
    api('forfeit', {code: Net.code, seat: S.me, game: S.gnum, loser: S.me}).catch(function(){});
    if (S.mode === 'online') recordResult(S.series ? 'mix' : S.game, 1 - S.me);
  }

  /* ---------- presence: is the other player still here? ---------- */
  var Pres = {ch: null, oppHere: true, awaySince: 0, tick: null, ready: false, claimed: false};
  function presenceJoin(code, seat){
    presenceLeave();
    if (!Net.sb) return;
    try {
      var ch = Net.sb.channel('room-' + code, {config: {presence: {key: 's' + seat + '-' + Math.random().toString(36).slice(2, 8)}}});
      ch.on('presence', {event: 'sync'}, function(){
        var st = ch.presenceState(), peers = [];
        Object.keys(st).forEach(function(k){ (st[k] || []).forEach(function(p){ peers.push(p); }); });
        updatePresence(peers);
      }).subscribe(function(status){ if (status === 'SUBSCRIBED') ch.track({seat: seat}); });
      Pres.ch = ch;
      setTimeout(function(){ Pres.ready = true; }, 8000);
      Pres.tick = setInterval(checkAway, 1000);
    } catch (e) {}
  }
  function presenceLeave(){
    if (Pres.tick) clearInterval(Pres.tick);
    if (Pres.ch && Net.sb){ try { Net.sb.removeChannel(Pres.ch); } catch (e) {} }
    Pres = {ch: null, oppHere: true, awaySince: 0, tick: null, ready: false, claimed: false};
  }
  function updatePresence(peers){
    var opp = 1 - Net.seat;
    Pres.oppHere = peers.some(function(p){ return p && p.seat === opp; });
    if (Pres.oppHere){ Pres.awaySince = 0; Pres.claimed = false; } else if (!Pres.awaySince) Pres.awaySince = Date.now();
  }
  function checkAway(){
    var n = $('notice');
    if (!S || S.mode !== 'online' || !Pres.ready || !onlineLive() || !Net.match || !Net.match.has_guest || Pres.oppHere || !Pres.awaySince){ n.hidden = true; return; }
    var left = 30 - Math.floor((Date.now() - Pres.awaySince) / 1000), who = S.names[1 - S.me];
    n.hidden = false;
    if (left > 0) n.textContent = who + ' lost connection. If they’re not back in ' + left + ' s, you win.';
    else {
      n.textContent = who + ' didn’t come back. You win by forfeit.';
      if (!Pres.claimed){
        Pres.claimed = true;
        api('forfeit', {code: Net.code, seat: S.me, game: S.gnum, loser: 1 - S.me}).catch(function(){ Pres.claimed = false; });
      }
    }
  }

  /* ---------- quick reactions + chat ---------- */
  var lastReact = 0, lastChat = 0, chatMuted = false;
  var BAD = ['fuck', 'shit', 'bitch', 'cunt', 'dick', 'pussy', 'nigg', 'fagg', 'whore', 'slut', 'asshole', 'bastard', 'retard',
             'хуй', 'пизд', 'ебат', 'ебан', 'бля', 'сука', 'мудак', 'пидор', 'гандон', 'шлюх', 'долбо'];
  function cleanText(s){
    s = String(s || '').replace(new RegExp('[\\u0000-\\u001f\\u200b-\\u200f\\u2028-\\u202e]', 'g'), ' ').trim().slice(0, 120);
    s = s.replace(/(https?:\/\/|www\.)\S+|t\.me\/\S+|@[a-z0-9_]{4,}/gi, '[link removed]');
    BAD.forEach(function(w){
      var re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      s = s.replace(re, function(m){ return m.charAt(0) + new Array(m.length).join('*'); });
    });
    return s;
  }
  function showBubble(p, text){
    var el = document.createElement('div');
    el.className = 'bubble ' + (p === 0 ? 'l' : 'r');
    el.style.background = p === 0 ? '#9fd0ff' : '#ffc48c';
    el.textContent = (isMe(p) ? 'You' : name(p)) + ': ' + text;
    $('stage').appendChild(el);
    SFX.pop(); haptic('light');
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 2900);
  }
  function sendReact(text){
    var now = Date.now();
    if (!S || S.mode !== 'online' || now - lastReact < 1500) return;
    lastReact = now;
    api('react', {code: Net.code, seat: S.me, text: text}).catch(function(){});
    showBubble(S.me, text);
  }
  function sendChat(){
    var inp = $('chatIn'), text = cleanText(inp.value), now = Date.now();
    if (!text || !S || S.mode !== 'online') return;
    if (now - lastChat < 1000) return;
    lastChat = now; inp.value = '';
    SFX.send();
    api('chat', {code: Net.code, seat: S.me, text: text}).then(refetch).catch(function(e){
      var log = $('chatLog'), d = document.createElement('div'); d.className = 'msg'; d.textContent = e.message; log.appendChild(d); log.hidden = false;
    });
  }
  function renderChat(){
    var log = $('chatLog');
    if (!S || S.mode !== 'online'){ log.innerHTML = ''; return; }
    var msgs = Net.chat.map(function(c){ return {p: c.seat, t: Number(c.t) || 0, m: cleanText(c.m)}; });
    var opp = 1 - S.me, fresh = msgs.filter(function(c){ return c.p === opp && c.t > Net.chatSeen; });
    if (fresh.length){ Net.chatSeen = fresh[fresh.length - 1].t; if (!chatMuted){ SFX.pop(); haptic('light'); } }
    log.innerHTML = '';
    var shown = msgs.filter(function(c){ return !(chatMuted && c.p === opp); }).slice(-30);
    if (chatMuted){ var mm = document.createElement('div'); mm.className = 'msg'; mm.textContent = 'You muted ' + S.names[opp] + '’s messages.'; log.appendChild(mm); }
    shown.forEach(function(c){
      var d = document.createElement('div'); d.className = 'msg' + (c.p === S.me ? ' me' : '');
      var b = document.createElement('b'); b.textContent = (c.p === S.me ? 'You' : S.names[c.p]) + ':';
      d.appendChild(b); d.appendChild(document.createTextNode(c.m));
      log.appendChild(d);
    });
    log.hidden = !shown.length && !chatMuted;
    log.scrollTop = log.scrollHeight;
  }

  /* ---------- resume a match after a reload ---------- */
  function renderResume(){
    var m = recall(), box = document.getElementById('resumeBox');
    if (!m){ if (box) box.remove(); return; }
    if (!box){
      box = document.createElement('div'); box.id = 'resumeBox'; box.className = 'panel';
      var p = document.createElement('p'); p.id = 'resumeText';
      var b = document.createElement('button'); b.type = 'button'; b.className = 'btn y'; b.textContent = 'RESUME MATCH';
      b.addEventListener('click', function(){
        var mm = recall(); if (!mm) return;
        netReady().then(function(st){ if (st !== 'ok'){ showScreen('lobby'); lobbyErr(NET_MSG[st]); return; } showScreen('lobby'); netAttach(mm.code, mm.seat); });
      });
      var x = document.createElement('button'); x.type = 'button'; x.className = 'link'; x.style.color = 'var(--muted-ink)'; x.textContent = 'Forget it';
      x.addEventListener('click', function(){ forget(); renderResume(); });
      box.appendChild(p); box.appendChild(b); box.appendChild(x);
      $('menu').insertBefore(box, $('games'));
    }
    $('resumeText').textContent = 'You were in online match ' + m.code + '. Jump back in?';
  }

  /* ---------- Telegram invite ---------- */
  function shareInvite(){
    var code = $('codeShow').textContent, link = inviteLink(code);
    var text = 'Duel me in ' + GAME_NAME[HUB.game] + '! Match code ' + code;
    if (TG && TG.openTelegramLink) TG.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(text));
    else { try { navigator.clipboard.writeText(link); } catch (e) {} }
  }

  /* ---------- wiring ---------- */
  Array.prototype.forEach.call(document.querySelectorAll('.game'), function(b){
    b.addEventListener('click', function(){ HUB.game = b.dataset.game; renderHub(); haptic('tap'); SFX.boing(); });
  });
  var _renderHub = renderHub;
  renderHub = function(){ _renderHub(); renderResume(); };
  $('changeName').onclick = function(){ editingNick = true; renderWho(); $('nickIn').focus(); };
  $('nickSave').onclick = saveNick;
  $('nickIn').addEventListener('keydown', function(e){ if (e.key === 'Enter') saveNick(); });
  $('cpuBtn').onclick = function(){ if (!needNick()) start('cpu'); };
  $('localBtn').onclick = function(){ start('local'); };
  $('onlineBtn').onclick = function(){ if (needNick()) return; openLobby(''); };
  $('findBtn').onclick = findMatch;
  $('createBtn').onclick = createMatch;
  $('joinBtn').onclick = function(){ joinMatch(); };
  $('codeIn').addEventListener('keydown', function(e){ if (e.key === 'Enter') joinMatch(); });
  $('queueCancel').onclick = function(){ stopQueue(); lobbyView('form'); };
  $('lobbyBack').onclick = function(){ stopQueue(); netDetach(); showScreen('menu'); };
  $('copyBtn').onclick = function(){
    var b = $('copyBtn'), code = $('codeShow').textContent;
    var done = function(){ b.textContent = 'COPIED!'; setTimeout(function(){ b.textContent = 'COPY CODE'; }, 1500); };
    try { navigator.clipboard.writeText(code).then(done, selectCode); } catch (e) { selectCode(); }
  };
  function selectCode(){ var r = document.createRange(); r.selectNodeContents($('codeShow')); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
  $('nextBtn').onclick = beginTurn;
  $('nextGameBtn').onclick = function(){ if (S.mode === 'online') netNextGame(); else startSub(S.series.idx + 1); };
  $('rematchBtn').onclick = function(){ if (S.mode === 'online') netRematch(); else { HUB.game = S.kind; start(S.mode); } };
  $('quitBtn').onclick = toMenu;
  $('helpBtn').onclick = function(e){ e.stopPropagation(); if (S) openTutorial(S.game); };
  $('tutOk').onclick = closeTutorial;
  $('muteBtn').onclick = function(e){
    e.stopPropagation();
    Snd.muted = !Snd.muted;
    try { localStorage.setItem('pd-mute', Snd.muted ? '1' : '0'); } catch (err) {}
    ambience(!Snd.muted);
    paintMute();
  };
  $('stage').addEventListener('pointerdown', function(e){
    if (e.target.closest('button')) return;
    if (S && S.qdLive && S.mode !== 'local'){ e.preventDefault(); qdTap(S.mode === 'online' ? S.me : 0); return; }
  });
  $('stage').addEventListener('click', function(e){ if (e.target.closest('button')) return; if (!(S && S.qdLive)) skipAnim(); });
  Array.prototype.forEach.call(document.querySelectorAll('#reacts button'), function(b){
    b.addEventListener('click', function(){ sendReact(b.dataset.r); });
  });
  $('chatSend').onclick = sendChat;
  $('chatIn').addEventListener('keydown', function(e){ if (e.key === 'Enter') sendChat(); });
  $('chatMute').onclick = function(){
    chatMuted = !chatMuted;
    $('chatMute').textContent = chatMuted ? 'UNMUTE' : 'MUTE';
    $('chatMute').setAttribute('aria-pressed', chatMuted ? 'true' : 'false');
    renderChat();
  };
  $('shareBtn').onclick = shareInvite;
  if (!TG) $('shareBtn').hidden = true;
  if (TG && TG.BackButton) TG.BackButton.onClick(function(){
    if (!$('game').hidden) toMenu(); else { stopQueue(); netDetach(); showScreen('menu'); }
  });
  if (TG && !nick()){
    var tgu = TG.initDataUnsafe && TG.initDataUnsafe.user;
    if (tgu && (tgu.first_name || tgu.username)) setNick(String(tgu.first_name || tgu.username));
  }
  paintMute();
  loadStats();
  renderHub();
  // A link ending in #CODE opens straight into the join screen.
  if (/^#[A-Za-z0-9]{4}$/.test(location.hash)){ var hc = location.hash.slice(1).toUpperCase(); if (nick()) openLobby(hc); }
  // An invite link t.me/the_duelist_bot/play?startapp=CODE joins that match straight away.
  var startCode = TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param;
  if (startCode && /^[A-Za-z0-9]{4}$/.test(startCode) && nick()) openLobby(startCode.toUpperCase(), true);

  // Test hook, only active with #debug in the address.
  if (location.hash === '#debug'){
    window.__pd = {
      start: function(game, mode){ HUB.game = game; start(mode || 'cpu'); $('tut').hidden = true; },
      turn: function(game, p0, p1, t){
        if (!S || S.game !== game){ HUB.game = game; start('cpu'); }
        $('tut').hidden = true; setControls('none');
        var turn = RULES[game].resolve(S.kicks.length, p0, p1, S.kicks);
        A.plan = null; A.rps = null; A.tug = null; A.box = null; A.qd = null;
        if (game === 'pen') A.plan = makePlan(turn.shot, turn.dive);
        if (game === 'rps') A.rps = {a: turn.a, b: turn.b, w: turn.w};
        if (game === 'tug') A.tug = turn; if (game === 'box') A.box = turn; if (game === 'qd') A.qd = turn;
        A.playing = true; A.freeze = t; return turn;
      },
      push: function(game, p0, p1){ S.kicks.push(RULES[game].resolve(S.kicks.length, p0, p1, S.kicks)); renderBoard(false); },
      idle: function(){ A.playing = false; A.freeze = null; A.plan = null; A.rps = null; A.tug = null; A.box = null; A.qd = null; },
      live: function(phase){ S.qdLive = {phase: phase, start: performance.now(), steadyAt: 1e15, drawAt: 1e15, drawShown: performance.now() - 50, taps: [null, null]}; },
      state: function(){ return S; }
    };
  }
})();
</script>
