<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1511">
<title>Duelist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Saira+Condensed:wght@600;800&display=swap">
<style>
/* Layout: one-screen phone app — TV-style shootout scoreboard on top, a broadcast "behind the taker" camera on the pitch, role banner + big pick buttons at thumb height. Each player owns a kit colour (blue / orange) used on the board, the banner and the players. Committed night-match look, single theme. */
:root{
  --night:#0b1511;
  --panel:#13221b;
  --line:#26392f;
  --chalk:#eef3ea;
  --muted:#93a89b;
  --teamA:#3d9bff;
  --teamB:#ff8a2a;
  --goal:#2fc46f;
  --miss:#e8433a;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--night);color:var(--chalk);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.app{min-height:100%;max-width:480px;margin:0 auto;padding-inline:16px;padding-block:14px;display:flex;flex-direction:column;gap:12px}

/* Menu */
.menu{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px}
.menu h1{font-family:var(--display);font-weight:800;font-size:clamp(52px,17vw,76px);line-height:.88;letter-spacing:.01em;margin:0;text-transform:uppercase}
.menu h1 .a{color:var(--teamA)} .menu h1 .b{color:var(--teamB)}
.rules{display:grid;gap:8px;margin:0;padding:0;list-style:none;font-size:15px}
.rules li{display:flex;gap:10px;align-items:baseline}
.rules li b{font-family:var(--display);color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase;min-width:4.5em}
.modes{display:grid;gap:10px}
.btn{display:block;width:100%;padding:18px 20px;border-radius:12px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;text-align:left;background:var(--panel);border:1px solid var(--line)}
.btn small{display:block;font-family:var(--body);font-weight:400;font-size:14px;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:2px}
.btn.primary{background:var(--chalk);color:var(--night);border-color:var(--chalk)}
.btn.primary small{color:#4b5a51}

/* Online lobby */
.lobby{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.lobby h2{margin:0;font-family:var(--display);font-weight:800;font-size:40px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.lobby p{margin:0;color:var(--muted);line-height:1.5}
.field{display:grid;gap:6px}
.field label{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input{width:100%;padding:14px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--chalk);font:inherit;font-size:18px}
.field input:focus{outline:2px solid var(--chalk);outline-offset:1px}
.joinrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.joinrow input{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.3em;text-transform:uppercase}
.joinrow .btn{width:auto;text-align:center;padding-inline:24px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.12em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.code{font-family:var(--display);font-weight:800;font-size:64px;letter-spacing:.25em;line-height:1;padding-block:12px;text-align:center;border:2px dashed var(--line);border-radius:14px;user-select:all}
.copy{justify-self:start;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:15px}
.wait{display:flex;align-items:center;gap:10px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--goal);flex:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.err{color:var(--miss)!important;font-weight:600;min-height:1.5em}
.waitbar{display:flex;align-items:center;gap:12px;padding:16px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:16px}
.waitbar b{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.03em;display:block}
.waitbar span.t{color:var(--muted);font-size:15px}
.btn:active{transform:scale(.985)}

/* Scoreboard, modelled on TV shootout graphics */
.board{background:#070d0a;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:7px}
.row{display:grid;grid-template-columns:6px minmax(0,1fr) auto 2.6ch;align-items:center;gap:10px}
.kit{width:6px;height:24px;border-radius:2px}
.row[data-p="0"] .kit{background:var(--teamA)}
.row[data-p="1"] .kit{background:var(--teamB)}
.nm{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:6px;flex-wrap:nowrap;flex:none}
.dot{flex:none;width:18px;height:18px;border-radius:50%;background:transparent;border:2px solid rgba(238,243,234,.5);display:grid;place-items:center}
.dot svg{width:11px;height:11px;display:block}
.sdsep{flex:none;width:1px;height:16px;background:var(--line);margin-inline:1px}
.more{flex:none;font-family:var(--display);font-weight:600;font-size:12px;color:var(--muted);align-self:center}
.board.long .dots{gap:4px}
.board.long .dot{width:14px;height:14px;border-width:1.5px}
.board.long .dot svg{width:9px;height:9px}
.dot.scored{background:var(--goal);border-color:var(--goal)}
.dot.missed{background:var(--miss);border-color:var(--miss)}
.sc{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.kick{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:6px}

/* Pitch */
.stage{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--night)}
#pitch{position:absolute;inset:0;width:100%;height:100%;display:block}

.flash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:rgba(7,13,10,.55);text-align:center;padding:16px;animation:pop .25s ease-out}
.flash b{font-family:var(--display);font-weight:800;font-size:clamp(44px,15vw,68px);line-height:.95;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.flash span{font-size:15px;color:var(--chalk);text-shadow:0 1px 6px rgba(0,0,0,.7)}
@keyframes pop{from{opacity:0;transform:scale(1.06)}}

.handoff{position:absolute;inset:0;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.handoff h2{margin:0;font-family:var(--display);font-weight:800;font-size:34px;text-transform:uppercase;letter-spacing:.02em}
.handoff p{margin:0;color:var(--muted);max-width:28ch;line-height:1.45}
.handoff button{margin-top:8px;padding:14px 26px;border-radius:999px;color:#08110c;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase}

/* Role banner + controls */
.role{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:#08110c}
.role svg{width:34px;height:34px;flex:none}
.role div{display:grid;gap:0;min-width:0}
.role h3{margin:0;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05;text-transform:uppercase;letter-spacing:.03em}
.role p{margin:0;font-size:15px;font-weight:600;opacity:.8}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pick{min-height:68px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.05em;text-transform:uppercase}
.pick i{font-style:normal;font-size:22px;line-height:1;color:var(--muted)}
.pick:active{background:var(--chalk);color:var(--night)}
.actions{display:grid;gap:10px}
.actions .btn{text-align:center}
.quit{background:none;color:var(--muted);font-size:14px;padding:6px;justify-self:center;text-decoration:underline;text-underline-offset:3px}

@media (prefers-reduced-motion:reduce){ .flash{animation:none} }
</style>
</head>
<body>

<div class="app">
  <section class="menu" id="menu">
    <h1><span class="a">Penalty</span><br><span class="b">Duel</span></h1>
    <ul class="rules">
      <li><b>Shooter</b> picks left, middle or right.</li>
      <li><b>Keeper</b> picks where to dive, in secret.</li>
      <li><b>Format</b> 5 kicks each, then sudden death.</li>
    </ul>
    <div class="modes">
      <button class="btn primary" id="cpuBtn">Play vs computer<small>You wear blue and shoot first.</small></button>
      <button class="btn" id="onlineBtn">Play a friend online<small>Each on your own phone. Picks stay secret.</small></button>
      <button class="btn" id="localBtn">2 players, one phone<small>Blue vs orange. Pass the phone between turns.</small></button>
    </div>
  </section>

  <section class="lobby" id="lobby" hidden>
    <h2>Play a friend</h2>
    <div id="lobbyForm" style="display:grid;gap:16px">
      <div class="field"><label for="nick">Your name</label><input id="nick" maxlength="12" autocomplete="nickname" placeholder="e.g. Alex"></div>
      <button class="btn primary" id="createBtn">Create a match<small>You get a code to send your friend.</small></button>
      <div class="or">or</div>
      <div class="field"><label for="codeIn">Join with a code</label>
        <div class="joinrow"><input id="codeIn" maxlength="4" placeholder="K7Q2" autocapitalize="characters" autocomplete="off" spellcheck="false"><button class="btn" id="joinBtn">Join</button></div>
      </div>
    </div>
    <div id="waitBox" hidden style="display:grid;gap:14px">
      <p>Send your friend the link to this page, plus this code:</p>
      <div class="code" id="codeShow"></div>
      <button class="copy" id="copyBtn">Copy code</button>
      <p class="wait"><span class="pulse"></span>Waiting for your friend to join…</p>
    </div>
    <p class="err" id="lobbyErr" role="alert"></p>
    <button class="quit" id="lobbyBack">Back to menu</button>
  </section>

  <section id="game" hidden style="display:contents">
    <div class="board" id="board">
      <div class="row" data-p="0" id="row0"><span class="kit"></span><span class="nm"></span><span class="dots"></span><span class="sc"></span></div>
      <div class="row" data-p="1" id="row1"><span class="kit"></span><span class="nm"></span><span class="dots"></span><span class="sc"></span></div>
      <div class="kick" id="kickLabel"></div>
    </div>

    <div class="stage" id="stage">
      <canvas id="pitch" aria-label="Penalty kick"></canvas>
      <div class="flash" id="flash" hidden><b id="flashBig"></b><span id="flashSmall"></span></div>
      <div class="handoff" id="handoff" hidden>
        <h2 id="handTitle"></h2>
        <p id="handSub"></p>
        <button id="handBtn"></button>
      </div>
    </div>

    <div class="role" id="role">
      <svg id="roleIcon" viewBox="0 0 34 34" aria-hidden="true"></svg>
      <div><h3 id="roleTitle"></h3><p id="roleSub"></p></div>
    </div>

    <div class="waitbar" id="waitbar" hidden>
      <span class="pulse"></span>
      <div><b id="waitTitle">Locked in</b><span class="t" id="waitSub"></span></div>
    </div>

    <div class="picks" id="picks">
      <button class="pick" data-z="0"><i>←</i>Left</button>
      <button class="pick" data-z="1"><i>↑</i>Middle</button>
      <button class="pick" data-z="2"><i>→</i>Right</button>
    </div>

    <div class="actions">
      <button class="btn primary" id="nextBtn" hidden>Next kick</button>
      <button class="btn primary" id="rematchBtn" hidden>Rematch</button>
      <button class="quit" id="quitBtn">Back to menu</button>
    </div>
  </section>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var KIT = ['var(--teamA)', 'var(--teamB)'];
  var KITC = ['#3d9bff', '#ff8a2a'];
  var SHOT_TXT = ['Shot left', 'Shot down the middle', 'Shot right'];
  var DIVE_TXT = ['keeper dived left', 'keeper stayed in the middle', 'keeper dived right'];
  var ICON_BALL = '<circle cx="17" cy="17" r="14" fill="#f4f6f2" stroke="#08110c" stroke-width="2"/><polygon points="17,11 22.5,15 20.5,21.5 13.5,21.5 11.5,15" fill="#08110c"/>';
  var ICON_GLOVE = '<rect x="9" y="12" width="16" height="17" rx="5" fill="#f4f6f2" stroke="#08110c" stroke-width="2"/><path d="M11 13V6M15 12V4M19 12V4M23 13V7" stroke="#08110c" stroke-width="3" stroke-linecap="round"/>';
  var CHECK = '<svg viewBox="0 0 12 12"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var CROSS = '<svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var S = null;

  /* =====================================================================
     SCENE: a small 3D world in metres, seen by a broadcast camera
     standing behind the penalty taker. x = sideways, y = up, z = toward goal.
     ===================================================================== */
  var F = 650, CX = 200, HZ = -5, CH = 3.6;          // camera: focal length, centre, horizon, height
  var ZS = 9.5, ZG = 20.5, ZN = 22.1, ZK = 20.15;    // ball spot, goal line, back of net, keeper
  var GW = 3.66, GH = 2.44, NH = 1.9, BR = 0.11;     // half goal width, bar height, net back height, ball radius
  var TC = 1.1, TF = 0.46, RESULT_T = TC + 1.55, DT = 1 / 120; // contact time, ball flight, result time

  function proj(v){ var s = F / v[2]; return [CX + v[0] * s, HZ + (CH - v[1]) * s, s]; }
  function gy(z){ return HZ + CH * F / z; }
  function lerp3(a, b, k){ return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }
  function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
  function rotX(v,a){var c=Math.cos(a),s=Math.sin(a);return [v[0], v[1]*c - v[2]*s, v[1]*s + v[2]*c];}
  function rotY(v,a){var c=Math.cos(a),s=Math.sin(a);return [v[0]*c + v[2]*s, v[1], -v[0]*s + v[2]*c];}
  function rotZ(v,a){var c=Math.cos(a),s=Math.sin(a);return [v[0]*c - v[1]*s, v[0]*s + v[1]*c, v[2]];}

  /* ---------- poses: a body is described by a handful of joint angles ---------- */
  var KEYS = ['x','y','z','yaw','lean','roll','lf','lk','la','rf','rk','ra','alf','ala','ale','arf','ara','are'];
  function mk(base, o){ var p = {}; KEYS.forEach(function(k){ p[k] = (o && k in o) ? o[k] : base[k]; }); return p; }

  // Smooth curve through keyframes (cubic Hermite with Catmull-Rom slopes) so moves flow instead of stepping.
  function spline(kf, t){
    var n = kf.length;
    if (t <= kf[0].t) return kf[0].p;
    if (t >= kf[n-1].t) return kf[n-1].p;
    var i = 0; while (t >= kf[i+1].t) i++;
    var t0 = kf[i].t, t1 = kf[i+1].t, h = t1 - t0, s = (t - t0) / h;
    var h00 = 2*s*s*s - 3*s*s + 1, h10 = s*s*s - 2*s*s + s, h01 = -2*s*s*s + 3*s*s, h11 = s*s*s - s*s;
    function slope(j, k){
      if (j <= 0 || j >= n - 1) return 0;
      return (kf[j+1].p[k] - kf[j-1].p[k]) / (kf[j+1].t - kf[j-1].t);
    }
    var out = {};
    KEYS.forEach(function(k){
      out[k] = h00 * kf[i].p[k] + h10 * h * slope(i, k) + h01 * kf[i+1].p[k] + h11 * h * slope(i+1, k);
    });
    return out;
  }

  // Turn a pose into joint positions in the world.
  var DOWN = [0,-1,0], FWD = [0,0,1];
  function body(p){
    function tf(v){ return rotY(rotX(rotZ(v, p.roll), p.lean), p.yaw); }
    function at(l){ var v = tf(l); return [p.x + v[0], p.y + v[1], p.z + v[2]]; }
    function step(a, l, len){ var d = tf(l); return [a[0] + d[0]*len, a[1] + d[1]*len, a[2] + d[2]*len]; }
    function leg(sd, f, k, ab){
      var hip = at([0.1*sd, 0, 0]);
      var knee = step(hip, rotZ(rotX(DOWN, -f), sd*ab), 0.46);
      var ank = step(knee, rotZ(rotX(DOWN, -(f - k)), sd*ab), 0.44);
      var toe = step(ank, rotZ(rotX(FWD, -(f - k)), sd*ab), 0.17);
      return {hip:hip, knee:knee, ank:ank, toe:toe};
    }
    function arm(sd, f, ab, e){
      var sh = at([0.19*sd, 0.47, 0]);
      var el = step(sh, rotZ(rotX(DOWN, -f), sd*ab), 0.29);
      var ha = step(el, rotZ(rotX(DOWN, -(f + e)), sd*ab), 0.27);
      return {sh:sh, el:el, ha:ha};
    }
    return {
      L: leg(-1, p.lf, p.lk, p.la), R: leg(1, p.rf, p.rk, p.ra),
      AL: arm(-1, p.alf, p.ala, p.ale), AR: arm(1, p.arf, p.ara, p.are),
      hipL: at([-0.16, 0.04, 0]), hipR: at([0.16, 0.04, 0]),
      shL: at([-0.21, 0.48, 0]), shR: at([0.21, 0.48, 0]),
      shoL: at([-0.17, -0.18, 0]), shoR: at([0.17, -0.18, 0]),
      neck: at([0, 0.52, 0]), head: at([0, 0.68, 0]), chest: at([0, 0.28, 0]),
      pelvis: [p.x, p.y, p.z], yaw: p.yaw
    };
  }

  /* ---------- the shooter: run-up, plant, strike, follow-through ---------- */
  var RS = {x:-1.7, z:7.8}, RE = {x:-0.3, z:8.92};
  var SBASE = {x:RS.x, y:0.95, z:RS.z, yaw:0.95, lean:0.06, roll:0, lf:0, lk:0.12, la:0.06, rf:0, rk:0.12, ra:0.06,
               alf:0, ala:0.14, ale:0.25, arf:0, ara:0.14, are:0.25};

  function runPose(t){
    var A = clamp(t / 0.18, 0, 1);                       // ramps from standing into a full run
    var u = clamp(t / 0.92, 0, 1), e = u*u*(3 - 2*u)*0.35 + u*0.65;
    var ph = 2*Math.PI*(0.042 + 2.4*t), s = Math.sin(ph), c = Math.cos(ph);
    return mk(SBASE, {
      x: RS.x + (RE.x - RS.x)*e, z: RS.z + (RE.z - RS.z)*e,
      y: 0.95 - 0.04*A + 0.035*A*Math.cos(2*ph), yaw: 0.95 - 0.5*e, lean: 0.06 + 0.2*A,
      lf: 0.6*A*s, lk: 0.12 + A*(0.15 + 1.05*Math.max(0, c)),
      rf: -0.6*A*s, rk: 0.12 + A*(0.15 + 1.05*Math.max(0, -c)),
      alf: -0.6*A*s, arf: 0.6*A*s, ale: 0.25 + 1.15*A, are: 0.25 + 1.15*A
    });
  }

  function shooterFrames(shot){
    var aim = (shot - 1) * 0.12;
    return [
      {t:0.85, p:runPose(0.85)},
      {t:0.92, p:runPose(0.92)},
      // plant: left foot beside the ball, kicking leg cocked back, arm out for balance
      {t:1.02, p:mk(SBASE,{x:-0.27,z:9.0,y:0.9,yaw:0.28,lean:0.04,roll:0.16, lf:0.3,lk:0.35,la:0.1, rf:-0.8,rk:1.8,ra:0.12,
                           alf:0.4,ala:1.25,ale:0.4, arf:-0.35,ara:0.5,are:0.6})},
      // contact
      {t:TC,   p:mk(SBASE,{x:-0.24,z:9.05,y:0.9,yaw:0.12+aim,lean:0,roll:0.13, lf:0.2,lk:0.3,la:0.1, rf:0.55,rk:0.3,ra:0.05,
                           alf:0.6,ala:1.4,ale:0.3, arf:-0.2,ara:0.7,are:0.5})},
      // follow-through
      {t:1.26, p:mk(SBASE,{x:-0.15,z:9.3,y:0.97,yaw:0.1+aim,lean:-0.14,roll:0.05, lf:0.05,lk:0.15,la:0.08, rf:1.25,rk:0.2,ra:0.05,
                           alf:0.9,ala:1.2,ale:0.3, arf:0.3,ara:0.6,are:0.4})},
      {t:1.62, p:mk(SBASE,{x:-0.05,z:9.65,y:0.93,yaw:0.1,lean:0.1,roll:0, lf:-0.25,lk:0.45, rf:0.3,rk:0.4,
                           alf:0.2,ala:0.35,ale:0.6, arf:0.2,ara:0.35,are:0.6})},
      {t:2.5,  p:mk(SBASE,{x:0,z:9.75,y:0.95,yaw:0.05,lean:0.08, alf:0.05,ala:0.2,ale:0.4, arf:0.05,ara:0.2,are:0.4})}
    ];
  }

  function shooterPose(t, plan){
    if (!plan || t < 0.92) return runPose(plan ? t : 0);
    return spline(plan.sk, t);
  }

  /* ---------- the keeper: ready stance, split-step, push-off, full-stretch dive ---------- */
  var KBASE = {x:0, y:0.8, z:ZK, yaw:Math.PI, lean:0.28, roll:0, lf:0.55, lk:0.95, la:0.22, rf:0.55, rk:0.95, ra:0.22,
               alf:0.45, ala:0.55, ale:0.7, arf:0.45, ara:0.55, are:0.7};
  var clock = 0;

  function ready(fade){
    return mk(KBASE, {x: 0.07*Math.sin(clock*2.2)*fade, y: 0.8 + 0.02*Math.sin(clock*6.5)*fade});
  }

  // Keeper faces the camera, so his left leg is on screen right. lead = leg on the dive side.
  function legs(o, kd, lead, push){
    var L = kd > 0 ? lead : push, R = kd > 0 ? push : lead;
    o.lf = L[0]; o.lk = L[1]; o.la = L[2]; o.rf = R[0]; o.rk = R[1]; o.ra = R[2];
    return o;
  }

  function keeperFrames(dive, shot, hi){
    var kd = dive - 1;
    var hop  = mk(KBASE, {y:0.9, lf:0.3, lk:0.5, rf:0.3, rk:0.5, lean:0.2});
    var load = mk(KBASE, {x:kd*0.12, y:0.72, lf:0.7, lk:1.25, rf:0.7, rk:1.25, roll:kd*0.12, la:0.3, ra:0.3});
    var f = [{t:-0.3, p:mk(KBASE)}, {t:-0.12, p:hop}, {t:0, p:load}];
    if (kd !== 0){
      f.push({t:0.2, p:legs(mk(KBASE,{x:kd*0.9, y:0.78 + 0.4*hi, roll:kd*0.8, lean:0.12,
                    alf:0.3,ala:2.3,ale:0.35, arf:0.3,ara:2.3,are:0.35}), kd, [0.8,1.2,0.3], [-0.1,0.15,0.3])});
      f.push({t:TF, p:legs(mk(KBASE,{x:kd*1.75, y:0.55 + 0.55*hi, roll:kd*(1.5 - 0.35*hi), lean:0.1,
                    alf:0.15,ala:2.9,ale:0.05, arf:0.15,ara:2.9,are:0.05}), kd, [0.35,0.5,0.35], [0,0.2,0.4])});
      f.push({t:0.75, p:legs(mk(KBASE,{x:kd*2.05, y:0.27, roll:kd*1.52, lean:0.15,
                    alf:0.3,ala:2.7,ale:0.35, arf:0.3,ara:2.7,are:0.35}), kd, [0.6,0.9,0.25], [0.1,0.3,0.3])});
      f.push({t:1.4, p:legs(mk(KBASE,{x:kd*2.1, y:0.25, roll:kd*1.54, lean:0.15,
                    alf:0.35,ala:2.4,ale:0.7, arf:0.35,ara:2.4,are:0.7}), kd, [0.7,1.1,0.25], [0.1,0.3,0.3])});
    } else if (shot === 1){

      f.push({t:0.22, p:mk(KBASE, catchP)});
      f.push({t:TF, p:mk(KBASE, Object.assign({}, catchP, {alf:1.1, arf:1.1, ale:0.9, are:0.9}))});
      f.push({t:0.8, p:mk(KBASE, {y:0.86, lf:0.4,lk:0.7,rf:0.4,rk:0.7, lean:0.35, alf:0.9,ala:0.3,ale:1.5, arf:0.9,ara:0.3,are:1.5})});
      f.push({t:1.4, p:mk(KBASE, {y:0.88, lf:0.3,lk:0.5,rf:0.3,rk:0.5, lean:0.25, alf:0.9,ala:0.3,ale:1.5, arf:0.9,ara:0.3,are:1.5})});
    } else {
      // stayed in the middle, ball goes to the side: a late, hopeless reach
      var ss = shot - 1;
      f.push({t:0.22, p:mk(KBASE, {y:1.0, lf:0.15,lk:0.25,rf:0.15,rk:0.25, lean:0.12, roll:ss*0.2,
                                   alf:0.3,ala:1.7,ale:0.2, arf:0.3,ara:1.7,are:0.2})});
      f.push({t:TF, p:mk(KBASE, {x:ss*0.25, y:0.98, lf:0.15,lk:0.3,rf:0.15,rk:0.3, lean:0.1, roll:ss*0.35,
                                 alf:0.3,ala:2.1,ale:0.15, arf:0.3,ara:2.1,are:0.15})});
      f.push({t:0.8, p:mk(KBASE, {x:ss*0.3, y:0.82, roll:ss*0.1, alf:0.3,ala:1.2,ale:0.4, arf:0.3,ara:1.2,are:0.4})});
      f.push({t:1.4, p:mk(KBASE, {x:ss*0.3, y:0.86, lean:0.45, lf:0.45,lk:0.8,rf:0.45,rk:0.8,
                                  alf:0.6,ala:0.3,ale:0.3, arf:0.6,ara:0.3,are:0.3})});
    }
    return f;
  }

  function keeperPose(r, plan){
    if (!plan || r < -0.3) return ready(plan ? clamp((-0.3 - r) / 0.5, 0, 1) : 1);
    return spline(plan.kk, r);
  }

  /* ---------- the ball: simulated once per kick, then played back ---------- */
  function handsMid(J){ return lerp3(J.AL.ha, J.AR.ha, 0.5); }

  function makePlan(shot, dive){
    var hi = Math.random();
    var plan = {shot:shot, dive:dive, sk:shooterFrames(shot), kk:keeperFrames(dive, shot, hi)};
    var saved = shot === dive, sd = shot - 1, target, catching = false;
    var KJ = body(spline(plan.kk, TF));
    if (saved && sd === 0){
      catching = true;
      target = handsMid(KJ); target[2] -= 0.12;
    } else if (saved){
      target = (sd * KJ.AL.ha[0] > sd * KJ.AR.ha[0]) ? KJ.AL.ha.slice() : KJ.AR.ha.slice();
      target[2] -= 0.1;
    } else if (sd === 0){
      target = [(Math.random() - 0.5) * 0.9, 0.4 + Math.random() * 1.5, ZG];
    } else {
      target = [sd * (2.65 + Math.random() * 0.6), 0.3 + Math.random() * 1.8, ZG];
    }
    plan.catching = catching;
    plan.ball = simBall(target, saved, catching, sd);
    return plan;
  }

  function simBall(tgt, saved, catching, sd){
    var g = 9.8, out = [];
    var p = [0, BR, ZS];
    var v = [(tgt[0] - p[0]) / TF, (tgt[1] - p[1]) / TF + 0.5*g*TF, (tgt[2] - p[2]) / TF];
    var phase = 'fly', bulge = 0, bx = 0, by = 1, spin = 0, n = Math.ceil(2.4 / DT);
    for (var i = 0; i <= n; i++){
      out.push({x:p[0], y:p[1], z:p[2], spin:spin, bulge:bulge, bx:bx, by:by, held:phase === 'held'});
      var t = (i + 1) * DT;
      if (phase === 'held') continue;
      if (phase === 'fly' && saved && t >= TF){
        if (catching){ phase = 'held'; continue; }
        phase = 'free';
        v = [sd * 2.3, 2.6, -6.5];            // parried wide and back into play
      }
      v[1] -= g * DT;
      p[0] += v[0]*DT; p[1] += v[1]*DT; p[2] += v[2]*DT;
      spin += Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]) * DT * 4;
      if (!saved){
        var pen = p[2] - (ZN - BR);
        if (pen > 0){                          // the net catches it like a spring

          v[0] *= 0.96;
          bx = p[0]; by = p[1];
          bulge = Math.max(bulge * 0.9, pen);
        } else {
          bulge *= 0.93;
        }
        if (p[2] > ZG + 0.2){ p[0] = clamp(p[0], -GW + BR, GW - BR); }
      }
      if (p[1] < BR){
        p[1] = BR;
        if (v[1] < 0){ v[1] *= -0.45; v[0] *= 0.82; v[2] *= 0.82; }
      }
    }
    return out;
  }

  function ballAt(r, plan, KJ){
    if (!plan || r < 0) return {x:0, y:BR, z:ZS, spin:0, bulge:0, bx:0, by:1};
    var s = plan.ball[Math.min(plan.ball.length - 1, Math.floor(r / DT))];
    if (s.held){
      var h = handsMid(KJ);
      return {x:h[0], y:h[1], z:h[2] - 0.12, spin:s.spin, bulge:0, bx:0, by:1};
    }
    return s;
  }

  /* ---------- drawing ---------- */
  var cv = $('pitch'), ctx = cv.getContext('2d');
  var bg = document.createElement('canvas'), bgx = bg.getContext('2d');
  var K = 1;

  function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  function paintBg(){
    var c = bgx;

    var zB = 30, yB = gy(zB), yT = HZ + (CH - 0.9) * F / zB;

    var R = rng(7), cols = ['#3d9bff', '#ff8a2a', '#eef3ea', '#c9d3cc', '#ffd36b'];
    for (var y = 3; y < yT - 2; y += 3.3){

    // advertising boards
    c.fillStyle = '#0a1420'; c.fillRect(0, yT, 400, yB - yT);
    c.fillStyle = 'rgba(255,255,255,.06)'; c.fillRect(0, yT, 400, 1.5);
    c.font = '800 ' + Math.round((yB - yT) * 0.62) + 'px "Saira Condensed","Arial Narrow",sans-serif';
    c.textBaseline = 'middle';
    var labels = ['PENALTY DUEL', '1V1', 'PENALTY DUEL', 'SUDDEN DEATH'];
    for (var i = 0, bx = -30; bx < 420; i++){
      c.fillStyle = i % 2 ? 'rgba(255,138,42,.42)' : 'rgba(61,155,255,.42)';
      var w = c.measureText(labels[i % 4]).width;
      c.fillText(labels[i % 4], bx, (yT + yB) / 2 + 0.5);
      bx += w + 26;
    }

    // grass with mowing stripes
    var z = zB, k = 0;
    while (z > 2){
      var z2 = z - 1.83;
      c.fillStyle = k++ % 2 ? '#1f5832' : '#1b4c2b';
      c.fillRect(0, gy(z), 400, gy(Math.max(z2, 0.5)) - gy(z) + 1);
      z = z2;
    }
    var shade = c.createLinearGradient(0, yB, 0, 300);
    shade.addColorStop(0, 'rgba(0,0,0,.35)'); shade.addColorStop(0.5, 'rgba(0,0,0,0)'); shade.addColorStop(1, 'rgba(0,0,0,.25)');

    // pitch markings: goal line, six-yard line, penalty spot

    var yg = gy(ZG); c.fillRect(0, yg - 0.7, 400, 1.5);
    var y6 = gy(ZG - 5.5); c.fillRect(0, y6 - 0.9, 400, 1.8);
    var sp = proj([0, 0, ZS]);
    c.beginPath(); c.ellipse(sp[0], sp[1], 0.12 * sp[2], 0.12 * sp[2] * 0.36, 0, 0, Math.PI*2); c.fill();

    // floodlight glow + vignette

    fl.addColorStop(0, 'rgba(255,244,214,.20)'); fl.addColorStop(1, 'rgba(255,244,214,0)');
    c.fillStyle = fl; c.fillRect(0, 0, 400, 300);
    var vg = c.createRadialGradient(200, 160, 120, 200, 160, 290);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)');
    c.fillStyle = vg; c.fillRect(0, 0, 400, 300);
  }

  function resize(){
    var r = cv.getBoundingClientRect();
    if (!r.width) return;
    var dpr = Math.min(3, window.devicePixelRatio || 1);
    var w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
    if (cv.width !== w || cv.height !== h){
      cv.width = w; cv.height = h; bg.width = w; bg.height = h;
      K = w / 400;
      paintBg();
    }
  }

  function line(a, b, w, col){
    var A = proj(a), B = proj(b);
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(0.8, w * (A[2] + B[2]) / 2);
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
  }
  function dotAt(a, r, col){
    var A = proj(a);
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(A[0], A[1], Math.max(0.8, r * A[2]), 0, Math.PI*2); ctx.fill();
  }
  function poly(pts, col, round){
    var s = 0;
    ctx.beginPath();
    pts.forEach(function(p, i){ var P = proj(p); s += P[2]; if (i) ctx.lineTo(P[0], P[1]); else ctx.moveTo(P[0], P[1]); });
    ctx.closePath();
    ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = round * s / pts.length;
    ctx.fill(); ctx.stroke();
  }

  function shadow(x, z, rx, a){
    var P = proj([x, 0, z]);
    ctx.fillStyle = 'rgba(0,0,0,' + a + ')';
    ctx.beginPath(); ctx.ellipse(P[0], P[1], rx * P[2], rx * P[2] * 0.3, 0, 0, Math.PI*2); ctx.fill();
  }
  function figureShadow(J){
    var pts = [J.pelvis, J.chest, J.head, lerp3(J.L.ank, J.R.ank, 0.5)];
    pts.forEach(function(p){ shadow(p[0], p[2], 0.26, Math.max(0.05, 0.22 - p[1] * 0.08)); });
  }

  function drawLeg(l, k){
    line(l.hip, l.knee, 0.16, k.skin);
    line(l.knee, l.ank, 0.12, k.skin);
    line(lerp3(l.knee, l.ank, 0.2), l.ank, 0.125, k.socks);
    line(l.hip, lerp3(l.hip, l.knee, 0.42), 0.19, k.shorts);
    line(l.ank, l.toe, 0.11, '#141414');
  }
  function drawArm(a, k){
    if (k.keeper){
      line(a.sh, a.el, 0.11, k.shirt);
      line(a.el, a.ha, 0.095, k.shirt);
      dotAt(a.ha, 0.075, '#f4f6f2');
    } else {
      line(a.sh, a.el, 0.095, k.skin);
      line(a.sh, lerp3(a.sh, a.el, 0.45), 0.12, k.shirt);
      line(a.el, a.ha, 0.08, k.skin);
      dotAt(a.ha, 0.045, k.skin);
    }
  }
  function drawFigure(J, k){
    var legsS = [J.L, J.R].sort(function(a, b){ return b.knee[2] - a.knee[2]; });
    legsS.forEach(function(l){ drawLeg(l, k); });
    poly([J.hipL, J.hipR, J.shoR, J.shoL], k.shorts, 0.05);
    var tz = J.chest[2];
    var arms = [J.AL, J.AR];
    function az(a){ return (a.el[2] + a.ha[2]) / 2; }
    arms.forEach(function(a){ if (az(a) > tz) drawArm(a, k); });
    poly([J.shL, J.shR, J.hipR, J.hipL], k.shirt, 0.12);
    // shirt number on the back
    var away = Math.cos(J.yaw);
    if (k.num && away > 0.3){
      var C = proj(J.chest), A = proj(J.shL), B = proj(J.shR);
      ctx.save();
      ctx.translate(C[0], C[1]);
      ctx.rotate(Math.atan2(B[1] - A[1], B[0] - A[0]));
      ctx.scale(away, 1);
      ctx.fillStyle = '#f4f6f2';
      ctx.font = '800 ' + (0.26 * C[2]) + 'px "Saira Condensed","Arial Narrow",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(k.num, 0, 0);
      ctx.restore();
    }
    arms.forEach(function(a){ if (az(a) <= tz) drawArm(a, k); });
    // neck and head
    line(J.neck, J.head, 0.09, k.skin);
    var H = proj(J.head), N = proj(J.neck), r = 0.12 * H[2];
    if (away > 0){
      ctx.fillStyle = k.hair; ctx.beginPath(); ctx.arc(H[0], H[1], r, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = k.skin; ctx.beginPath(); ctx.arc(H[0], H[1], r, 0, Math.PI*2); ctx.fill();
      var up = Math.atan2(H[1] - N[1], H[0] - N[0]);
      ctx.fillStyle = k.hair; ctx.beginPath(); ctx.arc(H[0], H[1], r, up - 1.3, up + 1.3); ctx.closePath(); ctx.fill();
    }
  }

  function bump(x, y, b){
    if (!b.bulge) return 0;
    var dx = x - b.bx, dy = y - b.by;
    return b.bulge * Math.exp(-(dx*dx + dy*dy) / 0.55);
  }
  function drawNet(b){
    var xs = [], ys = [], i, j;
    for (i = 0; i <= 24; i++) xs.push(-GW + i * (2 * GW / 24));
    for (j = 0; j <= 8; j++) ys.push(j * NH / 8);
    // shadowed back of the goal
    poly([[-GW, 0, ZN], [GW, 0, ZN], [GW, NH, ZN], [-GW, NH, ZN]], 'rgba(5,10,8,.35)', 0);
    ctx.strokeStyle = 'rgba(238,243,234,.26)'; ctx.lineWidth = 0.6;
    function path(pts){
      ctx.beginPath();
      pts.forEach(function(p, k){ var P = proj(p); if (k) ctx.lineTo(P[0], P[1]); else ctx.moveTo(P[0], P[1]); });
      ctx.stroke();
    }
    // back panel
    xs.forEach(function(x){ path(ys.map(function(y){ return [x, y, ZN + bump(x, y, b)]; })); });
    ys.forEach(function(y){ path(xs.map(function(x){ return [x, y, ZN + bump(x, y, b)]; })); });
    // roof
    for (j = 0; j <= 5; j++){
      var u = j / 5, yy = GH + (NH - GH) * u, zz = ZG + (ZN - ZG) * u;
      path([[-GW, yy, zz], [GW, yy, zz]]);
    }
    xs.forEach(function(x){ path([[x, GH, ZG], [x, NH, ZN + bump(x, NH, b)]]); });
    // side panels
    [-GW, GW].forEach(function(x){
      for (var q = 0; q <= 5; q++){
        var u = q / 5, z = ZG + (ZN - ZG) * u;
        path([[x, 0, z], [x, GH + (NH - GH) * u, z]]);
      }
      ys.forEach(function(y){ path([[x, y * GH / NH, ZG], [x, y, ZN]]); });
    });
  }
  function drawFrame(){
    ctx.lineCap = 'butt';
    line([-GW, 0, ZG], [-GW, GH + 0.06, ZG], 0.12, '#e9eee6');
    line([GW, 0, ZG], [GW, GH + 0.06, ZG], 0.12, '#e9eee6');
    line([-GW - 0.06, GH, ZG], [GW + 0.06, GH, ZG], 0.12, '#f4f7f1');
    line([-GW + 0.03, 0, ZG], [-GW + 0.03, GH, ZG], 0.03, 'rgba(0,0,0,.25)');
    line([GW + 0.03, 0, ZG], [GW + 0.03, GH, ZG], 0.03, 'rgba(0,0,0,.25)');
    ctx.lineCap = 'round';
  }
  function drawBall(b){
    var P = proj([b.x, b.y, b.z]), r = BR * P[2];
    var g = ctx.createRadialGradient(P[0] - r*0.35, P[1] - r*0.4, r*0.1, P[0], P[1], r);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#c9cec7');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(P[0], P[1], r, 0, Math.PI*2); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(P[0], P[1], r, 0, Math.PI*2); ctx.clip();
    ctx.fillStyle = '#1b1f1c';
    for (var i = 0; i < 3; i++){
      var a = b.spin + i * 2.09, px = P[0] + Math.cos(a) * r * 0.55, py = P[1] + Math.sin(a * 0.7 + 1) * r * 0.5;
      ctx.beginPath(); ctx.arc(px, py, r * 0.3, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  function tag(J, text, col){
    var H = proj(J.head);
    ctx.font = '800 11px "Saira Condensed","Arial Narrow",sans-serif';
    var w = ctx.measureText(text).width + 12, x = H[0] - w / 2, y = H[1] - 0.2 * H[2] - 20;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, 15, 4) : ctx.rect(x, y, w, 15); ctx.fill();
    ctx.fillStyle = '#08110c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text.toUpperCase(), H[0], y + 8);
  }

  var A = {playing:false, start:0, plan:null, done:true, onDone:null, freeze:null};

  function render(t){
    if (!S || !cv.width) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bg, 0, 0);
    ctx.setTransform(K, 0, 0, K, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    var plan = A.plan, r = t - TC;
    var sh = shooter(), kp = keeper();
    var SJ = body(shooterPose(t, plan));
    var KJ = body(keeperPose(r, plan));
    var b = ballAt(r, plan, KJ);
    var sKit = {shirt:KITC[sh], shorts:'#f4f6f2', socks:KITC[sh], skin:'#c58f63', hair:'#2b1d14', num: sh === 0 ? '10' : '9'};
    var kKit = {shirt:KITC[kp], shorts:'#111a15', socks:KITC[kp], skin:'#e0b088', hair:'#5a3b22', keeper:true};

    figureShadow(KJ); figureShadow(SJ);
    shadow(b.x, b.z, 0.13, Math.max(0.05, 0.45 - b.y * 0.15));

    var items = [
      {z: ZN, f: function(){ drawNet(b); }},
      {z: ZG, f: drawFrame},
      {z: KJ.pelvis[2], f: function(){ drawFigure(KJ, kKit); }},
      {z: b.z + (b.held ? -0.3 : 0), f: function(){ drawBall(b); }},
      {z: SJ.pelvis[2], f: function(){ drawFigure(SJ, sKit); }}
    ];
    items.sort(function(a, c){ return c.z - a.z; }).forEach(function(it){ it.f(); });

    if (!A.playing && A.freeze == null){
      tag(KJ, name(kp), KITC[kp]);
      tag(SJ, name(sh), KITC[sh]);
    }
  }

  var last = null;
  function frame(now){
    requestAnimationFrame(frame);
    if ($('game').hidden){ last = now; return; }
    var dt = last == null ? 0 : Math.min(0.05, (now - last) / 1000);
    last = now; clock += dt;
    resize();
    var t = A.freeze != null ? A.freeze : A.playing ? (now - A.start) / 1000 : 0;
    render(t);
    if (A.playing && !A.done && t >= RESULT_T){ A.done = true; if (A.onDone) A.onDone(); }
  }
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (cv.width) paintBg(); });

  /* =====================================================================
     GAME LOGIC
     ===================================================================== */
  function rand(){ return Math.floor(Math.random() * 3); }
  function shooter(){ return S.kicks.length % 2; }
  function keeper(){ return 1 - shooter(); }
  function name(p){ return S.names[p]; }
  function isMe(p){ return S.mode === 'cpu' ? p === 0 : S.mode === 'online' ? p === S.me : false; }

  function tally(){
    var g = [0,0], t = [0,0];
    S.kicks.forEach(function(k){ t[k.shooter]++; if (k.goal) g[k.shooter]++; });
    return {g:g, t:t};
  }

  function winner(){
    var r = tally(), g = r.g, t = r.t, n = S.kicks.length;
    if (n <= 10){
      if (g[0] > g[1] + (5 - t[1])) return 0;
      if (g[1] > g[0] + (5 - t[0])) return 1;
      return null;
    }
    if (n % 2 === 0 && g[0] !== g[1]) return g[0] > g[1] ? 0 : 1;
    return null;
  }

  // TV-style board: 5 circles per team for the regulation kicks. If it's level after 5 each,
  // one more circle per team is added to the right for every sudden-death round. Each kick taken
  // turns its circle green (scored) or red (missed).
  function renderBoard(over){
    var r = tally(), n = S.kicks.length;
    var sdRounds = n < 10 ? 0 : (over ? Math.ceil((n - 10) / 2) : Math.floor((n - 10) / 2) + 1);
    var slots = 5 + sdRounds;
    var MAXSD = 6;                                 // keep the row on screen in very long shootouts
    var firstSd = Math.max(0, sdRounds - MAXSD);
    $('board').classList.toggle('long', sdRounds > 2);
    [0,1].forEach(function(p){
      var row = $('row' + p);
      row.querySelector('.nm').textContent = name(p);
      row.querySelector('.sc').textContent = r.g[p];
      var mine = S.kicks.filter(function(k){ return k.shooter === p; });
      var dots = row.querySelector('.dots');
      dots.innerHTML = '';
      for (var i = 0; i < slots; i++){
        if (i >= 5 && i - 5 < firstSd) continue;
        if (i === 5){
          var sep = document.createElement('span'); sep.className = 'sdsep'; dots.appendChild(sep);
        }
        if (i === 5 + firstSd && firstSd > 0){
          var more = document.createElement('span'); more.className = 'more'; more.textContent = '+' + firstSd; dots.appendChild(more);
        }
        var d = document.createElement('span');
        d.className = 'dot';
        if (i < mine.length){
          d.classList.add(mine[i].goal ? 'scored' : 'missed');
          d.innerHTML = mine[i].goal ? CHECK : CROSS;
          d.setAttribute('aria-label', mine[i].goal ? 'scored' : 'missed');
        }
        dots.appendChild(d);
      }
    });
    $('kickLabel').textContent = (over ? 'Full time' :
      (n < 10 ? 'Round ' + (Math.floor(n / 2) + 1) + ' of 5' : 'Sudden death')) +
      (S.mode === 'online' ? ' · Match ' + S.code : '');
  }

  function setControls(mode){
    // mode: 'pick' | 'wait' | 'none' | 'next' | 'over'
    $('picks').hidden = mode !== 'pick';
    $('role').hidden = mode !== 'pick';
    $('waitbar').hidden = mode !== 'wait';
    $('nextBtn').hidden = mode !== 'next';
    $('rematchBtn').hidden = mode !== 'over';
  }

  function setPhase(p){
    S.phase = p;
    var who = p === 'pickShot' ? shooter() : keeper();
    $('role').style.background = KIT[who];
    if (p === 'pickShot'){
      $('roleIcon').innerHTML = ICON_BALL;
      $('roleTitle').textContent = isMe(who) ? 'You’re shooting' : name(who) + ' shoots';
      $('roleSub').textContent = 'Pick where to aim the ball.';
    } else {
      $('roleIcon').innerHTML = ICON_GLOVE;
      $('roleTitle').textContent = isMe(who) ? 'You’re in goal' : name(who) + ' in goal';
      $('roleSub').textContent = 'Pick where to dive.';
    }
    setControls('pick');
  }

  function showWait(title, sub){
    $('waitTitle').textContent = title;
    $('waitSub').textContent = sub;
    setControls('wait');
  }

  function showHandoff(p, role){
    setControls('none');
    $('handTitle').textContent = 'Pass to ' + name(p);
    $('handTitle').style.color = KIT[p];
    $('handSub').textContent = role === 'shoot'
      ? 'You’re shooting this kick. Keep your pick hidden.'
      : 'You’re in goal. Don’t let the shooter see your pick.';
    $('handBtn').textContent = 'I’m ' + name(p);
    $('handBtn').style.background = KIT[p];
    $('handoff').hidden = false;
    $('handBtn').onclick = function(){
      $('handoff').hidden = true;
      setPhase(role === 'shoot' ? 'pickShot' : 'pickKeep');
    };
  }

  function beginKick(){
    A.playing = false; A.plan = null; A.done = true;
    $('flash').hidden = true;
    S.shot = null; S.dive = null; S.phase = null;
    var w = winner();
    renderBoard(w !== null);
    if (w !== null){ showFinal(w, null); return; }
    if (S.mode === 'cpu'){
      if (shooter() === 0) setPhase('pickShot');
      else { S.shot = rand(); setPhase('pickKeep'); }
    } else if (S.mode === 'online'){
      netStep();
    } else {
      showHandoff(shooter(), 'shoot');
    }
  }

  function onPick(z){
    if (S.mode === 'online'){
      if (S.phase === 'pickShot' || S.phase === 'pickKeep') netCommit(z);
      return;
    }
    if (S.phase === 'pickShot'){
      S.shot = z;
      if (S.mode === 'cpu'){ S.dive = rand(); reveal(); }
      else showHandoff(keeper(), 'keep');
    } else if (S.phase === 'pickKeep'){
      S.dive = z;
      reveal();
    }
  }

  function showFinal(w, lastGoal){
    var r = tally(), big = $('flashBig');
    big.textContent = S.mode === 'cpu' ? (w === 0 ? 'You win!' : 'Computer wins')
      : isMe(w) ? 'You win!' : name(w) + ' wins!';
    big.style.color = KIT[w];
    $('flashSmall').textContent = (lastGoal === null ? '' : (lastGoal ? 'Goal' : 'Saved') + ' to finish it. ') +
      'Final score ' + r.g[0] + '–' + r.g[1] + (S.kicks.length > 10 ? ' after sudden death.' : '.');
    $('flash').hidden = false;
    S.phase = 'over';
    setControls('over');
  }

  function reveal(){
    S.phase = 'reveal';
    setControls('none');
    var shot = S.shot, dive = S.dive, goal = shot !== dive;
    A.plan = makePlan(shot, dive);
    A.playing = true; A.done = false;
    A.start = performance.now() - (REDUCED ? RESULT_T * 1000 : 0);
    A.onDone = function(){
      var shooterP = shooter();
      S.kicks.push({shooter: shooterP, goal: goal, shot: shot, dive: dive});
      var w = winner();
      renderBoard(w !== null);
      if (w === null){
        var big = $('flashBig');
        big.textContent = goal ? 'Goal!' : 'Saved!';
        big.style.color = goal ? KIT[shooterP] : KIT[1 - shooterP];
        $('flashSmall').textContent = SHOT_TXT[shot] + ', ' + DIVE_TXT[dive] + '.';
        $('flash').hidden = false;
        S.phase = 'result';
        setControls('next');
        $('nextBtn').focus({preventScroll:true});
      } else {
        showFinal(w, goal);
      }
    };
  }

  function showScreen(id){
    ['menu', 'lobby', 'game'].forEach(function(s){ $(s).hidden = s !== id; });
  }

  function start(mode){
    S = {
      mode: mode,
      names: mode === 'cpu' ? ['You', 'Computer'] : ['Blue', 'Orange'],
      kicks: [], shot: null, dive: null, phase: null
    };
    showScreen('game');
    beginKick();
  }

  function toMenu(){
    A.playing = false; A.plan = null;
    if (S && S.mode === 'online'){ netDetach(); forget(); }
    S = null;
    $('handoff').hidden = true;
    $('flash').hidden = true;
    showScreen('menu');
  }

  /* =====================================================================
     ONLINE PLAY
     Each match lives in the page's shared database:
       matches/<CODE>               who the two players are, which game of the match
       matches/<CODE>/seats/<0|1>   each player's sealed picks and, later, the reveals
       data/users/<id>/<CODE>-<seat> your own picks (private to you) so a reload can't lose them
     Picks are sealed: you publish a fingerprint (SHA-256 of pick + random salt) first,
     and only reveal the pick once both players have locked in. Nobody can peek or change their mind.
     ===================================================================== */
  var ALPH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  var Net = {init:null, db:null, user:null, uid:null, code:null, seat:null, match:null,
             seats:[null, null], priv:{}, privRef:null, unsubs:[], q:Promise.resolve(), revealing:{}, ver:{}};
  var NET_MSG = {
    none: 'Online play is coming soon. For now, try vs computer or 2 players on one phone.',
    signedout: 'Sign in to Claude to play online.',
    readonly: 'You can open this page but can’t play online yet. Ask the person who shared it to invite you as an Editor.'
  };

  function netReady(){
    if (Net.init) return Net.init;
    Net.init = (async function(){
      if (!window.claude || !window.claude.use) return 'none';
      var got = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!got[0] || !got[1]) return 'none';
      Net.db = got[0]; Net.user = got[1];
      Net.uid = await Net.user.id();
      if (!Net.uid) return 'signedout';
      var can = await Net.user.can('data.write');
      return can === false ? 'readonly' : 'ok';
    })().catch(function(){ return 'none'; });
    return Net.init;
  }

  function remember(code, seat){ try { localStorage.setItem('pd-match', JSON.stringify({code:code, seat:seat})); } catch (e) {} }
  function recall(){ try { return JSON.parse(localStorage.getItem('pd-match') || 'null'); } catch (e) { return null; } }
  function forget(){ try { localStorage.removeItem('pd-match'); } catch (e) {} }

  function write(fn){ Net.q = Net.q.catch(function(){}).then(fn); return Net.q; }
  function key(n){ return (Net.match && Net.match.game || 0) + '_' + n; }

  async function sha(s){
    if (window.crypto && crypto.subtle && window.TextEncoder){
      var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
    }
    var h = 0; for (var i = 0; i < s.length; i++) h = Math.imul(31, h) + s.charCodeAt(i) | 0;
    return 'h' + h;
  }
  function newSalt(){
    var a = new Uint32Array(4);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
    else for (var i = 0; i < 4; i++) a[i] = Math.random() * 4294967296;
    return Array.prototype.join.call(a, '-');
  }

  function lobbyErr(msg){ $('lobbyErr').textContent = msg || ''; }
  function setLobbyBusy(b){ $('createBtn').disabled = b; $('joinBtn').disabled = b; }

  function openLobby(prefill){
    showScreen('lobby');
    $('lobbyForm').hidden = false; $('waitBox').hidden = true;
    lobbyErr('');
    try { $('nick').value = $('nick').value || localStorage.getItem('pd-nick') || ''; } catch (e) {}
    if (prefill) $('codeIn').value = prefill;
    setLobbyBusy(true);
    netReady().then(function(st){
      setLobbyBusy(st !== 'ok');
      if (st !== 'ok') lobbyErr(NET_MSG[st]);
    });
  }

  function nick(){
    var v = ($('nick').value || '').trim().slice(0, 12);
    try { localStorage.setItem('pd-nick', v); } catch (e) {}
    return v;
  }

  async function createMatch(){
    lobbyErr(''); setLobbyBusy(true);
    try {
      var nm = nick();
      for (var tries = 0; tries < 6; tries++){
        var code = '';
        for (var i = 0; i < 4; i++) code += ALPH[Math.floor(Math.random() * ALPH.length)];
        var ref = Net.db.doc('matches/' + code);
        if ((await ref.get()).exists) continue;
        await ref.set({host: Net.uid, hostName: nm, guest: null, guestName: '', game: 0, created: Date.now()});
        await Net.db.doc('matches/' + code + '/seats/0').set({commits: {}, reveals: {}});
        remember(code, 0);
        netAttach(code, 0);
        return;
      }
      lobbyErr('Couldn’t make a free code. Try again.');
    } catch (e) {
      lobbyErr(e && e.code === 'invalid_argument' ? NET_MSG.readonly : 'Couldn’t create the match. Check your connection and try again.');
    }
    setLobbyBusy(false);
  }

  async function joinMatch(){
    lobbyErr('');
    var code = ($('codeIn').value || '').trim().toUpperCase();
    if (!/^[A-Z0-9]{4}$/.test(code)){ lobbyErr('Enter the 4-character code your friend sent you.'); return; }
    setLobbyBusy(true);
    try {
      var nm = nick();
      var ref = Net.db.doc('matches/' + code), snap = await ref.get();
      if (!snap.exists){ lobbyErr('No match found with code ' + code + '. Check it with your friend.'); setLobbyBusy(false); return; }
      var d = snap.data();
      if (!d.guest){
        var lease = await ref.acquire({holder: Net.uid + ':' + Math.random().toString(36).slice(2), ttlMs: 4000});
        if (!lease.acquired){ lobbyErr('Someone is joining this match right now. Try again in a few seconds.'); setLobbyBusy(false); return; }
        d = (await ref.get()).data();
        if (!d.guest){
          await ref.update({guest: Net.uid, guestName: nm});
          var sref = Net.db.doc('matches/' + code + '/seats/1');
          if (!(await sref.get()).exists) await sref.set({commits: {}, reveals: {}});
          remember(code, 1);
          netAttach(code, 1);
          return;
        }
      }
      var mem = recall();
      if (mem && mem.code === code && (mem.seat === 0 ? d.host : d.guest) === Net.uid){ netAttach(code, mem.seat); return; }
      if (d.guest === Net.uid){ remember(code, 1); netAttach(code, 1); return; }
      if (d.host === Net.uid){ remember(code, 0); netAttach(code, 0); return; }
      lobbyErr('That match already has two players.');
    } catch (e) {
      lobbyErr(e && e.code === 'invalid_argument' ? NET_MSG.readonly : 'Couldn’t join the match. Check your connection and try again.');
    }
    setLobbyBusy(false);
  }

  function netDetach(){
    Net.unsubs.forEach(function(u){ try { u(); } catch (e) {} });
    Net.unsubs = [];
    Net.code = null; Net.match = null;
  }

  function netAttach(code, seat){
    netDetach();
    Net.code = code; Net.seat = seat; Net.match = null; Net.seats = [null, null];
    Net.priv = {}; Net.revealing = {}; Net.ver = {};
    Net.privRef = Net.db.doc('data/users/' + Net.uid + '/' + code + '-' + seat);
    Net.privRef.get().then(function(s){
      if (s.exists) Net.priv = Object.assign({}, s.data().picks || {}, Net.priv);
      onNet();
    }).catch(function(){});
    Net.unsubs.push(Net.db.doc('matches/' + code).onSnapshot(function(s){
      Net.match = s.exists ? s.data() : null; onNet();
    }, netErr));
    Net.unsubs.push(Net.db.collection('matches/' + code + '/seats').onSnapshot(function(q){
      q.docs.forEach(function(d){ if (d.id === '0' || d.id === '1') Net.seats[Number(d.id)] = d.data(); });
      onNet();
    }, netErr));
    $('codeShow').textContent = code;
    $('lobbyForm').hidden = true; $('waitBox').hidden = false;
    setLobbyBusy(false);
  }

  function netErr(){
    var msg = 'Lost the connection to the match. Go back to the menu and join again with code ' + (Net.code || '') + '.';
    if (S && S.mode === 'online') showWait('Connection lost', msg);
    else lobbyErr(msg);
  }

  function netNames(){
    var m = Net.match || {};
    var n = [m.hostName || 'Blue', m.guestName || 'Orange'];
    n[Net.seat] = 'You';
    return n;
  }

  // Did this reveal match the fingerprint locked in earlier? (async, cached)
  function verified(seat, k, rv, commit){
    var id = seat + '|' + k;
    if (Net.ver[id] === undefined){
      Net.ver[id] = null;
      sha(rv.pick + ':' + rv.salt).then(function(h){ Net.ver[id] = h === commit; onNet(); });
    }
    return Net.ver[id];
  }

  // Kicks both players have revealed, in order.
  function resolved(){
    var out = [], a = Net.seats[0], b = Net.seats[1];
    if (!a || !b) return out;
    for (var n = 0; n < 200; n++){
      var k = key(n), ra = (a.reveals || {})[k], rb = (b.reveals || {})[k];
      if (!ra || !rb) break;
      var va = verified(0, k, ra, (a.commits || {})[k]), vb = verified(1, k, rb, (b.commits || {})[k]);
      if (va === null || vb === null) break;
      var pa = va && [0,1,2].indexOf(ra.pick) >= 0 ? ra.pick : null;
      var pb = vb && [0,1,2].indexOf(rb.pick) >= 0 ? rb.pick : null;
      var sh = n % 2, shot = sh === 0 ? pa : pb, dive = sh === 0 ? pb : pa;
      if (shot === null) shot = dive === null ? 0 : dive;       // a bad shooter reveal is saved
      if (dive === null) dive = (shot + 1) % 3;                  // a bad keeper reveal concedes
      out.push({shooter: sh, shot: shot, dive: dive, goal: shot !== dive});
    }
    return out;
  }

  function onNet(){
    var m = Net.match;
    if (!m || !Net.code) return;
    if (!m.guest && Net.seat === 0 && !(S && S.mode === 'online')){
      if ($('lobby').hidden) showScreen('lobby');
      $('lobbyForm').hidden = true; $('waitBox').hidden = false;
      return;
    }
    if (!S || S.mode !== 'online' || S.code !== Net.code){
      S = {mode: 'online', code: Net.code, me: Net.seat, game: m.game || 0, names: netNames(),
           kicks: [], shot: null, dive: null, phase: null};
      S.kicks = resolved().map(function(k){ return {shooter: k.shooter, goal: k.goal, shot: k.shot, dive: k.dive}; });
      showScreen('game');
      beginKick();
      return;
    }
    if ((m.game || 0) !== S.game){
      S.game = m.game || 0; S.kicks = []; Net.revealing = {};
      beginKick();
      return;
    }
    var nm = netNames();
    if (nm[0] !== S.names[0] || nm[1] !== S.names[1]){ S.names = nm; renderBoard(S.phase === 'over'); }
    netMaybeReveal();
    if (S.phase === 'pickShot' || S.phase === 'pickKeep' || S.phase === 'wait') netStep();
  }

  // Once both picks are locked in, publish my real pick so both phones can play the kick.
  function netMaybeReveal(){
    var me = Net.seats[S.me], opp = Net.seats[1 - S.me];
    if (!me || !opp) return;
    var k = key(resolved().length);
    if ((me.commits || {})[k] && (opp.commits || {})[k] && !(me.reveals || {})[k] && Net.priv[k] && !Net.revealing[k]){
      Net.revealing[k] = true;
      var patch = {reveals: {}}; patch.reveals[k] = Net.priv[k];
      var ref = Net.db.doc('matches/' + Net.code + '/seats/' + S.me);
      write(function(){ return ref.update(patch); }).catch(function(){ Net.revealing[k] = false; });
    }
  }

  function netStep(){
    if (S.phase === 'reveal' || S.phase === 'result' || S.phase === 'over' || S.phase === 'sending') return;
    var n = S.kicks.length, res = resolved();
    if (res.length > n){ S.shot = res[n].shot; S.dive = res[n].dive; reveal(); return; }
    var k = key(n), me = Net.seats[S.me] || {}, opp = Net.seats[1 - S.me] || {};
    var oppName = S.names[1 - S.me];
    if ((me.commits || {})[k]){
      S.phase = 'wait';
      showWait('Locked in', (opp.commits || {})[k] ? 'Both picks are in. Revealing…' : 'Waiting for ' + oppName + ' to pick…');
      return;
    }
    if (S.phase !== 'pickShot' && S.phase !== 'pickKeep') setPhase(shooter() === S.me ? 'pickShot' : 'pickKeep');
  }

  function netCommit(z){
    var k = key(S.kicks.length), salt = newSalt(), back = S.phase;
    S.phase = 'sending';
    showWait('Locked in', 'Sending your pick…');
    Net.priv[k] = {pick: z, salt: salt};
    var seatRef = Net.db.doc('matches/' + Net.code + '/seats/' + S.me);
    sha(z + ':' + salt).then(function(h){
      var picks = Object.assign({}, Net.priv);
      return Net.privRef.set({picks: picks}).then(function(){
        var patch = {commits: {}}; patch.commits[k] = h;
        return write(function(){ return seatRef.update(patch); });
      });
    }).then(function(){
      S.phase = 'wait'; onNet();
    }).catch(function(){
      delete Net.priv[k];
      setPhase(back);
      $('roleSub').textContent = 'Your pick didn’t send. Check your connection and pick again.';
    });
  }

  function netRematch(){
    var g = (S.game || 0) + 1;
    $('rematchBtn').disabled = true;
    write(function(){ return Net.db.doc('matches/' + Net.code).update({game: g}); })
      .catch(function(){})
      .then(function(){ $('rematchBtn').disabled = false; });
  }

  $('cpuBtn').onclick = function(){ start('cpu'); };
  $('localBtn').onclick = function(){ start('local'); };
  $('onlineBtn').onclick = function(){ var m = recall(); openLobby(m ? m.code : ''); };
  $('createBtn').onclick = createMatch;
  $('joinBtn').onclick = joinMatch;
  $('codeIn').addEventListener('keydown', function(e){ if (e.key === 'Enter') joinMatch(); });
  $('lobbyBack').onclick = function(){ netDetach(); showScreen('menu'); };
  $('copyBtn').onclick = function(){
    var b = $('copyBtn'), code = $('codeShow').textContent;
    var done = function(){ b.textContent = 'Copied'; setTimeout(function(){ b.textContent = 'Copy code'; }, 1500); };
    try { navigator.clipboard.writeText(code).then(done, function(){ selectCode(); }); } catch (e) { selectCode(); }
  };
  function selectCode(){
    var r = document.createRange(); r.selectNodeContents($('codeShow'));
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  $('nextBtn').onclick = beginKick;
  $('rematchBtn').onclick = function(){ if (S.mode === 'online') netRematch(); else start(S.mode); };
  $('quitBtn').onclick = toMenu;
  Array.prototype.forEach.call(document.querySelectorAll('.pick'), function(b){
    b.addEventListener('click', function(){ onPick(Number(b.dataset.z)); });
  });
  // A link ending in #CODE opens straight into the join screen.
  if (/^#[A-Za-z0-9]{4}$/.test(location.hash)) openLobby(location.hash.slice(1).toUpperCase());

  // Test hook, only active with #debug in the address.
  if (location.hash === '#debug'){
    window.__pd = {
      shot: function(shot, dive, t){ if (!S) start('cpu'); setControls('none'); A.plan = makePlan(shot, dive); A.playing = true; A.freeze = t; },
      idle: function(){ if (!S) start('cpu'); A.plan = null; A.playing = false; A.freeze = null; }
    };
  }
})();
</script>
</body>
</html>
