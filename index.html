<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1511">
<title>Duelist</title>
<!-- Duelist game 0.6 · online server v1.1 -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>html,body{background:#0b1511}body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Saira+Condensed:wght@600;800&display=swap">
<style>
/* Layout: one-screen phone app — TV-style shootout scoreboard on top, a broadcast "behind the taker" camera on the pitch, role banner + big pick buttons at thumb height. Each player owns a kit colour (blue / orange) used on the board, the banner and the players. Committed night-match look, single theme. */
:root{
  --night:#0b1511;
  --panel:#13221b;
  --line:#26392f;
  --chalk:#eef3ea;
  --muted:#93a89b;
  --teamA:#3d9bff;
  --teamB:#ff8a2a;
  --goal:#2fc46f;
  --miss:#e8433a;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--night);color:var(--chalk);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.app{min-height:100%;max-width:480px;margin:0 auto;padding-inline:16px;padding-block:14px;display:flex;flex-direction:column;gap:12px}

/* Menu */
.menu{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px}
.menu h1{font-family:var(--display);font-weight:800;font-size:clamp(52px,17vw,76px);line-height:.88;letter-spacing:.01em;margin:0;text-transform:uppercase}
.menu h1 .a{color:var(--teamA)} .menu h1 .b{color:var(--teamB)}
.rules{display:grid;gap:8px;margin:0;padding:0;list-style:none;font-size:15px}
.rules li{display:flex;gap:10px;align-items:baseline}
.rules li b{font-family:var(--display);color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase;min-width:4.5em}
.modes{display:grid;gap:10px}
.btn{display:block;width:100%;padding:18px 20px;border-radius:12px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;text-align:left;background:var(--panel);border:1px solid var(--line)}
.btn small{display:block;font-family:var(--body);font-weight:400;font-size:14px;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:2px}
.btn.primary{background:var(--chalk);color:var(--night);border-color:var(--chalk)}
.btn.primary small{color:#4b5a51}

/* Online lobby */
.lobby{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.lobby h2{margin:0;font-family:var(--display);font-weight:800;font-size:40px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.lobby p{margin:0;color:var(--muted);line-height:1.5}
.field{display:grid;gap:6px}
.field label{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input{width:100%;padding:14px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--chalk);font:inherit;font-size:18px}
.field input:focus{outline:2px solid var(--chalk);outline-offset:1px}
.joinrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.joinrow input{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.3em;text-transform:uppercase}
.joinrow .btn{width:auto;text-align:center;padding-inline:24px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.12em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.code{font-family:var(--display);font-weight:800;font-size:64px;letter-spacing:.25em;line-height:1;padding-block:12px;text-align:center;border:2px dashed var(--line);border-radius:14px;user-select:all}
.copy{justify-self:start;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:15px}
.wait{display:flex;align-items:center;gap:10px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--goal);flex:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.err{color:var(--miss)!important;font-weight:600;min-height:1.5em}
.waitbar{display:flex;align-items:center;gap:12px;padding:16px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:16px}
.waitbar b{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.03em;display:block}
.waitbar span.t{color:var(--muted);font-size:15px}
.btn:active{transform:scale(.985)}

/* Scoreboard, modelled on TV shootout graphics */
.board{background:#070d0a;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:7px}
.row{display:grid;grid-template-columns:6px minmax(0,1fr) auto 2.6ch;align-items:center;gap:10px}
.kit{width:6px;height:24px;border-radius:2px}
.row[data-p="0"] .kit{background:var(--teamA)}
.row[data-p="1"] .kit{background:var(--teamB)}
.nm{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:6px;flex-wrap:nowrap;flex:none}
.dot{flex:none;width:18px;height:18px;border-radius:50%;background:transparent;border:2px solid rgba(238,243,234,.5);display:grid;place-items:center}
.dot svg{width:11px;height:11px;display:block}
.sdsep{flex:none;width:1px;height:16px;background:var(--line);margin-inline:1px}
.more{flex:none;font-family:var(--display);font-weight:600;font-size:12px;color:var(--muted);align-self:center}
.board.long .dots{gap:4px}
.board.long .dot{width:14px;height:14px;border-width:1.5px}
.board.long .dot svg{width:9px;height:9px}
.dot.scored{background:var(--goal);border-color:var(--goal)}
.dot.missed{background:var(--miss);border-color:var(--miss)}
.sc{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.kick{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:6px}

/* Pitch */
.stage{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--night)}
#pitch{position:absolute;inset:0;width:100%;height:100%;display:block}

.flash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:rgba(7,13,10,.55);text-align:center;padding:16px;animation:pop .25s ease-out}
.flash b{font-family:var(--display);font-weight:800;font-size:clamp(44px,15vw,68px);line-height:.95;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.flash span{font-size:15px;color:var(--chalk);text-shadow:0 1px 6px rgba(0,0,0,.7)}
@keyframes pop{from{opacity:0;transform:scale(1.06)}}

.handoff{position:absolute;inset:0;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.handoff h2{margin:0;font-family:var(--display);font-weight:800;font-size:34px;text-transform:uppercase;letter-spacing:.02em}
.handoff p{margin:0;color:var(--muted);max-width:28ch;line-height:1.45}
.handoff button{margin-top:8px;padding:14px 26px;border-radius:999px;color:#08110c;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase}

/* Role banner + controls */
.role{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:#08110c}
.role svg{width:34px;height:34px;flex:none}
.role div{display:grid;gap:0;min-width:0}
.role h3{margin:0;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05;text-transform:uppercase;letter-spacing:.03em}
.role p{margin:0;font-size:15px;font-weight:600;opacity:.8}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pick{min-height:68px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.05em;text-transform:uppercase}
.pick i{font-style:normal;font-size:22px;line-height:1;color:var(--muted)}
.pick:active{background:var(--chalk);color:var(--night)}
.actions{display:grid;gap:10px}
.actions .btn{text-align:center}
.quit{background:none;color:var(--muted);font-size:14px;padding:6px;justify-self:center;text-decoration:underline;text-underline-offset:3px}

@media (prefers-reduced-motion:reduce){ .flash{animation:none} }

/* 0.5: game picker, nickname, stats */
.hub-title{font-family:var(--display);font-weight:800;font-size:clamp(40px,12vw,56px);line-height:.9;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.hub-title .a{color:var(--teamA)} .hub-title .b{color:var(--teamB)}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:15px}
.who b{color:var(--chalk);font-family:var(--display);font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.who .link{background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px 2px;font-size:15px}
.nickrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;width:100%}
.nickrow input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--chalk);font:inherit;font-size:18px}
.nickrow button{padding:0 18px;border-radius:12px;background:var(--chalk);color:var(--night);font-family:var(--display);font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.game{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px 10px;border-radius:12px;background:var(--panel);border:1.5px solid var(--line);text-align:left;min-width:0}
.game svg{width:30px;height:30px}
.game b{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
.game small{font-size:12.5px;color:var(--muted);line-height:1.3}
.game[aria-checked="true"]{border-color:var(--chalk);background:#1a2c23}
.stats{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.stats h3{margin:0;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{display:grid;gap:0}
.tile b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;font-size:14px;align-items:baseline;border-top:1px solid var(--line);padding-top:7px;font-variant-numeric:tabular-nums}
.srow span:first-child{color:var(--chalk)} .srow span{color:var(--muted)}
.gamehead{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* 0.5: in-game extras */
.mute{position:absolute;bottom:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(7,13,10,.6);display:grid;place-items:center;z-index:3}
.mute svg{width:18px;height:18px}
.skiphint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:13px;color:rgba(238,243,234,.7);pointer-events:none;z-index:2}
.bubble{position:absolute;top:44px;max-width:70%;padding:6px 12px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.02em;color:#08110c;z-index:3;animation:bub 2.6s ease forwards;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble.l{left:10px} .bubble.r{right:10px}
@keyframes bub{0%{opacity:0;transform:translateY(6px) scale(.9)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.reacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.reacts button{padding:10px 4px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.03em}
.reacts button:active{background:var(--chalk);color:var(--night)}
.timer{height:4px;border-radius:2px;background:rgba(8,17,12,.25);overflow:hidden;margin-top:6px}
.timer i{display:block;height:100%;background:#08110c;width:100%}
.role div{flex:1}
.pick i{font-size:26px}
@media (prefers-reduced-motion:reduce){ .bubble{animation:none} }
</style>

<div class="app">
  <section class="menu" id="menu">
    <div style="display:grid;gap:10px">
      <h1 class="hub-title">Pick your <span class="a">du</span><span class="b">el</span></h1>
      <div class="who" id="who"></div>
    </div>
    <div class="games" id="games" role="radiogroup" aria-label="Game">
      <button class="game" data-game="pen" role="radio" aria-checked="true">
        <svg viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="#f4f6f2"/><polygon points="15,9 20.5,13 18.5,19.5 11.5,19.5 9.5,13" fill="#0b1511"/></svg>
        <b>Penalty Duel</b><small>5 kicks each, then sudden death</small></button>
      <button class="game" data-game="rps" role="radio" aria-checked="false">
        <svg viewBox="0 0 30 30" aria-hidden="true"><rect x="5" y="9" width="17" height="15" rx="6" fill="#e2b08a"/><rect x="9" y="5" width="12" height="7" rx="3.5" fill="#f1caa6"/><rect x="18" y="12" width="7" height="10" rx="3.5" fill="#c08a64"/></svg>
        <b>Rock Paper Scissors</b><small>First to 3 rounds</small></button>
      <button class="game" data-game="mix" role="radio" aria-checked="false">
        <svg viewBox="0 0 30 30" aria-hidden="true"><rect x="3" y="6" width="11" height="18" rx="3" fill="#3d9bff"/><rect x="16" y="6" width="11" height="18" rx="3" fill="#ff8a2a"/><text x="15" y="19" text-anchor="middle" font-family="Saira Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="10" fill="#08110c">VS</text></svg>
        <b>Mixed Duel</b><small>Penalties, RPS, then a decider</small></button>
    </div>
    <div class="modes">
      <button class="btn primary" id="cpuBtn">Play vs computer<small id="cpuSub">You wear blue.</small></button>
      <button class="btn" id="onlineBtn">Play a friend online<small>Each on your own phone. Picks stay secret.</small></button>
      <button class="btn" id="localBtn">2 players, one phone<small>Blue vs orange. Pass the phone between turns.</small></button>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="lobby" id="lobby" hidden>
    <div style="display:grid;gap:4px"><span class="gamehead" id="lobbyGame"></span><h2>Play a friend</h2></div>
    <div id="lobbyForm" style="display:grid;gap:16px">
      <button class="btn primary" id="createBtn">Create a match<small>You get a code to send your friend.</small></button>
      <div class="or">or</div>
      <div class="field"><label for="codeIn">Join with a code</label>
        <div class="joinrow"><input id="codeIn" maxlength="4" placeholder="K7Q2" autocapitalize="characters" autocomplete="off" spellcheck="false"><button class="btn" id="joinBtn">Join</button></div>
      </div>
    </div>
    <div id="waitBox" hidden style="display:grid;gap:14px">
      <p>Invite a friend in Telegram, or tell them this code:</p>
      <div class="code" id="codeShow"></div>
      <button class="btn primary" id="shareBtn">Send invite<small>Your friend taps the link and joins straight away.</small></button>
      <button class="copy" id="copyBtn">Copy code</button>
      <p class="wait"><span class="pulse"></span>Waiting for your friend to join…</p>
    </div>
    <p class="err" id="lobbyErr" role="alert"></p>
    <button class="quit" id="lobbyBack">Back to menu</button>
  </section>

  <section id="game" hidden style="display:contents">
    <div class="board" id="board">
      <div class="row" data-p="0" id="row0"><span class="kit"></span><span class="nm"></span><span class="dots"></span><span class="sc"></span></div>
      <div class="row" data-p="1" id="row1"><span class="kit"></span><span class="nm"></span><span class="dots"></span><span class="sc"></span></div>
      <div class="kick" id="kickLabel"></div>
    </div>

    <div class="stage" id="stage">
      <canvas id="pitch" aria-label="Game scene"></canvas>
      <button class="mute" id="muteBtn" aria-label="Turn sound off"></button>
      <div class="skiphint" id="skipHint" hidden>Tap to skip</div>
      <div class="flash" id="flash" hidden><b id="flashBig"></b><span id="flashSmall"></span></div>
      <div class="handoff" id="handoff" hidden>
        <h2 id="handTitle"></h2>
        <p id="handSub"></p>
        <button id="handBtn"></button>
      </div>
    </div>

    <div class="role" id="role">
      <svg id="roleIcon" viewBox="0 0 34 34" aria-hidden="true"></svg>
      <div><h3 id="roleTitle"></h3><p id="roleSub"></p><div class="timer" id="roleTimer" hidden><i id="roleTimerBar"></i></div></div>
    </div>

    <div class="waitbar" id="waitbar" hidden>
      <span class="pulse"></span>
      <div><b id="waitTitle">Locked in</b><span class="t" id="waitSub"></span></div>
    </div>

    <div class="picks" id="picks">
      <button class="pick" data-z="0"><i>←</i><span>Left</span></button>
      <button class="pick" data-z="1"><i>↑</i><span>Middle</span></button>
      <button class="pick" data-z="2"><i>→</i><span>Right</span></button>
    </div>

    <div class="reacts" id="reacts" hidden>
      <button data-r="Nice!">Nice!</button><button data-r="Lucky!">Lucky!</button><button data-r="Wow">Wow</button><button data-r="GG">GG</button>
    </div>

    <div class="actions">
      <button class="btn primary" id="nextBtn" hidden>Next kick</button>
      <button class="btn primary" id="nextGameBtn" hidden>Next game</button>
      <button class="btn primary" id="rematchBtn" hidden>Rematch</button>
      <button class="quit" id="quitBtn">Back to menu</button>
    </div>
  </section>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var KIT = ['var(--teamA)', 'var(--teamB)'];
  var KITC = ['#3d9bff', '#ff8a2a'];
  var SHOT_TXT = ['Shot left', 'Shot down the middle', 'Shot right'];
  var DIVE_TXT = ['keeper dived left', 'keeper stayed in the middle', 'keeper dived right'];
  var ICON_BALL = '<circle cx="17" cy="17" r="14" fill="#f4f6f2" stroke="#08110c" stroke-width="2"/><polygon points="17,11 22.5,15 20.5,21.5 13.5,21.5 11.5,15" fill="#08110c"/>';
  var ICON_GLOVE = '<rect x="9" y="12" width="16" height="17" rx="5" fill="#f4f6f2" stroke="#08110c" stroke-width="2"/><path d="M11 13V6M15 12V4M19 12V4M23 13V7" stroke="#08110c" stroke-width="3" stroke-linecap="round"/>';
  var CHECK = '<svg viewBox="0 0 12 12"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var CROSS = '<svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var S = null;

  // Telegram Mini App: dark header, back button, phone vibration, the player's Telegram name.
  var TG = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) ? window.Telegram.WebApp : null;
  function tgOk(v){ try { return !!(TG && TG.isVersionAtLeast && TG.isVersionAtLeast(v)); } catch (e) { return false; } }
  if (TG){
    try { TG.ready(); TG.expand(); } catch (e) {}
    try { if (tgOk('6.1')){ TG.setHeaderColor('#0b1511'); TG.setBackgroundColor('#0b1511'); } } catch (e) {}
    try { if (tgOk('7.7')) TG.disableVerticalSwipes(); } catch (e) {}
  }
  function tgBack(show){
    if (!TG || !tgOk('6.1') || !TG.BackButton) return;
    try { if (show) TG.BackButton.show(); else TG.BackButton.hide(); } catch (e) {}
  }

  /* =====================================================================
     SCENE: a small 3D world in metres, seen by a broadcast camera
     standing behind the penalty taker. x = sideways, y = up, z = toward goal.
     ===================================================================== */
  var F = 650, CX = 200, HZ = -5, CH = 3.6;          // camera: focal length, centre, horizon, height
  var ZS = 9.5, ZG = 20.5, ZN = 22.1, ZK = 20.15;    // ball spot, goal line, back of net, keeper
  var GW = 3.66, GH = 2.44, NH = 1.9, BR = 0.11;     // half goal width, bar height, net back height, ball radius
  var TC = 1.1, TF = 0.46, RESULT_T = TC + 1.55, DT = 1 / 120; // contact time, ball flight, result time

  function proj(v){ var s = F / v[2]; return [CX + v[0] * s, HZ + (CH - v[1]) * s, s]; }
  function gy(z){ return HZ + CH * F / z; }

  var KEYS = ['x','y','z','yaw','lean','roll','lf','lk','la','rf','rk','ra','alf','ala','ale','arf','ara','are'];
  function mk(base, o){ var p = {}; KEYS.forEach(function(k){ p[k] = (o && k in o) ? o[k] : base[k]; }); return p; }

  // Smooth curve through keyframes (cubic Hermite with Catmull-Rom slopes) so moves flow instead of stepping.
  function spline(kf, t){
    var n = kf.length;
    if (t <= kf[0].t) return kf[0].p;
    if (t >= kf[n-1].t) return kf[n-1].p;
    var i = 0; while (t >= kf[i+1].t) i++;
    var t0 = kf[i].t, t1 = kf[i+1].t, h = t1 - t0, s = (t - t0) / h;
    var h00 = 2*s*s*s - 3*s*s + 1, h10 = s*s*s - 2*s*s + s, h01 = -2*s*s*s + 3*s*s, h11 = s*s*s - s*s;
    function slope(j, k){

    }
    var out = {};
    KEYS.forEach(function(k){
      out[k] = h00 * kf[i].p[k] + h10 * h * slope(i, k) + h01 * kf[i+1].p[k] + h11 * h * slope(i+1, k);
    });

  }

  // Turn a pose into joint positions in the world.
  var DOWN = [0,-1,0], FWD = [0,0,1];
  function body(p){
    function tf(v){ return rotY(rotX(rotZ(v, p.roll), p.lean), p.yaw); }
    function at(l){ var v = tf(l); return [p.x + v[0], p.y + v[1], p.z + v[2]]; }
    function step(a, l, len){ var d = tf(l); return [a[0] + d[0]*len, a[1] + d[1]*len, a[2] + d[2]*len]; }
    function leg(sd, f, k, ab){
      var hip = at([0.1*sd, 0, 0]);
      var knee = step(hip, rotZ(rotX(DOWN, -f), sd*ab), 0.46);
      var ank = step(knee, rotZ(rotX(DOWN, -(f - k)), sd*ab), 0.44);
      var toe = step(ank, rotZ(rotX(FWD, -(f - k)), sd*ab), 0.17);
      return {hip:hip, knee:knee, ank:ank, toe:toe};
    }
    function arm(sd, f, ab, e){
      var sh = at([0.19*sd, 0.47, 0]);
      var el = step(sh, rotZ(rotX(DOWN, -f), sd*ab), 0.29);
      var ha = step(el, rotZ(rotX(DOWN, -(f + e)), sd*ab), 0.27);
      return {sh:sh, el:el, ha:ha};
    }
    return {
      L: leg(-1, p.lf, p.lk, p.la), R: leg(1, p.rf, p.rk, p.ra),
      AL: arm(-1, p.alf, p.ala, p.ale), AR: arm(1, p.arf, p.ara, p.are),
      hipL: at([-0.16, 0.04, 0]), hipR: at([0.16, 0.04, 0]),
      shL: at([-0.21, 0.48, 0]), shR: at([0.21, 0.48, 0]),
      shoL: at([-0.17, -0.18, 0]), shoR: at([0.17, -0.18, 0]),
      neck: at([0, 0.52, 0]), head: at([0, 0.68, 0]), chest: at([0, 0.28, 0]),

  }

  /* ---------- the shooter: run-up, plant, strike, follow-through ---------- */
  var RS = {x:-1.7, z:7.8}, RE = {x:-0.3, z:8.92};
  var SBASE = {x:RS.x, y:0.95, z:RS.z, yaw:0.95, lean:0.06, roll:0, lf:0, lk:0.12, la:0.06, rf:0, rk:0.12, ra:0.06,
               alf:0, ala:0.14, ale:0.25, arf:0, ara:0.14, are:0.25};

  function runPose(t){
    var A = clamp(t / 0.18, 0, 1);                       // ramps from standing into a full run
    var u = clamp(t / 0.92, 0, 1), e = u*u*(3 - 2*u)*0.35 + u*0.65;
    var ph = 2*Math.PI*(0.042 + 2.4*t), s = Math.sin(ph), c = Math.cos(ph);

      y: 0.95 - 0.04*A + 0.035*A*Math.cos(2*ph), yaw: 0.95 - 0.5*e, lean: 0.06 + 0.2*A,
      lf: 0.6*A*s, lk: 0.12 + A*(0.15 + 1.05*Math.max(0, c)),

  }

  function shooterFrames(shot){

      {t:0.85, p:runPose(0.85)},
      {t:0.92, p:runPose(0.92)},
      // plant: left foot beside the ball, kicking leg cocked back, arm out for balance
      {t:1.02, p:mk(SBASE,{x:-0.27,z:9.0,y:0.9,yaw:0.28,lean:0.04,roll:0.16, lf:0.3,lk:0.35,la:0.1, rf:-0.8,rk:1.8,ra:0.12,
                           alf:0.4,ala:1.25,ale:0.4, arf:-0.35,ara:0.5,are:0.6})},
      // contact
      {t:TC,   p:mk(SBASE,{x:-0.24,z:9.05,y:0.9,yaw:0.12+aim,lean:0,roll:0.13, lf:0.2,lk:0.3,la:0.1, rf:0.55,rk:0.3,ra:0.05,
                           alf:0.6,ala:1.4,ale:0.3, arf:-0.2,ara:0.7,are:0.5})},
      // follow-through
      {t:1.26, p:mk(SBASE,{x:-0.15,z:9.3,y:0.97,yaw:0.1+aim,lean:-0.14,roll:0.05, lf:0.05,lk:0.15,la:0.08, rf:1.25,rk:0.2,ra:0.05,
                           alf:0.9,ala:1.2,ale:0.3, arf:0.3,ara:0.6,are:0.4})},
      {t:1.62, p:mk(SBASE,{x:-0.05,z:9.65,y:0.93,yaw:0.1,lean:0.1,roll:0, lf:-0.25,lk:0.45, rf:0.3,rk:0.4,
                           alf:0.2,ala:0.35,ale:0.6, arf:0.2,ara:0.35,are:0.6})},
      {t:2.5,  p:mk(SBASE,{x:0,z:9.75,y:0.95,yaw:0.05,lean:0.08, alf:0.05,ala:0.2,ale:0.4, arf:0.05,ara:0.2,are:0.4})}
    ];
  }

  function shooterPose(t, plan){
    if (!plan || t < 0.92) return runPose(plan ? t : 0);
    return spline(plan.sk, t);
  }

  /* ---------- the keeper: ready stance, split-step, push-off, full-stretch dive ---------- */
  var KBASE = {x:0, y:0.8, z:ZK, yaw:Math.PI, lean:0.28, roll:0, lf:0.55, lk:0.95, la:0.22, rf:0.55, rk:0.95, ra:0.22,
               alf:0.45, ala:0.55, ale:0.7, arf:0.45, ara:0.55, are:0.7};
  var clock = 0;

  function ready(fade){
    return mk(KBASE, {x: 0.07*Math.sin(clock*2.2)*fade, y: 0.8 + 0.02*Math.sin(clock*6.5)*fade});
  }

  // Keeper faces the camera, so his left leg is on screen right. lead = leg on the dive side.
  function legs(o, kd, lead, push){
    var L = kd > 0 ? lead : push, R = kd > 0 ? push : lead;
    o.lf = L[0]; o.lk = L[1]; o.la = L[2]; o.rf = R[0]; o.rk = R[1]; o.ra = R[2];
    return o;
  }

  function keeperFrames(dive, shot, hi){
    var kd = dive - 1;
    var hop  = mk(KBASE, {y:0.9, lf:0.3, lk:0.5, rf:0.3, rk:0.5, lean:0.2});
    var load = mk(KBASE, {x:kd*0.12, y:0.72, lf:0.7, lk:1.25, rf:0.7, rk:1.25, roll:kd*0.12, la:0.3, ra:0.3});
    var f = [{t:-0.3, p:mk(KBASE)}, {t:-0.12, p:hop}, {t:0, p:load}];
    if (kd !== 0){
      f.push({t:0.2, p:legs(mk(KBASE,{x:kd*0.9, y:0.78 + 0.4*hi, roll:kd*0.8, lean:0.12,
                    alf:0.3,ala:2.3,ale:0.35, arf:0.3,ara:2.3,are:0.35}), kd, [0.8,1.2,0.3], [-0.1,0.15,0.3])});
      f.push({t:TF, p:legs(mk(KBASE,{x:kd*1.75, y:0.55 + 0.55*hi, roll:kd*(1.5 - 0.35*hi), lean:0.1,
                    alf:0.15,ala:2.9,ale:0.05, arf:0.15,ara:2.9,are:0.05}), kd, [0.35,0.5,0.35], [0,0.2,0.4])});
      f.push({t:0.75, p:legs(mk(KBASE,{x:kd*2.05, y:0.27, roll:kd*1.52, lean:0.15,
                    alf:0.3,ala:2.7,ale:0.35, arf:0.3,ara:2.7,are:0.35}), kd, [0.6,0.9,0.25], [0.1,0.3,0.3])});
      f.push({t:1.4, p:legs(mk(KBASE,{x:kd*2.1, y:0.25, roll:kd*1.54, lean:0.15,
                    alf:0.35,ala:2.4,ale:0.7, arf:0.35,ara:2.4,are:0.7}), kd, [0.7,1.1,0.25], [0.1,0.3,0.3])});

      f.push({t:0.8, p:mk(KBASE, {y:0.86, lf:0.4,lk:0.7,rf:0.4,rk:0.7, lean:0.35, alf:0.9,ala:0.3,ale:1.5, arf:0.9,ara:0.3,are:1.5})});
      f.push({t:1.4, p:mk(KBASE, {y:0.88, lf:0.3,lk:0.5,rf:0.3,rk:0.5, lean:0.25, alf:0.9,ala:0.3,ale:1.5, arf:0.9,ara:0.3,are:1.5})});

                                   alf:0.3,ala:1.7,ale:0.2, arf:0.3,ara:1.7,are:0.2})});
      f.push({t:TF, p:mk(KBASE, {x:ss*0.25, y:0.98, lf:0.15,lk:0.3,rf:0.15,rk:0.3, lean:0.1, roll:ss*0.35,
                                 alf:0.3,ala:2.1,ale:0.15, arf:0.3,ara:2.1,are:0.15})});
      f.push({t:0.8, p:mk(KBASE, {x:ss*0.3, y:0.82, roll:ss*0.1, alf:0.3,ala:1.2,ale:0.4, arf:0.3,ara:1.2,are:0.4})});
      f.push({t:1.4, p:mk(KBASE, {x:ss*0.3, y:0.86, lean:0.45, lf:0.45,lk:0.8,rf:0.45,rk:0.8,

  function keeperPose(r, plan){
    if (!plan || r < -0.3) return ready(plan ? clamp((-0.3 - r) / 0.5, 0, 1) : 1);
    return spline(plan.kk, r);
  }

  /* ---------- the ball: simulated once per kick, then played back ---------- */
  function handsMid(J){ return lerp3(J.AL.ha, J.AR.ha, 0.5); }

  function makePlan(shot, dive){
    var hi = Math.random();

    var saved = shot === dive, sd = shot - 1, target, catching = false;

      catching = true;
      target = handsMid(KJ); target[2] -= 0.12;
    } else if (saved){
      target = (sd * KJ.AL.ha[0] > sd * KJ.AR.ha[0]) ? KJ.AL.ha.slice() : KJ.AR.ha.slice();
      target[2] -= 0.1;
    } else if (sd === 0){
      target = [(Math.random() - 0.5) * 0.9, 0.4 + Math.random() * 1.5, ZG];
    } else {
      target = [sd * (2.65 + Math.random() * 0.6), 0.3 + Math.random() * 1.8, ZG];
    }
    plan.catching = catching;
    plan.ball = simBall(target, saved, catching, sd);

  function simBall(tgt, saved, catching, sd){
    var g = 9.8, out = [];
    var p = [0, BR, ZS];
    var v = [(tgt[0] - p[0]) / TF, (tgt[1] - p[1]) / TF + 0.5*g*TF, (tgt[2] - p[2]) / TF];
    var phase = 'fly', bulge = 0, bx = 0, by = 1, spin = 0, n = Math.ceil(2.4 / DT);
    for (var i = 0; i <= n; i++){

      var t = (i + 1) * DT;
      if (phase === 'held') continue;
      if (phase === 'fly' && saved && t >= TF){
        if (catching){ phase = 'held'; continue; }
        phase = 'free';
        v = [sd * 2.3, 2.6, -6.5];            // parried wide and back into play
      }
      v[1] -= g * DT;
      p[0] += v[0]*DT; p[1] += v[1]*DT; p[2] += v[2]*DT;

          bulge = Math.max(bulge * 0.9, pen);

          bulge *= 0.93;
        }

      }
      if (p[1] < BR){

        if (v[1] < 0){ v[1] *= -0.45; v[0] *= 0.82; v[2] *= 0.82; }
      }
    }
    return out;
  }

  function ballAt(r, plan, KJ){
    if (!plan || r < 0) return {x:0, y:BR, z:ZS, spin:0, bulge:0, bx:0, by:1};
    var s = plan.ball[Math.min(plan.ball.length - 1, Math.floor(r / DT))];
    if (s.held){
      var h = handsMid(KJ);
      return {x:h[0], y:h[1], z:h[2] - 0.12, spin:s.spin, bulge:0, bx:0, by:1};
    }
    return s;
  }

  /* ---------- drawing ---------- */
  var cv = $('pitch'), ctx = cv.getContext('2d');
  var bg = document.createElement('canvas'), bgx = bg.getContext('2d');
  var K = 1;

  function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  function paintBg(){
    var c = bgx;
    c.setTransform(K, 0, 0, K, 0, 0);
    var zB = 30, yB = gy(zB), yT = HZ + (CH - 0.9) * F / zB;

    // crowd
    var cg = c.createLinearGradient(0, 0, 0, yT);
    cg.addColorStop(0, '#0a120f'); cg.addColorStop(1, '#141f1a');
    c.fillStyle = cg; c.fillRect(0, 0, 400, yT + 1);
    var R = rng(7), cols = ['#3d9bff', '#ff8a2a', '#eef3ea', '#c9d3cc', '#ffd36b'];
    for (var y = 3; y < yT - 2; y += 3.3){
      var sz = 1.3 + (y / yT) * 1.1;
      for (var x = -2; x < 402; x += 3.4 + R() * 1.2){
        c.globalAlpha = 0.12 + R() * 0.32;
        c.fillStyle = cols[Math.floor(R() * cols.length)];
        c.fillRect(x, y + R() * 1.2, sz, sz * 1.2);
      }
    }
    c.globalAlpha = 1;

    // advertising boards
    c.fillStyle = '#0a1420'; c.fillRect(0, yT, 400, yB - yT);
    c.fillStyle = 'rgba(255,255,255,.06)'; c.fillRect(0, yT, 400, 1.5);
    c.font = '800 ' + Math.round((yB - yT) * 0.62) + 'px "Saira Condensed","Arial Narrow",sans-serif';
    c.textBaseline = 'middle';
    var labels = ['PENALTY DUEL', '1V1', 'PENALTY DUEL', 'SUDDEN DEATH'];
    for (var i = 0, bx = -30; bx < 420; i++){
      c.fillStyle = i % 2 ? 'rgba(255,138,42,.42)' : 'rgba(61,155,255,.42)';
      var w = c.measureText(labels[i % 4]).width;
      c.fillText(labels[i % 4], bx, (yT + yB) / 2 + 0.5);
      bx += w + 26;
    }

    // grass with mowing stripes
    var z = zB, k = 0;
    while (z > 2){
      var z2 = z - 1.83;
      c.fillStyle = k++ % 2 ? '#1f5832' : '#1b4c2b';
      c.fillRect(0, gy(z), 400, gy(Math.max(z2, 0.5)) - gy(z) + 1);
      z = z2;
    }
    var shade = c.createLinearGradient(0, yB, 0, 300);
    shade.addColorStop(0, 'rgba(0,0,0,.35)'); shade.addColorStop(0.5, 'rgba(0,0,0,0)'); shade.addColorStop(1, 'rgba(0,0,0,.25)');
    c.fillStyle = shade; c.fillRect(0, yB, 400, 300 - yB);

    // pitch markings: goal line, six-yard line, penalty spot
    c.fillStyle = 'rgba(238,243,234,.8)';
    var yg = gy(ZG); c.fillRect(0, yg - 0.7, 400, 1.5);
    var y6 = gy(ZG - 5.5); c.fillRect(0, y6 - 0.9, 400, 1.8);
    var sp = proj([0, 0, ZS]);
    c.beginPath(); c.ellipse(sp[0], sp[1], 0.12 * sp[2], 0.12 * sp[2] * 0.36, 0, 0, Math.PI*2); c.fill();

    // floodlight glow + vignette
    var fl = c.createRadialGradient(200, -60, 10, 200, -60, 330);
    fl.addColorStop(0, 'rgba(255,244,214,.20)'); fl.addColorStop(1, 'rgba(255,244,214,0)');
    c.fillStyle = fl; c.fillRect(0, 0, 400, 300);
    var vg = c.createRadialGradient(200, 160, 120, 200, 160, 290);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)');
    c.fillStyle = vg; c.fillRect(0, 0, 400, 300);
  }

  function resize(){
    var r = cv.getBoundingClientRect();
    if (!r.width) return;
    var dpr = Math.min(3, window.devicePixelRatio || 1);
    var w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
    if (cv.width !== w || cv.height !== h){
      cv.width = w; cv.height = h; bg.width = w; bg.height = h;
      K = w / 400;
      paintBg();
    }
  }

  function line(a, b, w, col){
    var A = proj(a), B = proj(b);
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(0.8, w * (A[2] + B[2]) / 2);
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
  }
  function dotAt(a, r, col){
    var A = proj(a);
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(A[0], A[1], Math.max(0.8, r * A[2]), 0, Math.PI*2); ctx.fill();
  }
  function poly(pts, col, round){
    var s = 0;
    ctx.beginPath();
    pts.forEach(function(p, i){ var P = proj(p); s += P[2]; if (i) ctx.lineTo(P[0], P[1]); else ctx.moveTo(P[0], P[1]); });
    ctx.closePath();
    ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = round * s / pts.length;
    ctx.fill(); ctx.stroke();
  }

  function shadow(x, z, rx, a){

  /* =====================================================================

    },
    kick:  function(){ tone('sine', 150, 45, 0.004, 0.9, 0.17); burst('highpass', 1800, 0.7, 0.002, 0.25, 0.05); },
    net:   function(){ burst('bandpass', 900, 0.8, 0.01, 0.45, 0.45, 500); },
    glove: function(){ burst('lowpass', 600, 0.7, 0.003, 0.8, 0.12); tone('sine', 110, 70, 0.003, 0.4, 0.1); },
    cheer: function(){ burst('bandpass', 700, 0.6, 0.18, 0.5, 1.7, 1100); burst('bandpass', 1500, 1.2, 0.25, 0.18, 1.4); },
    groan: function(){ burst('lowpass', 520, 0.9, 0.12, 0.42, 1.3, 260); tone('sawtooth', 150, 95, 0.15, 0.03, 1.0); },
    thump: function(){ tone('sine', 95, 55, 0.004, 0.55, 0.09); },
    snap:  function(){ burst('highpass', 1600, 0.8, 0.002, 0.55, 0.07); tone('sine', 140, 60, 0.003, 0.4, 0.08); },
    win:   function(){ tone('triangle', 660, 0, 0.01, 0.18, 0.16); tone('triangle', 990, 0, 0.01, 0.18, 0.28, 0.13); },
    draw:  function(){ tone('triangle', 520, 0, 0.01, 0.12, 0.2); },
    tick:  function(){ tone('square', 1200, 0, 0.002, 0.05, 0.03); },
    pop:   function(){ tone('sine', 700, 1000, 0.005, 0.12, 0.08); }
  };
  function ambience(on){
    var c = on ? ac() : Snd.ctx;
    if (on && c && !Snd.amb){
      var s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      s.buffer = noise(c); s.loop = true; f.type = 'lowpass'; f.frequency.value = 480; g.gain.value = 0.035;
      s.connect(f); f.connect(g); g.connect(c.destination); s.start();
      Snd.amb = {s:s, g:g};
    } else if (!on && Snd.amb){
      try { Snd.amb.s.stop(); } catch (e) {}
      Snd.amb = null;
    }
  }
  function buzz(ms){
    var h = tgOk('6.1') && TG.HapticFeedback;
    if (h){
      try { if (Array.isArray(ms)) h.notificationOccurred('success'); else h.impactOccurred(ms >= 40 ? 'heavy' : ms >= 25 ? 'medium' : 'light'); } catch (e) {}
      return;
    }
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  }
  var ICON_SOUND_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="#eef3ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
  var ICON_SOUND_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="#eef3ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  function paintMute(){
    $('muteBtn').innerHTML = Snd.muted ? ICON_SOUND_OFF : ICON_SOUND_ON;
    $('muteBtn').setAttribute('aria-label', Snd.muted ? 'Turn sound on' : 'Turn sound off');
  }

  /* ---------- timed events inside an animation (sounds, haptics) ---------- */
  function schedule(list){ A.ev = list.map(function(e){ return {t:e[0], f:e[1], last:!!e[2], done:false}; }); }
  function runEvents(t){
    (A.ev || []).forEach(function(e){ if (!e.done && t >= e.t){ e.done = true; e.f(); } });
  }
  function skipAnim(){
    if (!A.playing || A.done || A.freeze != null) return;
    var now = performance.now();
    (A.ev || []).forEach(function(e){ if (!e.done){ e.done = true; if (e.last) e.f(); } });
    A.start = now - A.resultT * 1000;
  }

  var last = null;
  function frame(now){
    requestAnimationFrame(frame);
    if ($('game').hidden){ last = now; return; }
    var dt = last == null ? 0 : Math.min(0.05, (now - last) / 1000);
    last = now; clock += dt;
    resize();
    var t = A.freeze != null ? A.freeze : A.playing ? (now - A.start) / 1000 : 0;
    if (S && S.game === 'rps') renderRps(t); else render(t);
    if (A.playing && A.freeze == null) runEvents(t);
    if (A.playing && !A.done && t >= A.resultT){ A.done = true; $('skipHint').hidden = true; if (A.onDone) A.onDone(); }
  }
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (cv.width) paintBg(); });

  /* =====================================================================
     GAME LOGIC
     S.game  = the game being played right now: 'pen' (penalties), 'rps', or
               'pensd' (sudden-death penalties, the Mixed Duel decider)
     S.kind  = what was chosen in the menu: 'pen', 'rps' or 'mix'
     S.kicks = penalty kicks {shooter, shot, dive, goal}, or RPS rounds {a, b, w}
     S.series (Mixed Duel only) = {idx, results[]}: which game of the 3, and who won each
     ===================================================================== */
  var SERIES = ['pen', 'rps', 'pensd'];
  var GAME_NAME = {pen:'Penalty Duel', rps:'Rock Paper Scissors', pensd:'Sudden-death penalties', mix:'Mixed Duel'};
  var RPS_TO = 3;
  var RPS_ICON = ['✊', '✋', '✌️'];
  var PEN_PICKS = [['←', 'Left'], ['↑', 'Middle'], ['→', 'Right']];
  var ICON_HAND = '<rect x="7" y="11" width="18" height="16" rx="6" fill="#f4f6f2" stroke="#08110c" stroke-width="2"/><rect x="10" y="6" width="13" height="8" rx="4" fill="#f4f6f2" stroke="#08110c" stroke-width="2"/>';
  var HUB = {game:'pen'};
  var TIMER_S = 10;

  function rand(){ return Math.floor(Math.random() * 3); }
  function shooter(){ return S.kicks.length % 2; }
  function keeper(){ return 1 - shooter(); }
  function name(p){ return S.names[p]; }
  function isMe(p){ return S.mode === 'cpu' ? p === 0 : S.mode === 'online' ? p === S.me : false; }

  function tally(list){
    var g = [0,0], t = [0,0];
    (list || S.kicks).forEach(function(k){ t[k.shooter]++; if (k.goal) g[k.shooter]++; });
    return {g:g, t:t};
  }
  function rpsWins(list){
    var w = [0,0];
    (list || S.kicks).forEach(function(r){ if (r.w === 0 || r.w === 1) w[r.w]++; });
    return w;
  }
  function winnerOf(game, list){
    if (game === 'rps'){
      var w = rpsWins(list);
      return w[0] >= RPS_TO ? 0 : w[1] >= RPS_TO ? 1 : null;
    }
    var r = tally(list), g = r.g, t = r.t, n = list.length;
    if (game === 'pensd') return (n > 0 && n % 2 === 0 && g[0] !== g[1]) ? (g[0] > g[1] ? 0 : 1) : null;
    if (n <= 10){
      if (g[0] > g[1] + (5 - t[1])) return 0;
      if (g[1] > g[0] + (5 - t[0])) return 1;
      return null;
    }
    if (n % 2 === 0 && g[0] !== g[1]) return g[0] > g[1] ? 0 : 1;
    return null;
  }
  function winner(){ return winnerOf(S.game, S.kicks); }
  function seriesWins(){
    var w = [0,0];
    if (S.series) S.series.results.forEach(function(r){ if (r === 0 || r === 1) w[r]++; });
    return w;
  }

  // Scoreboard. Penalties: 5 circles per team, plus one more per sudden-death round, added to the right.
  // The Mixed Duel decider is sudden death from the first kick. RPS: 3 pips per player, one per round won.
  function renderBoard(over){
    var n = S.kicks.length;
    $('board').classList.remove('long');
    [0,1].forEach(function(p){
      var row = $('row' + p);
      row.querySelector('.nm').textContent = name(p);
      var dots = row.querySelector('.dots');
      dots.innerHTML = '';
      if (S.game === 'rps'){
        var w = rpsWins();
        row.querySelector('.sc').textContent = w[p];
        for (var j = 0; j < RPS_TO; j++){
          var pd = document.createElement('span');
          pd.className = 'dot' + (j < w[p] ? ' scored' : '');
          if (j < w[p]) pd.innerHTML = CHECK;
          dots.appendChild(pd);
        }
        return;
      }
      var r = tally(), base = S.game === 'pensd' ? 0 : 5;
      row.querySelector('.sc').textContent = r.g[p];
      var extraN = Math.max(0, n - base * 2);
      var sdRounds = n < base * 2 ? 0 : (over ? Math.ceil(extraN / 2) : Math.floor(extraN / 2) + 1);
      var slots = base + sdRounds, MAXSD = 6, firstSd = Math.max(0, sdRounds - MAXSD);
      if (sdRounds > 2 && base) $('board').classList.add('long');
      var mine = S.kicks.filter(function(k){ return k.shooter === p; });
      for (var i = 0; i < slots; i++){
        if (i >= base && i - base < firstSd) continue;
        if (i === base && base){ var sep = document.createElement('span'); sep.className = 'sdsep'; dots.appendChild(sep); }
        if (i === base + firstSd && firstSd > 0){ var more = document.createElement('span'); more.className = 'more'; more.textContent = '+' + firstSd; dots.appendChild(more); }
        var d = document.createElement('span');
        d.className = 'dot';
        if (i < mine.length){
          d.classList.add(mine[i].goal ? 'scored' : 'missed');
          d.innerHTML = mine[i].goal ? CHECK : CROSS;
          d.setAttribute('aria-label', mine[i].goal ? 'scored' : 'missed');
        }
        dots.appendChild(d);
      }
    });
    var label;
    if (over) label = 'Full time';
    else if (S.game === 'rps') label = 'Round ' + (n + 1) + ' · First to ' + RPS_TO;
    else if (S.game === 'pensd') label = 'Decider · Sudden death';
    else label = n < 10 ? 'Round ' + (Math.floor(n / 2) + 1) + ' of 5' : 'Sudden death';
    if (S.series){
      var sw = seriesWins();
      label = 'Game ' + (S.series.idx + 1) + ' of 3 (' + sw[0] + '–' + sw[1] + ') · ' + label;
    }
    if (S.mode === 'online') label += ' · ' + S.code;
    $('kickLabel').textContent = label;
  }

  function setControls(mode){
    // mode: 'pick' | 'wait' | 'none' | 'next' | 'nextgame' | 'over'
    $('picks').hidden = mode !== 'pick';
    $('role').hidden = mode !== 'pick';
    $('waitbar').hidden = mode !== 'wait';
    $('nextBtn').hidden = mode !== 'next';
    $('nextGameBtn').hidden = mode !== 'nextgame';
    $('rematchBtn').hidden = mode !== 'over';
    $('reacts').hidden = !(S && S.mode === 'online');
    if (mode !== 'pick') stopTimer();
  }

  function setPickButtons(rps){
    Array.prototype.forEach.call(document.querySelectorAll('.pick'), function(b, i){
      b.querySelector('i').textContent = rps ? RPS_ICON[i] : PEN_PICKS[i][0];
      b.querySelector('span').textContent = rps ? SIGN[i] : PEN_PICKS[i][1];
    });
    $('nextBtn').textContent = rps ? 'Next round' : 'Next kick';
  }

  function setPhase(p){
    S.phase = p;
    var who = p === 'pickShot' ? shooter() : p === 'pickKeep' ? keeper() : (S.mode === 'local' ? S.rpsTurn : S.me);
    if (S.mode === 'cpu' && p === 'pickRps') who = 0;
    $('role').style.background = KIT[who];
    setPickButtons(p === 'pickRps');
    if (p === 'pickShot'){
      $('roleIcon').innerHTML = ICON_BALL;
      $('roleTitle').textContent = isMe(who) ? 'You’re shooting' : name(who) + ' shoots';
      $('roleSub').textContent = 'Pick where to aim the ball.';
    } else if (p === 'pickKeep'){
      $('roleIcon').innerHTML = ICON_GLOVE;
      $('roleTitle').textContent = isMe(who) ? 'You’re in goal' : name(who) + ' in goal';
      $('roleSub').textContent = 'Pick where to dive.';
    } else {
      $('roleIcon').innerHTML = ICON_HAND;
      $('roleTitle').textContent = isMe(who) ? 'Your throw' : name(who) + '’s throw';
      $('roleSub').textContent = 'Pick rock, paper or scissors.';
    }
    setControls('pick');
    if (S.mode === 'online') startTimer();
  }

  /* ---------- 10-second pick timer (online only) ---------- */
  var Tm = {id:null, end:0, ticked:0};
  function startTimer(){
    stopTimer();
    Tm.end = performance.now() + TIMER_S * 1000; Tm.ticked = 0;
    $('roleTimer').hidden = false;
    Tm.id = setInterval(function(){
      var left = (Tm.end - performance.now()) / 1000;
      $('roleTimerBar').style.width = Math.max(0, left / TIMER_S * 100) + '%';
      if (left <= 3 && left > 0 && Math.ceil(left) !== Tm.ticked){ Tm.ticked = Math.ceil(left); SFX.tick(); }
      if (left <= 0){ stopTimer(); onPick(rand(), true); }
    }, 100);
  }
  function stopTimer(){ if (Tm.id){ clearInterval(Tm.id); Tm.id = null; } $('roleTimer').hidden = true; }

  function showWait(title, sub){
    $('waitTitle').textContent = title;
    $('waitSub').textContent = sub;
    setControls('wait');
  }

  function showHandoff(p, role){
    setControls('none');
    $('handTitle').textContent = 'Pass to ' + name(p);
    $('handTitle').style.color = KIT[p];
    $('handSub').textContent = role === 'shoot' ? 'You’re shooting this kick. Keep your pick hidden.'
      : role === 'keep' ? 'You’re in goal. Don’t let the shooter see your pick.'
      : 'Your throw. Keep it hidden from ' + name(1 - p) + '.';
    $('handBtn').textContent = 'I’m ' + name(p);
    $('handBtn').style.background = KIT[p];
    $('handoff').hidden = false;
    $('handBtn').onclick = function(){
      $('handoff').hidden = true;
      if (role === 'rps'){ S.rpsTurn = p; setPhase('pickRps'); }
      else setPhase(role === 'shoot' ? 'pickShot' : 'pickKeep');
    };
  }

  function flash(big, color, small){
    $('flashBig').textContent = big;
    $('flashBig').style.color = color;
    $('flashSmall').textContent = small || '';
    $('flash').hidden = false;
  }

  function beginTurn(){
    stopTimer();
    A.playing = false; A.plan = null; A.rps = null; A.done = true; A.ev = [];
    $('flash').hidden = true; $('skipHint').hidden = true;
    S.shot = null; S.dive = null; S.pa = null; S.pb = null; S.phase = null;
    setPickButtons(S.game === 'rps');
    var w = winner();
    renderBoard(w !== null);
    if (w !== null){ finishGame(w, null); return; }
    if (S.mode === 'online'){ netStep(); return; }
    if (S.game === 'rps'){
      if (S.mode === 'cpu') setPhase('pickRps'); else showHandoff(0, 'rps');
      return;
    }
    if (S.mode === 'cpu'){
      if (shooter() === 0) setPhase('pickShot');
      else { S.shot = rand(); setPhase('pickKeep'); }
    } else {
      showHandoff(shooter(), 'shoot');
    }
  }

  function onPick(z, auto){
    stopTimer();
    if (S.mode === 'online'){
      if (S.phase === 'pickShot' || S.phase === 'pickKeep' || S.phase === 'pickRps') netCommit(z, auto);
      return;
    }
    if (S.phase === 'pickRps'){
      if (S.mode === 'cpu'){ S.pa = z; S.pb = rand(); reveal(); }
      else if (S.rpsTurn === 0){ S.pa = z; showHandoff(1, 'rps'); }
      else { S.pb = z; reveal(); }
    } else if (S.phase === 'pickShot'){
      S.shot = z;
      if (S.mode === 'cpu'){ S.dive = rand(); reveal(); }
      else showHandoff(keeper(), 'keep');
    } else if (S.phase === 'pickKeep'){
      S.dive = z;
      reveal();
    }
  }

  function reveal(){
    S.phase = 'reveal';
    setControls('none');
    $('skipHint').hidden = false;
    if (S.game === 'rps'){
      var a = S.pa, b = S.pb, w = rpsBeats(a, b);
      A.plan = null; A.rps = {a:a, b:b, w:w}; A.resultT = RPS_RESULT_T;
      schedule([
        [0.0, SFX.thump], [PUMP, SFX.thump], [PUMP * 2, SFX.thump],
        [RPS_REVEAL, function(){ SFX.snap(); buzz(25); }],
        [RPS_REVEAL + 0.45, function(){ if (w === null) SFX.draw(); else SFX.win(); }, true]
      ]);
      A.onDone = function(){
        S.kicks.push({a:a, b:b, w:w});
        var line = w === null ? 'Both threw ' + SIGN[a] + '. Round replayed.' : SIGN[w === 0 ? a : b] + ' beats ' + SIGN[w === 0 ? b : a] + '.';
        afterTurn(w === null ? 'Draw' : (isMe(w) ? 'You win the round' : name(w) + ' wins the round'), w === null ? '#eef3ea' : KIT[w], line.charAt(0).toUpperCase() + line.slice(1));
      };
    } else {
      var shot = S.shot, dive = S.dive, goal = shot !== dive, shooterP = shooter();
      A.rps = null; A.plan = makePlan(shot, dive); A.resultT = RESULT_T;
      schedule([
        [0.05, SFX.whistle],
        [TC, function(){ SFX.kick(); buzz(20); }],
        [TC + TF, function(){ if (goal){ SFX.net(); SFX.cheer(); buzz([30, 40, 60]); } else { SFX.glove(); SFX.groan(); buzz(40); } }, true]
      ]);
      A.onDone = function(){
        S.kicks.push({shooter: shooterP, goal: goal, shot: shot, dive: dive});
        afterTurn(goal ? 'Goal!' : 'Saved!', goal ? KIT[shooterP] : KIT[1 - shooterP], SHOT_TXT[shot] + ', ' + DIVE_TXT[dive] + '.');
      };
    }
    A.playing = true; A.done = false;
    A.start = performance.now() - (REDUCED ? A.resultT * 1000 : 0);
  }

  function afterTurn(big, color, small){
    var w = winner();
    renderBoard(w !== null);
    if (w === null){
      flash(big, color, small);
      S.phase = 'result';
      setControls('next');
      $('nextBtn').focus({preventScroll:true});
    } else {
      finishGame(w, small);
    }
  }

  function winLine(p){ return S.mode === 'cpu' ? (p === 0 ? 'You win!' : 'Computer wins') : isMe(p) ? 'You win!' : name(p) + ' wins!'; }
  function scoreLine(){
    if (S.game === 'rps'){ var w = rpsWins(); return 'Final score ' + w[0] + '–' + w[1] + '.'; }
    var r = tally();
    return 'Final score ' + r.g[0] + '–' + r.g[1] + (S.kicks.length > 10 || S.game === 'pensd' ? ' after sudden death.' : '.');
  }

  function finishGame(w, lastLine){
    if (S.series){
      S.series.results[S.series.idx] = w;
      var sw = seriesWins();
      if (sw[0] === 2 || sw[1] === 2){
        var sWin = sw[0] === 2 ? 0 : 1;
        recordResult('mix', sWin);
        flash(S.mode === 'cpu' ? (sWin === 0 ? 'You win the duel!' : 'Computer wins the duel') : (isMe(sWin) ? 'You win the duel!' : name(sWin) + ' wins the duel!'),
              KIT[sWin], 'Mixed Duel ' + sw[0] + '–' + sw[1] + '. Last game: ' + GAME_NAME[S.game] + ', ' + scoreLine().toLowerCase());
        S.phase = 'over'; setControls('over');
      } else {
        var nextG = SERIES[S.series.idx + 1];
        flash((isMe(w) ? 'You take' : name(w) + ' takes') + ' game ' + (S.series.idx + 1), KIT[w],
              GAME_NAME[S.game] + ': ' + scoreLine().replace('Final score ', '').replace('.', '') + '. Duel ' + sw[0] + '–' + sw[1] + '.');
        $('nextGameBtn').textContent = 'Next: ' + GAME_NAME[nextG];
        S.phase = 'subover'; setControls('nextgame');
      }
      return;
    }
    recordResult(S.game === 'pensd' ? 'pen' : S.game, w);
    flash(winLine(w), KIT[w], (lastLine ? lastLine + ' ' : '') + scoreLine());
    S.phase = 'over';
    setControls('over');
  }

  function startSub(idx){
    S.series.idx = idx;
    S.game = SERIES[idx];
    S.kicks = [];
    beginTurn();
  }

  function namesFor(mode){
    var me = nick();
    return mode === 'cpu' ? [me || 'You', 'Computer'] : ['Blue', 'Orange'];
  }

  function start(mode){
    var kind = HUB.game;
    S = {mode: mode, kind: kind, names: namesFor(mode), kicks: [], phase: null,
         matchId: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)};
    if (kind === 'mix'){ S.series = {idx: 0, results: []}; S.game = 'pen'; }
    else S.game = kind;
    showScreen('game');
    ambience(true);
    beginTurn();
  }

  function showScreen(id){
    ['menu', 'lobby', 'game'].forEach(function(s){ $(s).hidden = s !== id; });
    tgBack(id !== 'menu');
    if (id !== 'game') ambience(false);
    if (id === 'menu') renderHub();
  }

  function toMenu(){
    A.playing = false; A.plan = null; A.rps = null;
    stopTimer();
    if (S && S.mode === 'online'){ netDetach(); forget(); }
    S = null;
    $('handoff').hidden = true;
    $('flash').hidden = true;
    showScreen('menu');
  }

  /* =====================================================================
     NICKNAME + STATS
     Nickname: typed once, remembered on this device. (In Telegram it will be
     prefilled from the Telegram name and confirmed once.)
     Stats: win rate and streaks for games vs the computer and online.
     Saved in your private space in the page's database when available,
     otherwise on this device.
     ===================================================================== */
  function nick(){ try { return (localStorage.getItem('pd-nick') || '').slice(0, 12); } catch (e) { return ''; } }
  function setNick(v){ try { localStorage.setItem('pd-nick', v.trim().slice(0, 12)); } catch (e) {} }
  var editingNick = false;

  function renderWho(){
    var w = $('who'), n = nick();
    w.innerHTML = '';
    if (!n || editingNick){
      var lab = document.createElement('label'); lab.htmlFor = 'nickIn'; lab.textContent = 'What should we call you?';
      var row = document.createElement('div'); row.className = 'nickrow';
      var inp = document.createElement('input'); inp.id = 'nickIn'; inp.maxLength = 12; inp.placeholder = 'Alex'; inp.autocomplete = 'nickname'; inp.value = n;
      var btn = document.createElement('button'); btn.textContent = 'Save'; btn.type = 'button';
      var save = function(){ var v = inp.value.trim(); if (!v){ inp.focus(); return; } setNick(v); editingNick = false; renderWho(); renderCpuSub(); };
      btn.onclick = save;
      inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') save(); });
      row.appendChild(inp); row.appendChild(btn);
      w.appendChild(lab); w.appendChild(row);
    } else {
      var s = document.createElement('span'); s.textContent = 'Playing as ';
      var b = document.createElement('b'); b.textContent = n;
      var ch = document.createElement('button'); ch.className = 'link'; ch.type = 'button'; ch.textContent = 'Change';
      ch.onclick = function(){ editingNick = true; renderWho(); var i = $('nickIn'); if (i) i.focus(); };
      w.appendChild(s); w.appendChild(b); w.appendChild(ch);
    }
  }
  function renderCpuSub(){
    $('cpuSub').textContent = HUB.game === 'rps' ? 'First to 3 rounds. You’re blue.' : HUB.game === 'mix' ? 'Best of 3 games. You’re blue.' : 'You wear blue and shoot first.';
  }

  var Stats = {data:null, ref:null};
  function emptyStats(){ var z = function(){ return {w:0, l:0, cur:0, best:0}; }; return {all:z(), pen:z(), rps:z(), mix:z(), seen:[]}; }
  function cloudOk(){ return tgOk('6.9') && TG.CloudStorage; }
  function saveCloudStats(){ if (!cloudOk()) return; try { TG.CloudStorage.setItem('pd-stats', JSON.stringify(Stats.data)); } catch (e) {} }
  function loadStats(){
    var d = null;
    try { d = JSON.parse(localStorage.getItem('pd-stats') || 'null'); } catch (e) {}
    Stats.data = d && d.all ? d : emptyStats();
    if (!cloudOk()) return;
    try {
      TG.CloudStorage.getItem('pd-stats', function(err, v){
        var x = null; try { x = v ? JSON.parse(v) : null; } catch (e) {}
        if (x && x.all){
          Stats.data = x;
          try { localStorage.setItem('pd-stats', v); } catch (e) {}
          renderStats();
        } else if (Stats.data.all.w + Stats.data.all.l > 0) saveCloudStats();
      });
    } catch (e) {}
  }
  function bumpRec(rec, won){
    if (won){ rec.w++; rec.cur++; rec.best = Math.max(rec.best, rec.cur); } else { rec.l++; rec.cur = 0; }
  }
  // Count a finished match once, only when you were one of the players (vs computer or online).
  function recordResult(kind, w){
    if (!S || (S.mode !== 'cpu' && S.mode !== 'online')) return;
    var key = S.mode === 'online' ? S.code + ':' + (S.series ? 's' + S.seriesStart : 'g' + S.gnum) : S.matchId;
    var d = Stats.data || emptyStats();
    if (d.seen.indexOf(key) >= 0) return;
    d.seen.push(key); if (d.seen.length > 60) d.seen = d.seen.slice(-60);
    var won = isMe(w);
    bumpRec(d[kind], won); bumpRec(d.all, won);
    Stats.data = d;
    try { localStorage.setItem('pd-stats', JSON.stringify(d)); } catch (e) {}
    saveCloudStats();
  }
  function pct(r){ var n = r.w + r.l; return n ? Math.round(r.w / n * 100) + '%' : '–'; }
  function renderStats(){
    var d = Stats.data || emptyStats(), a = d.all, el = $('stats');
    el.innerHTML = '';
    var h = document.createElement('h3'); h.textContent = 'Your record'; el.appendChild(h);
    if (a.w + a.l === 0){
      var p = document.createElement('p'); p.style.margin = '0'; p.style.color = 'var(--muted)'; p.style.fontSize = '15px';
      p.textContent = 'Win rate and streaks show up here after your first game vs the computer or a friend online.';
      el.appendChild(p); return;
    }
    var tiles = document.createElement('div'); tiles.className = 'tiles';
    [[a.w + a.l, 'Played'], [pct(a), 'Win rate'], [a.cur, 'Streak'], [a.best, 'Best streak']].forEach(function(t){
      var x = document.createElement('div'); x.className = 'tile';
      var b = document.createElement('b'); b.textContent = t[0];
      var s = document.createElement('span'); s.textContent = t[1];
      x.appendChild(b); x.appendChild(s); tiles.appendChild(x);
    });
    el.appendChild(tiles);
    [['pen', 'Penalty Duel'], ['rps', 'Rock Paper Scissors'], ['mix', 'Mixed Duel']].forEach(function(g){
      var r = d[g[0]]; if (r.w + r.l === 0) return;
      var row = document.createElement('div'); row.className = 'srow';
      [g[1], r.w + '–' + r.l + ' · ' + pct(r), 'Streak ' + r.cur].forEach(function(txt){ var s = document.createElement('span'); s.textContent = txt; row.appendChild(s); });
      el.appendChild(row);
    });
  }

  function renderHub(){
    Array.prototype.forEach.call(document.querySelectorAll('.game'), function(b){
      b.setAttribute('aria-checked', b.dataset.game === HUB.game ? 'true' : 'false');
    });
    renderWho(); renderCpuSub(); renderStats();
  }

  /* ---------- quick reactions (online) ---------- */
  var lastReact = 0;
  function showBubble(p, text){
    var el = document.createElement('div');
    el.className = 'bubble ' + (p === 0 ? 'l' : 'r');
    el.style.background = KITC[p];
    el.textContent = (isMe(p) ? 'You' : name(p)) + ': ' + text;
    $('stage').appendChild(el);
    SFX.pop();
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 2700);
  }
  function sendReact(text){
    var now = Date.now();
    if (!S || S.mode !== 'online' || now - lastReact < 1500) return;
    lastReact = now;
    api('react', {code: Net.code, seat: S.me, text: text}).catch(function(){});
    showBubble(S.me, text);
  }

  /* =====================================================================
     ONLINE PLAY (Telegram + Supabase server)
     The game talks to our own small server ("duel" function on Supabase):
       - every request carries Telegram's signed login, checked on the server
       - picks go to the server and stay secret until both players picked
       - the server then publishes the turn (both picks) in table "turns"
     The page reads three public tables and gets live updates:
       matches  code, names, kind (pen | rps | mix), game counter, series_start, react0/react1
       locks    who has locked in a pick for turn n (no pick inside)
       turns    finished kicks / rounds: p0 = blue's pick, p1 = orange's pick
     Online play only works inside Telegram (the server needs the Telegram login).
     ===================================================================== */
  var SB_URL = 'https://nlkbnoinoowpobvjmfgn.supabase.co';
  var SB_KEY = 'sb_publishable_WZ8HtvzQuuylVeM9vwFngQ_2Rnz0U6O';
  var FN_URL = SB_URL + '/functions/v1/duel';
  var BOT_APP = 'https://t.me/the_duelist_bot/play';
  var Net = {init:null, sb:null, ch:null, code:null, seat:null, match:null, turns:{}, locks:{},
             reactSeen:[0, 0], poll:null, gen:0};
  var NET_MSG = {
    none: 'Online play works in Telegram. Open the game at t.me/the_duelist_bot/play.',
    offline: 'Couldn’t reach the game server. Check your connection and try again.'
  };

  function netReady(){
    if (Net.init) return Net.init;
    Net.init = Promise.resolve().then(function(){
      if (!TG) return 'none';
      if (!window.supabase || !window.supabase.createClient) return 'offline';
      Net.sb = window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: false, autoRefreshToken: false}});
      return 'ok';
    }).catch(function(){ return 'offline'; });
    return Net.init;
  }

  // One call to our server. Resolves with its answer, or fails with a readable message.
  function api(action, body){
    var payload = Object.assign({action: action, initData: TG ? TG.initData : ''}, body || {});
    return fetch(FN_URL, {method: 'POST', headers: {'Content-Type': 'application/json', 'apikey': SB_KEY}, body: JSON.stringify(payload)})
      .then(function(r){
        return r.json().catch(function(){ return {}; }).then(function(d){
          if (!r.ok || d.error){ var e = new Error(d.message || NET_MSG.offline); e.code = d.error || 'http'; throw e; }
          return d;
        });
      }, function(){ var e = new Error(NET_MSG.offline); e.code = 'offline'; throw e; });
  }

  function remember(code, seat){ try { localStorage.setItem('pd-match', JSON.stringify({code:code, seat:seat})); } catch (e) {} }
  function recall(){ try { return JSON.parse(localStorage.getItem('pd-match') || 'null'); } catch (e) { return null; } }
  function forget(){ try { localStorage.removeItem('pd-match'); } catch (e) {} }
  function lockKey(g, n){ return g + '_' + n; }
  function inviteLink(code){ return BOT_APP + '?startapp=' + code; }

  function lobbyErr(msg){ $('lobbyErr').textContent = msg || ''; }
  function setLobbyBusy(b){ $('createBtn').disabled = b; $('joinBtn').disabled = b; }

  function openLobby(prefill, autoJoin){
    if (!nick()){ editingNick = true; showScreen('menu'); var i = $('nickIn'); if (i){ i.focus(); i.placeholder = 'Pick a name first'; } return; }
    showScreen('lobby');
    $('lobbyGame').textContent = GAME_NAME[HUB.game];
    $('lobbyForm').hidden = false; $('waitBox').hidden = true;
    lobbyErr('');
    if (prefill) $('codeIn').value = prefill;
    setLobbyBusy(true);
    netReady().then(function(st){
      setLobbyBusy(st !== 'ok');
      if (st !== 'ok'){ lobbyErr(NET_MSG[st]); return; }
      if (autoJoin && prefill) joinMatch();
    });
  }

  function createMatch(){
    lobbyErr(''); setLobbyBusy(true);
    api('create', {kind: HUB.game, name: nick()}).then(function(d){
      remember(d.code, d.seat);
      netAttach(d.code, d.seat);
    }).catch(function(e){ lobbyErr(e.message); setLobbyBusy(false); });
  }

  function joinMatch(){
    lobbyErr('');
    var code = ($('codeIn').value || '').trim().toUpperCase();
    if (!/^[A-Z0-9]{4}$/.test(code)){ lobbyErr('Enter the 4-character code your friend sent you.'); return; }
    setLobbyBusy(true);
    var mem = recall(), hint = mem && mem.code === code ? mem.seat : undefined;
    api('join', {code: code, name: nick(), seat: hint}).then(function(d){
      remember(d.code, d.seat);
      netAttach(d.code, d.seat);
    }).catch(function(e){ lobbyErr(e.message); setLobbyBusy(false); });
  }

  function netDetach(){
    Net.gen++;
    if (Net.ch && Net.sb){ try { Net.sb.removeChannel(Net.ch); } catch (e) {} }
    Net.ch = null;
    if (Net.poll){ clearInterval(Net.poll); Net.poll = null; }
    Net.code = null; Net.match = null; Net.turns = {}; Net.locks = {};
  }

  function addTurn(t){
    if (!t || typeof t.game !== 'number') return;
    (Net.turns[t.game] = Net.turns[t.game] || [])[t.n] = t;
  }
  function addLock(l){
    if (!l || typeof l.game !== 'number') return;
    var k = lockKey(l.game, l.n);
    (Net.locks[k] = Net.locks[k] || [false, false])[l.seat] = true;
  }

  // Load the whole match fresh (on join, after reconnecting, and as a safety net).
  function refetch(){
    var code = Net.code, gen = Net.gen;
    if (!code || !Net.sb) return Promise.resolve();
    return Promise.all([
      Net.sb.from('matches').select('*').eq('code', code).maybeSingle(),
      Net.sb.from('turns').select('game, n, p0, p1').eq('code', code),
      Net.sb.from('locks').select('game, n, seat').eq('code', code)
    ]).then(function(r){
      if (gen !== Net.gen) return;
      if (r[0].error || r[1].error || r[2].error) throw new Error('read');
      Net.match = r[0].data;
      Net.turns = {}; (r[1].data || []).forEach(addTurn);
      Net.locks = {}; (r[2].data || []).forEach(addLock);
      onNet();
    }).catch(function(){ if (gen === Net.gen) netErr(); });
  }

  function netAttach(code, seat){
    netDetach();
    var gen = Net.gen;
    Net.code = code; Net.seat = seat; Net.reactSeen = [Date.now(), Date.now()];
    var f = 'code=eq.' + code;
    Net.ch = Net.sb.channel('match-' + code + '-' + gen)
      .on('postgres_changes', {event: '*', schema: 'public', table: 'matches', filter: f}, function(p){
        if (gen === Net.gen && p.new && p.new.code){ Net.match = p.new; onNet(); }
      })
      .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'turns', filter: f}, function(p){
        if (gen === Net.gen){ addTurn(p.new); onNet(); }
      })
      .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'locks', filter: f}, function(p){
        if (gen === Net.gen){ addLock(p.new); onNet(); }
      })
      .subscribe(function(status){
        if (gen !== Net.gen) return;
        if (status === 'SUBSCRIBED') refetch();
      });
    // Safety net: if a live update is ever missed (phone asleep, weak signal), catch up every few seconds.
    Net.poll = setInterval(function(){ if (gen === Net.gen && document.visibilityState !== 'hidden') refetch(); }, 5000);
    refetch();
    $('codeShow').textContent = code;
    $('lobbyGame').textContent = GAME_NAME[HUB.game];
    $('lobbyForm').hidden = true; $('waitBox').hidden = false;
    setLobbyBusy(false);
  }

  function netErr(){
    var msg = 'Connection problem. Trying again… If it doesn’t come back, go to the menu and join again with code ' + (Net.code || '') + '.';
    if (S && S.mode === 'online'){ if (S.phase === 'wait' || S.phase === 'sending') $('waitSub').textContent = msg; }
    else lobbyErr(msg);
  }

  function netNames(){
    var m = Net.match || {};
    return [m.host_name || 'Blue', m.guest_name || 'Orange'];
  }

  function typeOf(g){
    var m = Net.match || {}, kind = m.kind || 'pen';
    if (kind !== 'mix') return kind;
    return SERIES[Math.max(0, Math.min(2, g - (m.series_start || 0)))];
  }

  // Everything both players have picked in game g, in order: kicks or RPS rounds.
  function resolvedFor(g){
    var out = [], list = Net.turns[g] || [], type = typeOf(g);
    for (var n = 0; n < list.length && list[n]; n++){
      var p0 = list[n].p0, p1 = list[n].p1;
      if (type === 'rps') out.push({a: p0, b: p1, w: rpsBeats(p0, p1)});
      else {
        var sh = n % 2, shot = sh === 0 ? p0 : p1, dive = sh === 0 ? p1 : p0;
        out.push({shooter: sh, shot: shot, dive: dive, goal: shot !== dive});
      }
    }
    return out;
  }

  function buildOnline(){
    var m = Net.match, g = m.game || 0, kind = m.kind || 'pen';
    HUB.game = kind;
    S = {mode: 'online', code: Net.code, me: Net.seat, gnum: g, kind: kind, seriesStart: m.series_start || 0,
         names: netNames(), kicks: [], phase: null};
    if (kind === 'mix'){ S.series = {idx: g - S.seriesStart, results: []}; refreshSeries(); }
    S.game = typeOf(g);
    S.kicks = resolvedFor(g);
    showScreen('game');
    ambience(true);
    beginTurn();
  }
  function refreshSeries(){
    if (!S.series) return;
    for (var i = S.seriesStart; i < S.gnum; i++) S.series.results[i - S.seriesStart] = winnerOf(typeOf(i), resolvedFor(i));
  }

  function onNet(){
    var m = Net.match;
    if (!m || !Net.code) return;
    if (!m.has_guest && !(S && S.mode === 'online')){
      if ($('lobby').hidden) showScreen('lobby');
      $('lobbyForm').hidden = true; $('waitBox').hidden = false;
      return;
    }
    if (!S || S.mode !== 'online' || S.code !== Net.code || (m.game || 0) !== S.gnum){ buildOnline(); return; }
    var nm = netNames();
    if (nm[0] !== S.names[0] || nm[1] !== S.names[1]){ S.names = nm; renderBoard(S.phase === 'over'); }
    if (S.series) refreshSeries();
    // quick reactions from the other player
    var opp = 1 - S.me, rv = m['react' + opp];
    if (rv && rv.n > Net.reactSeen[opp]){
      Net.reactSeen[opp] = rv.n;
      if (typeof rv.k === 'string') showBubble(opp, rv.k.slice(0, 12));
    }
    if (S.phase === 'pickShot' || S.phase === 'pickKeep' || S.phase === 'pickRps' || S.phase === 'wait') netStep();
  }

  function netStep(){
    if (S.phase === 'reveal' || S.phase === 'result' || S.phase === 'over' || S.phase === 'subover' || S.phase === 'sending') return;
    var n = S.kicks.length, res = resolvedFor(S.gnum);
    if (res.length > n){
      if (S.game === 'rps'){ S.pa = res[n].a; S.pb = res[n].b; }
      else { S.shot = res[n].shot; S.dive = res[n].dive; }
      reveal(); return;
    }
    var lk = Net.locks[lockKey(S.gnum, n)] || [false, false];
    var oppName = S.names[1 - S.me];
    if (lk[S.me]){
      S.phase = 'wait';
      showWait('Locked in', lk[1 - S.me] ? 'Both picks are in. Revealing…' : 'Waiting for ' + oppName + ' to pick…');
      return;
    }
    if (S.phase !== 'pickShot' && S.phase !== 'pickKeep' && S.phase !== 'pickRps'){
      setPhase(S.game === 'rps' ? 'pickRps' : shooter() === S.me ? 'pickShot' : 'pickKeep');
    }
  }

  function netCommit(z, auto){
    var n = S.kicks.length, g = S.gnum, back = S.phase;
    S.phase = 'sending';
    showWait('Locked in', auto ? 'Time’s up. A random pick was sent for you…' : 'Sending your pick…');
    api('pick', {code: Net.code, seat: S.me, game: g, n: n, pick: z}).then(function(){
      addLock({game: g, n: n, seat: S.me});
      if (S && S.phase === 'sending') S.phase = 'wait';
      onNet();
    }).catch(function(e){
      if (!S || S.mode !== 'online') return;
      if (e.code === 'stale' || e.code === 'over'){ S.phase = 'wait'; refetch(); return; }
      setPhase(back);
      $('roleSub').textContent = e.code === 'offline' ? 'Your pick didn’t send. Check your connection and pick again.' : e.message;
    });
  }

  function netAdvance(rematch){
    $('rematchBtn').disabled = true; $('nextGameBtn').disabled = true;
    api('advance', {code: Net.code, seat: S.me, game: S.gnum, rematch: !!rematch})
      .then(refetch)
      .catch(function(e){ flash('Hmm', 'var(--chalk)', e.message); })
      .then(function(){ $('rematchBtn').disabled = false; $('nextGameBtn').disabled = false; });
  }
  function netNextGame(){ netAdvance(false); }
  function netRematch(){ netAdvance(true); }

  function shareInvite(){
    var code = $('codeShow').textContent, link = inviteLink(code);
    var text = 'Duel me in ' + GAME_NAME[HUB.game] + '! Match code ' + code;
    if (TG && TG.openTelegramLink){
      TG.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(text));
    } else {
      try { navigator.clipboard.writeText(link); } catch (e) {}
    }
  }

  /* ---------- wiring ---------- */
  Array.prototype.forEach.call(document.querySelectorAll('.game'), function(b){
    b.addEventListener('click', function(){ HUB.game = b.dataset.game; renderHub(); });
  });
  function needNick(){ if (nick()) return false; editingNick = true; renderWho(); var i = $('nickIn'); if (i){ i.focus(); i.placeholder = 'Pick a name first'; } return true; }
  $('cpuBtn').onclick = function(){ if (!needNick()) start('cpu'); };
  $('localBtn').onclick = function(){ start('local'); };
  $('onlineBtn').onclick = function(){ if (needNick()) return; var m = recall(); openLobby(m ? m.code : ''); };
  $('createBtn').onclick = createMatch;
  $('joinBtn').onclick = joinMatch;
  $('codeIn').addEventListener('keydown', function(e){ if (e.key === 'Enter') joinMatch(); });
  $('lobbyBack').onclick = function(){ netDetach(); showScreen('menu'); };
  $('copyBtn').onclick = function(){
    var b = $('copyBtn'), code = $('codeShow').textContent;
    var done = function(){ b.textContent = 'Copied'; setTimeout(function(){ b.textContent = 'Copy code'; }, 1500); };
    try { navigator.clipboard.writeText(code).then(done, function(){ selectCode(); }); } catch (e) { selectCode(); }
  };
  function selectCode(){
    var r = document.createRange(); r.selectNodeContents($('codeShow'));
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  $('nextBtn').onclick = beginTurn;
  $('nextGameBtn').onclick = function(){ if (S.mode === 'online') netNextGame(); else startSub(S.series.idx + 1); };
  $('rematchBtn').onclick = function(){ if (S.mode === 'online') netRematch(); else { HUB.game = S.kind; start(S.mode); } };
  $('quitBtn').onclick = toMenu;
  $('muteBtn').onclick = function(e){
    e.stopPropagation();
    Snd.muted = !Snd.muted;
    try { localStorage.setItem('pd-mute', Snd.muted ? '1' : '0'); } catch (err) {}
    if (Snd.muted) ambience(false); else ambience(true);
    paintMute();
  };
  $('stage').addEventListener('click', function(e){ if (e.target.closest('button')) return; skipAnim(); });
  Array.prototype.forEach.call(document.querySelectorAll('.reacts button'), function(b){
    b.addEventListener('click', function(){ sendReact(b.dataset.r); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.pick'), function(b){
    b.addEventListener('click', function(){ onPick(Number(b.dataset.z)); });
  });
  $('shareBtn').onclick = shareInvite;
  if (TG && TG.BackButton) TG.BackButton.onClick(function(){
    if (!$('game').hidden) toMenu(); else { netDetach(); showScreen('menu'); }
  });
  if (TG && !nick()){
    var tgu = TG.initDataUnsafe && TG.initDataUnsafe.user;
    if (tgu && (tgu.first_name || tgu.username)) setNick(String(tgu.first_name || tgu.username));
  }
  if (!TG){
    $('onlineBtn').querySelector('small').textContent = 'Works in Telegram: t.me/the_duelist_bot/play';
    $('shareBtn').hidden = true;
  }
  paintMute();
  loadStats();
  renderHub();
  // A link ending in #CODE opens straight into the join screen.
  if (/^#[A-Za-z0-9]{4}$/.test(location.hash)) openLobby(location.hash.slice(1).toUpperCase());
  // An invite link t.me/the_duelist_bot/play?startapp=CODE joins that match straight away.
  var startCode = TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param;
  if (startCode && /^[A-Za-z0-9]{4}$/.test(startCode)) openLobby(startCode.toUpperCase(), true);

  // Test hook, only active with #debug in the address.
  if (location.hash === '#debug'){
    window.__pd = {
      shot: function(shot, dive, t){ HUB.game = 'pen'; if (!S || S.game !== 'pen') start('cpu'); setControls('none'); A.rps = null; A.plan = makePlan(shot, dive); A.playing = true; A.freeze = t; },
      idle: function(){ if (!S) start('cpu'); A.plan = null; A.playing = false; A.freeze = null; },
      rps: function(a, b, t){ HUB.game = 'rps'; if (!S || S.game !== 'rps') start('cpu'); setControls('none'); A.plan = null; A.rps = {a:a, b:b, w:rpsBeats(a, b)}; A.playing = true; A.freeze = t; },
      rpsIdle: function(){ HUB.game = 'rps'; start('cpu'); A.freeze = null; }
    };
  }
})();
</script>
